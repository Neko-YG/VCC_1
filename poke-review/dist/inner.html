/** 카메라 — 플레이어를 화면 가운데 두되 맵 밖은 비추지 않는다. */


class Camera {
  constructor(viewW, viewH) {
    this.x = 0;
    this.y = 0;
    this.w = viewW;
    this.h = viewH;
  }

  follow(target, mapW, mapH) {
    const cx = target.px + TILE / 2 - this.w / 2;
    const cy = target.py + TILE / 2 - this.h / 2;
    // 맵이 화면보다 작으면 가운데 정렬
    this.x = mapW <= this.w ? (mapW - this.w) / 2 : Math.max(0, Math.min(mapW - this.w, cx));
    this.y = mapH <= this.h ? (mapH - this.h) / 2 : Math.max(0, Math.min(mapH - this.h, cy));
    this.x = Math.round(this.x);
    this.y = Math.round(this.y);
  }
}

/* ── src/game/actors/actor.js ───────────────────────────────── */
/**
 * 격자 단위로 움직이는 캐릭터.
 * 칸에서 칸으로 '미끄러지듯' 이동하되 논리 좌표(gx,gy)는 항상 정수라
 * 충돌·상호작용 판정이 단순해진다. (4세대 필드와 같은 방식)
 */



const WALK_SPEED = 4.2; // 초당 타일
const RUN_SPEED = 7.5;

const DELTA = {
  up: [0, -1],
  down: [0, 1],
  left: [-1, 0],
  right: [1, 0],
};

class Actor {
  constructor({ x, y, dir = 'down', palette = 'blue', id = null }) {
    this.id = id;
    this.gx = x;
    this.gy = y;
    this.dir = dir;
    this.px = x * TILE;
    this.py = y * TILE;
    this.sheet = charSheet(palette);
    this.moving = false;
    this.animTime = 0;
    this.animIndex = 0;
    this._from = { x: this.px, y: this.py };
    this._to = { x: this.px, y: this.py };
    this._t = 0;
    this._duration = 0;
  }

  /** 지금 서 있는 칸 앞의 좌표 */
  facing() {
    const [dx, dy] = DELTA[this.dir];
    return { x: this.gx + dx, y: this.gy + dy };
  }

  /**
   * 한 칸 이동 시도. 막혀 있으면 방향만 바꾸고 false.
   * @param {(x:number,y:number)=>boolean} isBlocked
   */
  tryMove(dir, isBlocked, { run = false } = {}) {
    this.dir = dir;
    if (this.moving) return false;
    const [dx, dy] = DELTA[dir];
    const nx = this.gx + dx;
    const ny = this.gy + dy;
    if (isBlocked(nx, ny)) return false;

    this.gx = nx;
    this.gy = ny;
    this._from = { x: this.px, y: this.py };
    this._to = { x: nx * TILE, y: ny * TILE };
    this._t = 0;
    this._duration = 1 / (run ? RUN_SPEED : WALK_SPEED);
    this.moving = true;
    return true;
  }

  update(dt) {
    if (this.moving) {
      this._t += dt;
      const k = Math.min(1, this._t / this._duration);
      this.px = this._from.x + (this._to.x - this._from.x) * k;
      this.py = this._from.y + (this._to.y - this._from.y) * k;
      this.animTime += dt;
      if (this.animTime >= this._duration / 2) {
        this.animTime = 0;
        this.animIndex = (this.animIndex + 1) % WALK_CYCLE.length;
      }
      if (k >= 1) {
        this.moving = false;
        this.px = this._to.x;
        this.py = this._to.y;
      }
    } else {
      this.animTime = 0;
      this.animIndex = 0;
    }
  }

  draw(ctx, camera) {
    // 스프라이트가 타일보다 크므로 발밑을 타일에 맞춘다
    const x = this.px - camera.x;
    const y = this.py - camera.y - (CH - TILE);
    drawChar(ctx, this.sheet, this.dir, WALK_CYCLE[this.animIndex], x, y);
  }
}

/** NPC — 서 있다가 말을 걸면 플레이어 쪽을 돌아본다 */
class Npc extends Actor {
  constructor(def) {
    super({ x: def.x, y: def.y, dir: def.dir, palette: def.palette, id: def.id });
    this.def = def;
    this.homeDir = def.dir;
  }

  lookAt(actor) {
    const dx = actor.gx - this.gx;
    const dy = actor.gy - this.gy;
    this.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up';
  }
}

/* ── src/game/ui/textbox.js ───────────────────────────────── */
/**
 * 대화창 — 한 글자씩 찍히고, 확인키로 넘긴다.
 * 캔버스가 아니라 DOM 으로 그린다: 한글이 또렷하고 화면 크기에 맞춰 늘어난다.
 */


const CHARS_PER_SEC = 45;

class TextBox {
  constructor(root) {
    this.nameEl = h('div', { class: 'gb-box__name' });
    this.textEl = h('div', { class: 'gb-box__text' });
    this.arrowEl = h('div', { class: 'gb-box__arrow' }, '▼');
    this.el = h('div', { class: 'gb-box', hidden: true }, this.nameEl, this.textEl, this.arrowEl);
    root.appendChild(this.el);

    this.lines = [];
    this.index = 0;
    this.shown = 0;
    this.open = false;
    this.onDone = null;
  }

  /**
   * @param {string[]} lines
   * @param {{speaker?:string, onDone?:()=>void}} opts
   */
  show(lines, { speaker = '', onDone = null } = {}) {
    this.lines = lines.filter(Boolean);
    this.index = 0;
    this.shown = 0;
    this.open = true;
    this.onDone = onDone;
    this.nameEl.textContent = speaker;
    this.nameEl.hidden = !speaker;
    this.el.hidden = false;
    this._render();
  }

  /** 확인키. 타이핑 중이면 즉시 완성, 끝났으면 다음 줄 / 닫기 */
  advance() {
    if (!this.open) return;
    const full = this.lines[this.index] || '';
    if (this.shown < full.length) {
      this.shown = full.length;
      this._render();
      return;
    }
    if (this.index < this.lines.length - 1) {
      this.index++;
      this.shown = 0;
      this._render();
      return;
    }
    this.hide();
    const done = this.onDone;
    this.onDone = null;
    done?.();
  }

  update(dt) {
    if (!this.open) return;
    const full = this.lines[this.index] || '';
    if (this.shown < full.length) {
      this.shown = Math.min(full.length, this.shown + CHARS_PER_SEC * dt);
      this._render();
    }
  }

  get typing() {
    return this.open && this.shown < (this.lines[this.index] || '').length;
  }

  hide() {
    this.open = false;
    this.el.hidden = true;
  }

  _render() {
    const full = this.lines[this.index] || '';
    this.textEl.textContent = full.slice(0, Math.floor(this.shown));
    this.arrowEl.hidden = this.typing;
  }

  dispose() {
    clear(this.el);
    this.el.remove();
  }
}

/** 지역명 배너 — 맵에 들어설 때 "여기는 ○○" 하고 잠깐 떴다 사라진다. */


class Banner {
  constructor(root) {
    this.titleEl = h('div', { class: 'gb-banner__title' });
    this.subEl = h('div', { class: 'gb-banner__sub' });
    this.el = h('div', { class: 'gb-banner', hidden: true }, h('span', { class: 'gb-banner__arrow' }, '↓'), h('div', {}, this.titleEl, this.subEl));
    root.appendChild(this.el);
    this.timer = 0;
  }

  show(title, subtitle = '', seconds = 2.4) {
    this.titleEl.textContent = title;
    this.subEl.textContent = subtitle;
    this.subEl.hidden = !subtitle;
    this.el.hidden = false;
    this.el.classList.remove('is-in');
    void this.el.offsetWidth; // 애니메이션 재시작
    this.el.classList.add('is-in');
    this.timer = seconds;
  }

  update(dt) {
    if (this.timer <= 0) return;
    this.timer -= dt;
    if (this.timer <= 0) {
      this.el.hidden = true;
      this.el.classList.remove('is-in');
    }
  }

  dispose() {
    this.el.remove();
  }
}

/* ── src/game/scenes/field.js ───────────────────────────────── */
/**
 * 필드(오버월드) 씬 — 걸어다니고, 말을 걸고, 문으로 들어간다.
 * 평가 데이터는 여기서 "대사"로 바뀐다.
 */






class FieldScene {
  /**
   * @param {import('../game.js').Game} game
   * @param {object} map  world/maps.js 엔트리
   * @param {{x:number,y:number,dir:string}} spawn
   */
  constructor(game, map, spawn) {
    this.game = game;
    this.map = map;
    this.pre = renderMap(map);
    this.camera = new Camera(game.width, game.height);
    this.player = new Actor({ ...spawn, palette: 'red', id: 'player' });
    this.npcs = map.npcs.map((def) => new Npc(def));
    this.npcByCell = new Map(this.npcs.map((n) => [`${n.gx},${n.gy}`, n]));
    this.busy = false; // 대화 중에는 움직이지 않는다
  }

  enter() {
    this.game.banner.show(`여기는 ${this.map.name}`, this.map.subtitle || '');
    this.camera.follow(this.player, this.pre.width, this.pre.height);
  }

  isBlocked(x, y) {
    if (isSolid(this.map, x, y)) return true;
    if (this.npcByCell.has(`${x},${y}`)) return true;
    return false;
  }

  update(dt) {
    const { input, textbox } = this.game;

    if (textbox.open) {
      if (input.pressed('confirm') || input.pressed('cancel')) textbox.advance();
      this.player.update(dt);
      return;
    }

    if (input.pressed('confirm')) {
      if (this.interact()) return;
    }

    if (!this.player.moving && !this.busy) {
      const dir = input.direction();
      if (dir) {
        const moved = this.player.tryMove(dir, (x, y) => this.isBlocked(x, y), { run: input.isDown('run') });
        if (moved) this._pendingWarpCheck = true;
      }
    }

    const wasMoving = this.player.moving;
    this.player.update(dt);
    for (const npc of this.npcs) npc.update(dt);

    // 칸에 완전히 도착한 순간에만 워프를 판정한다
    if (wasMoving && !this.player.moving) this.checkWarp();

    this.camera.follow(this.player, this.pre.width, this.pre.height);
  }

  checkWarp() {
    const w = this.map.warps.find((v) => v.x === this.player.gx && v.y === this.player.gy);
    if (w) this.game.changeMap(w.to, { x: w.tx, y: w.ty, dir: w.dir });
  }

  /** 바라보는 칸에 무엇이 있는지 확인하고 반응 */
  interact() {
    const { x, y } = this.player.facing();
    const npc = this.npcByCell.get(`${x},${y}`);
    if (npc) {
      npc.lookAt(this.player);
      this.talkTo(npc);
      return true;
    }
    const tile = tileAt(this.map, x, y);
    if (tile?.tag === 'sign') {
      const lines = this.map.signs[`${x},${y}`] || ['글씨가 지워져 읽을 수 없다.'];
      this.game.say(lines);
      return true;
    }
    return false;
  }

  talkTo(npc) {
    const def = npc.def;
    if (def.kind === 'guide') {
      this.game.say(def.lines, { speaker: '주민' });
      return;
    }
    if (def.kind === 'member') {
      const entry = this.game.memberEntry(def.memberIndex);
      if (!entry) {
        this.game.say(['...아직 이번 달 기록이 없어.']);
        return;
      }
      this.game.say(memberLines(entry), { speaker: entry.member.name });
      return;
    }
    if (def.kind === 'leader') {
      const boss = this.game.boss();
      const entry = this.game.playerEntry();
      if (!entry) {
        this.game.say(['이번 달 기록이 없으면 승부도 없다. 돌아가라.'], { speaker: '관장' });
        return;
      }
      this.game.say(
        [
          `나는 ${boss.title} ${boss.name}. 이번 달 목표 그 자체다.`,
          boss.quote,
          `${entry.member.name}... 지난 한 달로 나를 넘어보시지.`,
        ],
        {
          speaker: boss.name,
          onDone: () => this.game.startBattle(entry, boss),
        },
      );
      return;
    }
  }

  draw(ctx, time) {
    const cam = this.camera;
    ctx.imageSmoothingEnabled = false;
    // 프리렌더된 맵에서 보이는 부분만 잘라 붙인다
    ctx.drawImage(this.pre.canvas, cam.x, cam.y, cam.w, cam.h, 0, 0, cam.w, cam.h);
    if (this.map.outdoor) drawWaterSparkle(ctx, this.pre.waterTiles, cam, time);

    // 아래쪽(y 가 큰) 캐릭터가 나중에 그려져 앞에 서도록
    const actors = [...this.npcs, this.player].sort((a, b) => a.py - b.py);
    for (const a of actors) {
      if (a.px - cam.x < -TILE * 2 || a.px - cam.x > cam.w + TILE * 2) continue;
      a.draw(ctx, cam);
    }
  }

  dispose() {}
}

/** 팀원 NPC 대사 — 이번 시즌 평가 결과를 말로 옮긴다 */
function memberLines(e) {
  const lines = [
    `이번 달 종합은 ${fmt.score(e.overall)}, 등급 ${e.grade.label}이야.`,
    `파트너 ${e.form.name}은(는) Lv.${e.progress.level}. ${e.form.isFinal ? '더 진화할 곳은 없어.' : `${e.form.nextName}까지 Lv.${e.form.nextAt}!`}`,
  ];
  const best = [...e.kpiScores].sort((a, b) => b.score - a.score)[0];
  const worst = [...e.kpiScores].sort((a, b) => a.score - b.score)[0];
  if (best) lines.push(`이번엔 특히 잘 풀린 게 있었어. 자신 있는 쪽은 확실히 밀어붙였지.`);
  if (worst && worst.score < 0.9) lines.push('...아쉬운 항목도 하나 있어. 다음 달엔 거기부터.');
  lines.push(e.battle.win ? '체육관? 이번 달은 돌파했어.' : '관장한테는 아직 안 되더라고.');
  if (e.newBadges.length) lines.push(`이번 달에 배지를 ${e.newBadges.length}개 새로 받았어!`);
  return lines;
}

/* ── src/game/scenes/battle.js ───────────────────────────────── */
/**
 * 배틀 씬 — engine/battle.js 가 만든 로그를 화면으로 재생한다.
 * 새로 계산하지 않는다: 도감에서 본 결과와 게임 안 결과가 항상 같아야 하므로.
 */





class BattleScene {
  /**
   * @param {import('../game.js').Game} game
   * @param {object} entry  evaluate.js 의 멤버 시즌 결과
   * @param {object} boss
   * @param {()=>void} onEnd
   */
  constructor(game, entry, boss, onEnd) {
    this.game = game;
    this.entry = entry;
    this.boss = boss;
    this.onEnd = onEnd;
    this.log = entry.battle.log;
    this.i = -1;
    this.playerHp = 1;
    this.foeHp = 1;
    this.targetPlayerHp = 1;
    this.targetFoeHp = 1;
    this.flash = { player: 0, foe: 0 };
    this.shake = 0;
    this.finished = false;
  }

  enter() {
    // 배너는 적 체력 상자를 가려서 배틀에서는 쓰지 않는다 (첫 로그 줄이 상대를 소개한다)
    this.next();
  }

  /** 로그 한 줄 진행 */
  next() {
    this.i++;
    if (this.i >= this.log.length) {
      this.end();
      return;
    }
    const line = this.log[this.i];
    if (typeof line.playerHp === 'number') this.targetPlayerHp = line.playerHp;
    if (typeof line.foeHp === 'number') this.targetFoeHp = line.foeHp;
    if (line.dmg > 0) {
      const side = line.kind === 'player' ? 'foe' : 'player';
      this.flash[side] = 0.5;
      this.shake = 0.18;
    }
    this.game.textbox.show([line.text], {
      speaker: line.kind === 'foe' ? this.boss.name : '',
      onDone: () => this.next(),
    });
  }

  end() {
    if (this.finished) return;
    this.finished = true;
    const e = this.entry;
    const lines = [];
    lines.push(e.battle.win ? '체육관을 돌파했다!' : '이번 달은 여기까지...');
    lines.push(`${e.member.name}은(는) ${e.expFromBattle.toLocaleString()} EXP 를 얻었다!`);
    if (e.battle.win && e.battle.foe.badgeId) {
      const badge = BADGE_BY_ID[e.battle.foe.badgeId];
      if (badge) lines.push(`${badge.icon} ${badge.name}를 손에 넣었다!`);
    }
    if (e.evolved) lines.push(`...어라? 파트너의 모습이 ${e.form.name}(으)로 변했다!`);
    this.game.textbox.show(lines, { onDone: () => this.onEnd?.() });
  }

  update(dt) {
    const { input, textbox } = this.game;
    if (input.pressed('confirm') || input.pressed('cancel')) textbox.advance();

    const ease = (cur, target) => cur + (target - cur) * Math.min(1, dt * 6);
    this.playerHp = ease(this.playerHp, this.targetPlayerHp);
    this.foeHp = ease(this.foeHp, this.targetFoeHp);
    this.flash.player = Math.max(0, this.flash.player - dt * 3);
    this.flash.foe = Math.max(0, this.flash.foe - dt * 3);
    this.shake = Math.max(0, this.shake - dt);
  }

  draw(ctx, time) {
    const W = this.game.width;
    const H = this.game.height;
    const typeColor = TYPES[this.entry.species.type]?.color || '#6ee7ff';

    // 배경: 하늘 → 필드
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, '#2a3550');
    sky.addColorStop(0.55, mix('#2a3550', typeColor, 0.25));
    sky.addColorStop(1, '#16202c');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    const shakeX = this.shake > 0 ? Math.round(Math.sin(time * 90) * 2) : 0;
    ctx.save();
    ctx.translate(shakeX, 0);

    // 발판
    this.platform(ctx, W - 78, 62, 64, '#3f5a44');
    this.platform(ctx, 16, H - 72, 76, '#3f5a44');

    drawMonster(
      ctx,
      { speciesId: `boss:${this.boss.id}`, type: this.boss.type, stage: 3 },
      { x: W - 74, y: 24, size: 52, flash: this.flash.foe },
    );
    drawMonster(
      ctx,
      { speciesId: this.entry.species.id, type: this.entry.species.type, stage: this.entry.form.stage },
      { x: 22, y: H - 116, size: 56, flash: this.flash.player },
    );

    ctx.restore();

    this.hpBox(ctx, 8, 10, `${this.boss.name}`, this.boss.level, this.foeHp);
    this.hpBox(ctx, W - 118, H - 96, this.entry.form.name, this.entry.progress.level, this.playerHp);
  }

  platform(ctx, x, y, w, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + 8, w / 2, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = mix(color, '#000000', 0.25);
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + 10, w / 2 - 2, 5, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  /** DS 풍 체력 상자 */
  hpBox(ctx, x, y, name, level, ratio) {
    const w = 110;
    const h = 30;
    ctx.fillStyle = 'rgba(16,22,30,0.88)';
    ctx.fillRect(x, y, w, h);
    ctx.strokeStyle = '#e8edf5';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);

    ctx.fillStyle = '#e8edf5';
    ctx.font = '9px system-ui, sans-serif';
    ctx.textBaseline = 'top';
    ctx.fillText(name, x + 5, y + 4);
    ctx.textAlign = 'right';
    ctx.fillText(`Lv.${level}`, x + w - 5, y + 4);
    ctx.textAlign = 'left';

    ctx.fillStyle = '#0c1017';
    ctx.fillRect(x + 5, y + 18, w - 10, 6);
    const color = ratio > 0.5 ? '#4ade80' : ratio > 0.2 ? '#ffd166' : '#f87171';
    ctx.fillStyle = color;
    ctx.fillRect(x + 6, y + 19, Math.max(0, (w - 12) * ratio), 4);
  }

  dispose() {}
}

/* ── src/game/game.js ───────────────────────────────── */
/**
 * 게임 본체 — 화면(캔버스+오버레이) 생성, 입력/루프, 씬 전환.
 *
 * 평가 데이터는 절대 여기서 계산하지 않는다. evaluate.js 의 결과(league)를 받아
 * 대사와 배틀 재생에 쓰기만 한다. 그래야 도감 화면과 게임이 늘 같은 얘기를 한다.
 */









const VIEW_W = 256; // DS 상단 화면과 같은 논리 해상도
const VIEW_H = 192;

class Game {
  /**
   * @param {HTMLElement} root
   * @param {{league:object, seasonId:string, playerMemberId?:string, onNavigate?:(path:string)=>void}} opts
   */
  constructor(root, { league, seasonId, playerMemberId, onNavigate }) {
    this.root = root;
    this.league = league;
    this.seasonId = seasonId;
    this.playerMemberId = playerMemberId;
    this.onNavigate = onNavigate;
    this.width = VIEW_W;
    this.height = VIEW_H;

    this.canvas = h('canvas', { class: 'gb__canvas', width: VIEW_W, height: VIEW_H });
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;

    this.overlay = h('div', { class: 'gb__overlay' });
    this.screen = h('div', { class: 'gb__screen' }, this.canvas, this.overlay);
    this.pad = this.buildPad();
    this.el = h('div', { class: 'gb' }, this.screen, this.pad);
    root.appendChild(this.el);

    this.textbox = new TextBox(this.overlay);
    this.banner = new Banner(this.overlay);
    this.input = new Input(window);
    this.bindPad();

    this.loop = new Loop((dt, time) => this.step(dt, time));
    this.scene = null;
    this.fieldScene = null;
  }

  start() {
    const report = this.report();
    const startMap = MAPS.town;
    this.changeMap(startMap.id, startMap.spawn);
    this.loop.start();
    if (!report) {
      this.say(['이번 시즌 데이터가 없다. 관리 화면에서 시즌을 만들어 보자.']);
    }
  }

  step(dt, time) {
    this.textbox.update(dt);
    this.banner.update(dt);
    this.scene?.update(dt);
    this.scene?.draw(this.ctx, time);
    this.input.endFrame();
  }

  /* ── 씬 ─────────────────────────────────────────── */

  changeMap(mapId, spawn) {
    const map = MAPS[mapId];
    if (!map) return;
    this.scene?.dispose?.();
    this.scene = new FieldScene(this, map, spawn || map.spawn);
    this.fieldScene = this.scene;
    this.scene.enter();
  }

  startBattle(entry, boss) {
    const field = this.fieldScene;
    this.scene = new BattleScene(this, entry, boss, () => {
      this.scene = field;
      field.enter();
    });
    this.scene.enter();
  }

  say(lines, opts) {
    this.textbox.show(lines, opts);
  }

  /* ── 평가 데이터 조회 ───────────────────────────── */

  report() {
    return this.league.bySeasonId[this.seasonId] || this.league.seasonReports.at(-1) || null;
  }

  boss() {
    return this.report()?.boss || null;
  }

  /** 맵에 배치된 순서(memberIndex)로 팀원 결과 찾기 */
  memberEntry(index) {
    const report = this.report();
    if (!report) return null;
    return report.entries[index] || null;
  }

  /** 플레이어가 조작 중인 트레이너 */
  playerEntry() {
    const report = this.report();
    if (!report) return null;
    return (
      report.entries.find((e) => e.memberId === this.playerMemberId) || report.entries[0] || null
    );
  }

  /* ── 화면 버튼 ──────────────────────────────────── */

  buildPad() {
    const btn = (label, action, cls = '') =>
      h('button', { class: `gb__btn ${cls}`, dataset: { action }, type: 'button', 'aria-label': label }, label);

    this.dpad = h(
      'div',
      { class: 'gb__dpad' },
      btn('▲', 'up', 'gb__btn--up'),
      btn('◀', 'left', 'gb__btn--left'),
      btn('▶', 'right', 'gb__btn--right'),
      btn('▼', 'down', 'gb__btn--down'),
    );
    this.actions = h(
      'div',
      { class: 'gb__actions' },
      btn('B', 'cancel', 'gb__btn--b'),
      btn('A', 'confirm', 'gb__btn--a'),
    );

    const links = h(
      'div',
      { class: 'gb__links' },
      h('button', { class: 'btn btn--sm', type: 'button', onClick: () => this.onNavigate?.('/dex') }, '도감'),
      h('button', { class: 'btn btn--sm', type: 'button', onClick: () => this.onNavigate?.('/league') }, '리그'),
      h('button', { class: 'btn btn--sm', type: 'button', onClick: () => this.onNavigate?.('/admin') }, '실적 입력'),
    );

    return h(
      'div',
      { class: 'gb__pad' },
      this.dpad,
      h('p', { class: 'gb__hint' }, '이동 방향키 · 대화/확인 Z 또는 Space · 취소 X · 달리기 Shift'),
      this.actions,
      links,
    );
  }

  bindPad() {
    for (const el of this.el.querySelectorAll('.gb__btn')) {
      this.input.bindButton(el, el.dataset.action);
    }
  }

  dispose() {
    this.loop.stop();
    this.input.dispose();
    this.textbox.dispose();
    this.banner.dispose();
    this.el.remove();
  }
}

/* ── src/ui/screens/field.js ───────────────────────────────── */
/** 필드 화면 — 대시보드 라우터에 게임을 얹는 얇은 래퍼. */





/** 라우트를 떠날 때 정리해야 하므로 인스턴스를 붙들어 둔다 */
let running = null;

function disposeField() {
  running?.dispose();
  running = null;
}

function FieldScreen({ league, state, seasonId }) {
  disposeField();

  if (!league.seasonReports.length) {
    return emptyState(
      '시즌 데이터가 없어 마을을 열 수 없습니다.',
      h('button', { class: 'btn btn--primary', onClick: () => navigate('/admin') }, '관리 화면으로'),
    );
  }

  const mount = h('div', { class: 'gamewrap' });
  // 캔버스는 DOM 에 붙은 뒤에 크기가 잡히므로 다음 프레임에 시작한다
  queueMicrotask(() => {
    if (!mount.isConnected) return;
    running = new Game(mount, {
      league,
      seasonId,
      playerMemberId: state.settings.playerMemberId || state.members[0]?.id,
      onNavigate: (path) => navigate(path),
    });
    running.start();
    // 콘솔에서 좌표·씬을 들여다볼 수 있게 열어둔다 (window.PokeReview.game)
    if (window.PokeReview) window.PokeReview.game = running;
  });

  return h(
    'div',
    { class: 'screen screen--field' },
    mount,
    h(
      'p',
      { class: 'hint' },
      '체육관 문으로 들어가 관장에게 말을 걸면 이번 달 평가 배틀이 시작된다. 결과는 도감·리그와 같은 계산을 쓴다.',
    ),
  );
}

/* ── src/ui/screens/pokedex.js ───────────────────────────────── */
/** 도감 — 트레이너 목록 (최신 시즌 기준) */





let filterType = 'all';
let sortKey = 'exp';

function PokedexScreen({ league }) {
  const entries = league.members.map((m) => league.latest[m.id]).filter(Boolean);
  if (!entries.length) return emptyState('아직 평가된 트레이너가 없습니다.');

  const filtered = entries
    .filter((e) => filterType === 'all' || e.species.type === filterType)
    .sort((a, b) => {
      if (sortKey === 'exp') return b.totalExp - a.totalExp;
      if (sortKey === 'overall') return b.overall - a.overall;
      if (sortKey === 'name') return a.member.name.localeCompare(b.member.name);
      return 0;
    });

  const rerender = () => navigate('/dex');

  return h(
    'div',
    { class: 'screen' },
    panel(
      null,
      h(
        'div',
        { class: 'toolbar' },
        h(
          'div',
          { class: 'toolbar__group' },
          h(
            'button',
            { class: `pill ${filterType === 'all' ? 'is-on' : ''}`, onClick: () => ((filterType = 'all'), rerender()) },
            '전체',
          ),
          TYPE_LIST.map((t) =>
            h(
              'button',
              {
                class: `pill ${filterType === t.id ? 'is-on' : ''}`,
                style: { '--chip': t.color },
                onClick: () => ((filterType = t.id), rerender()),
              },
              `${t.name}·${t.domain}`,
            ),
          ),
        ),
        h(
          'label',
          { class: 'toolbar__sort' },
          '정렬 ',
          h(
            'select',
            { onChange: (e) => ((sortKey = e.target.value), rerender()) },
            h('option', { value: 'exp', selected: sortKey === 'exp' }, '누적 EXP'),
            h('option', { value: 'overall', selected: sortKey === 'overall' }, '최근 종합'),
            h('option', { value: 'name', selected: sortKey === 'name' }, '이름'),
          ),
        ),
      ),
    ),
    h(
      'div',
      { class: 'grid grid--cards' },
      filtered.map((e) => memberCard(e, { onClick: (r) => navigate(`/dex/${r.memberId}`) })),
    ),
    h(
      'p',
      { class: 'hint' },
      `총 ${filtered.length}명 · 최신 시즌 ${fmt.season(entries[0].seasonId)} 기준 · 타입은 파트너 종족 기준 `,
      typeChip(entries[0].species.type, { small: true }),
    ),
  );
}

/** 시즌별 종합점수 꺾은선 */
function trendChart(timeline, color) {
  const W = 640;
  const H = 180;
  const pad = 32;
  if (timeline.length < 2) return h('p', { class: 'hint' }, '시즌이 2개 이상 쌓이면 추이가 표시됩니다.');

  const xs = (i) => pad + (i * (W - pad * 2)) / (timeline.length - 1);
  // 데이터 폭에 맞춰 y축을 잡는다 (0부터 그리면 선이 납작해져 추이가 안 보인다)
  const values = timeline.map((r) => r.overall);
  const lo = Math.min(0.85, ...values) - 0.08;
  const hi = Math.max(1.15, ...values) + 0.08;
  const ys = (v) => H - pad - ((v - lo) / (hi - lo)) * (H - pad * 2);

  const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, class: 'trend', preserveAspectRatio: 'none' });
  // 기준선 1.0
  root.appendChild(svg('line', { x1: pad, x2: W - pad, y1: ys(1), y2: ys(1), class: 'trend__base' }));
  root.appendChild(
    svg('polyline', {
      points: timeline.map((r, i) => `${xs(i)},${ys(r.overall)}`).join(' '),
      class: 'trend__line',
      style: `--c:${color}`,
    }),
  );
  timeline.forEach((r, i) => {
    root.appendChild(svg('circle', { cx: xs(i), cy: ys(r.overall), r: 4, class: 'trend__dot', style: `--c:${color}` }));
    const t = svg('text', { x: xs(i), y: H - 8, class: 'trend__label', 'text-anchor': 'middle' });
    t.textContent = r.seasonId.slice(5) + '월';
    root.appendChild(t);
    const v = svg('text', { x: xs(i), y: ys(r.overall) - 10, class: 'trend__value', 'text-anchor': 'middle' });
    v.textContent = fmt.score(r.overall);
    root.appendChild(v);
  });
  return h('div', { class: 'trendwrap' }, root);
}

/** 진화 라인 표시 */
function evolutionLine(species, level) {
  return h(
    'div',
    { class: 'evoline' },
    species.line.map((entry, i) => {
      const unlocked = level >= entry.minLevel;
      return h(
        'div',
        { class: `evoline__item ${unlocked ? 'is-on' : ''}` },
        spriteFor({ speciesId: species.id, type: species.type, stage: i + 1, size: 64, animate: false }),
        h('strong', {}, entry.name),
        h('span', { class: 'hint' }, `Lv.${entry.minLevel}`),
      );
    }),
  );
}

/** 로그를 한 줄씩 재생하는 배틀 화면 */
function BattleTheater(report, entry) {
  const { battle, member, species, form, progress } = entry;
  const log = battle.log;
  let idx = 0;

  const playerHp = hpBar(1, `${form.name}  Lv.${progress.level}`);
  const foeHp = hpBar(1, `${battle.foe.name}  Lv.${battle.foe.level}`);
  const textBox = h('div', { class: 'dialog__text' }, log[0].text);
  const playerSprite = h(
    'div',
    { class: 'stage__player' },
    spriteFor({ speciesId: species.id, type: species.type, stage: form.stage, size: 128 }),
  );
  const foeSprite = h('div', { class: 'stage__foe' }, bossSprite(report.boss, 120));

  const setHp = (bar, ratio) => {
    const fill = bar.querySelector('.hpbar__fill');
    const track = bar.querySelector('.hpbar__track');
    fill.style.width = `${Math.max(0, ratio) * 100}%`;
    track.classList.remove('hpbar--ok', 'hpbar--warn', 'hpbar--danger');
    track.classList.add(ratio > 0.5 ? 'hpbar--ok' : ratio > 0.2 ? 'hpbar--warn' : 'hpbar--danger');
  };

  const step = () => {
    if (idx >= log.length - 1) return false;
    idx++;
    const line = log[idx];
    textBox.textContent = line.text;
    if (typeof line.playerHp === 'number') setHp(playerHp, line.playerHp);
    if (typeof line.foeHp === 'number') setHp(foeHp, line.foeHp);
    const hitSide = line.kind === 'player' ? foeSprite : line.kind === 'foe' ? playerSprite : null;
    if (hitSide && line.dmg > 0) {
      hitSide.classList.remove('is-hit');
      void hitSide.offsetWidth;
      hitSide.classList.add('is-hit');
    }
    return true;
  };

  let timer = null;
  const autoplay = () => {
    stop();
    timer = setInterval(() => {
      if (!root.isConnected || !step()) stop();
    }, 900);
  };
  const stop = () => {
    if (timer) clearInterval(timer);
    timer = null;
  };
  const skipAll = () => {
    stop();
    while (step());
  };

  const root = h(
    'div',
    { class: 'screen screen--battle' },
    h(
      'button',
      { class: 'btn btn--ghost btn--sm', onClick: () => (stop(), navigate(`/battle/${report.season.id}`)) },
      '← 전적으로',
    ),
    h(
      'div',
      { class: 'stage' },
      h('div', { class: 'stage__row stage__row--foe' }, h('div', { class: 'stage__hp' }, foeHp), foeSprite),
      h('div', { class: 'stage__row stage__row--player' }, playerSprite, h('div', { class: 'stage__hp' }, playerHp)),
    ),
    h(
      'div',
      { class: 'dialog' },
      textBox,
      h(
        'div',
        { class: 'dialog__actions' },
        h('button', { class: 'btn btn--sm', onClick: step }, '▶ 다음'),
        h('button', { class: 'btn btn--sm', onClick: autoplay }, '자동 재생'),
        h('button', { class: 'btn btn--sm btn--ghost', onClick: skipAll }, '끝까지'),
      ),
    ),
    panel(
      '사용 기술 (점수 상위 KPI)',
      h(
        'div',
        { class: 'movelist' },
        movesFrom(entry.kpiScores).map((mv) =>
          h(
            'div',
            { class: 'move' },
            h('div', { class: 'move__head' }, typeChip(mv.type, { small: true }), h('strong', {}, mv.name)),
            h(
              'div',
              { class: 'move__meta' },
              h('span', {}, `위력 ${mv.power}`),
              h('span', {}, `명중 ${fmt.pct(mv.accuracy)}`),
              h('span', {}, mv.category === 'physical' ? '물리' : '특수'),
            ),
          ),
        ),
      ),
      h('p', { class: 'hint' }, `${member.name}의 이번 달 실적이 곧 기술의 위력과 명중률이 된다.`),
    ),
  );

  // 화면을 떠나면 타이머 정리
  const observer = new MutationObserver(() => {
    if (!root.isConnected) {
      stop();
      observer.disconnect();
    }
  });
  queueMicrotask(() => {
    if (root.parentNode) observer.observe(root.parentNode, { childList: true });
  });

  return root;
}

function medal(rank) {
  return rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : String(rank);

function teamKpiTable(report) {
  const rows = KPIS.map((kpi) => {
    const scores = report.entries.map((e) => e.kpiScores.find((k) => k.kpiId === kpi.id));
    const avg = scores.reduce((s, k) => s + (k?.score || 0), 0) / Math.max(1, scores.length);
    const clear = scores.filter((k) => k?.cleared).length;
    return { kpi, avg, clear, total: scores.length };
  });
  return h(
    'table',
    { class: 'table' },
    h('thead', {}, h('tr', {}, h('th', {}, '항목'), h('th', {}, '영역'), h('th', {}, '팀 평균 점수'), h('th', {}, '달성 인원'))),
    h(
      'tbody',
      {},
      rows.map((r) =>
        h(
          'tr',
          {},
          h('td', {}, r.kpi.name),
          h('td', {}, typeChip(r.kpi.type, { small: true })),
          h('td', {}, fmt.score(r.avg)),
          h('td', {}, `${r.clear} / ${r.total}`),
        ),
      ),
    ),
  );
}

              h('td', {}, h('input', { value: m.role || '', onChange: (e) => store.upsertMember({ id: m.id, role: e.target.value }) })),
              h('td', {}, h('input', { value: m.team || '', onChange: (e) => store.upsertMember({ id: m.id, team: e.target.value }) })),
              h(
                'td',
                {},
                h(
                  'select',
                  { onChange: (e) => store.upsertMember({ id: m.id, speciesId: e.target.value }) },
                  h('option', { value: '', selected: !m.speciesId }, '자동 (주력 영역)'),
                  SPECIES.map((s) => h('option', { value: s.id, selected: m.speciesId === s.id }, `${s.line[0].name} (${s.type})`)),
                ),
              ),
              h(
                'td',
                {},
                h(
                  'select',
                  { onChange: (e) => store.upsertMember({ id: m.id, natureId: e.target.value }) },
                  NATURES.map((n) => h('option', { value: n.id, selected: m.natureId === n.id }, n.name)),
                ),
              ),
              h(
                'td',
                {},
                h(
                  'button',
                  {
                    class: 'btn btn--danger btn--sm',
                    onClick: () => confirm(`${m.name} 트레이너를 삭제할까요?`) && store.removeMember(m.id),
                  },
                  '삭제',
                ),
              ),
            ),
          ),
        ),
      ),
    ),
    h(
      'button',
      {
        class: 'btn btn--primary btn--sm',
        onClick: () => store.upsertMember({ id: uid('m'), name: '새 트레이너', role: '', team: '', speciesId: '', natureId: 'hardy' }),
      },
      '+ 트레이너 추가',
    ),
  );
}

/* ── 데이터 ───────────────────────────────────────────── */

function dataTools(state) {
  const textarea = h('textarea', { rows: 8, class: 'json', spellcheck: 'false' });
  textarea.value = store.exportJson();

  return h(
    'div',
    { class: 'stack' },
    h(
      'div',
      { class: 'toolbar' },
      h(
        'button',
        {
          class: 'btn btn--sm',
          onClick: () => {
            const blob = new Blob([store.exportJson()], { type: 'application/json' });
            const a = h('a', { href: URL.createObjectURL(blob), download: `pokereview-${new Date().toISOString().slice(0, 10)}.json` });
            a.click();
            URL.revokeObjectURL(a.href);
          },
        },
        '⬇ JSON 내보내기',
      ),
      h(
        'button',
        {
          class: 'btn btn--sm',
          onClick: () => {
            try {
              store.importJson(textarea.value);
              alert('불러왔습니다.');
              navigate('/admin');
            } catch (e) {
              alert(`불러오기 실패: ${e.message}`);
            }
          },
        },
        '⬆ 아래 내용으로 가져오기',
      ),
      h(
        'button',
        { class: 'btn btn--sm btn--ghost', onClick: () => confirm('예시 데이터로 되돌릴까요?') && (store.reset(), navigate('/admin')) },
        '시드 데이터로 초기화',
      ),
      h(
        'button',
        { class: 'btn btn--sm btn--danger', onClick: () => confirm('모든 데이터를 지울까요?') && (store.clearAll(), navigate('/admin')) },
        '전체 삭제',
      ),
    ),
    textarea,
    h(
      'p',
      { class: 'hint' },
      `현재 ${state.members.length}명 · ${state.seasons.length}시즌. 데이터는 이 브라우저(localStorage)에만 저장됩니다. 공유하려면 JSON 을 내보내세요.`,
    ),
  );
}

/* ── 유틸 ─────────────────────────────────────────────── */

function field(label, control) {
  return h('label', { class: 'field' }, h('span', {}, label), control);
}

function suggestNextSeasonId(state) {
  const last = state.seasons.at(-1)?.id;
  const base = last ? new Date(`${last}-01T00:00:00`) : new Date();
  if (last) base.setMonth(base.getMonth() + 1);
  return `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, '0')}`;
}

/* ── src/main.js ───────────────────────────────── */
/**
 * 앱 진입점 — 라우팅 + 재계산 + 렌더.
 *
 * 데이터 흐름 한 방향:
 *   store(state)  →  evaluateAll()  →  화면
 * 화면은 store 의 액션만 호출하고, 계산은 절대 하지 않는다.
 */













const root = document.getElementById('app');

const NAV = [
  { path: '/home', label: '홈' },
  { path: '/field', label: '필드' },
  { path: '/dex', label: '도감' },
  { path: '/battle', label: '체육관' },
  { path: '/league', label: '리그' },
  { path: '/admin', label: '관리' },
];

function ctx(params = {}) {
  const state = store.get();
  const league = evaluateAll(state);
  const seasonId =
    params.seasonId ||
    state.settings.currentSeasonId ||
    league.seasonReports.at(-1)?.season.id;
  return { state, league, params, seasonId };
}

function shell(view, { state, league, seasonId }) {
  const path = currentPath();
  const header = h(
    'header',
    { class: 'topbar' },
    h(
      'a',
      { class: 'topbar__brand', href: '#/home' },
      h('span', { class: 'topbar__logo' }, '◓'),
      h('span', {}, '월간 업적 리그'),
    ),
    h(
      'nav',
      { class: 'topbar__nav' },
      NAV.map((n) =>
        h('a', { class: `topbar__link ${path.startsWith(n.path) ? 'is-on' : ''}`, href: `#${n.path}` }, n.label),
      ),
    ),
    h(
      'label',
      { class: 'topbar__season' },
      h(
        'select',
        {
          onChange: (e) => {
            store.setSetting('currentSeasonId', e.target.value);
            navigate(basePath(path));
          },
        },
        league.seasons.map((s) => h('option', { value: s.id, selected: s.id === seasonId }, fmt.season(s.id))),
      ),
    ),
  );

  return h(
    'div',
    { class: 'app' },
    header,
    h('main', { class: 'main' }, view),
    h(
      'footer',
      { class: 'footer' },
      `${state.settings.orgName || '트레이너 리그'} · 데이터는 브라우저에만 저장됩니다 · `,
      h('a', { href: '#/admin' }, 'JSON 백업'),
    ),
  );
}

/** /battle/2026-07/m1 → /battle 처럼 시즌 전환 시 돌아갈 기본 경로 */
function basePath(path) {
  const seg = path.split('/')[1] || 'home';
  return `/${seg}`;
}

/** 경로가 바뀐 렌더에서만 맨 위로 올린다 (입력 중 재렌더 시 스크롤 유지) */
let lastPath = null;
let jumpToTop = true;

function mount(screenFn, params) {
  disposeField(); // 다른 화면으로 넘어가면 게임 루프를 반드시 멈춘다
  const c = ctx(params);
  const scrollY = jumpToTop ? 0 : window.scrollY;
  let view;
  try {
    view = screenFn(c);
  } catch (err) {
    console.error(err);
    view = emptyState(`화면을 그리는 중 오류가 발생했습니다: ${err.message}`);
  }
  clear(root);
  root.appendChild(shell(view, c));
  window.scrollTo(0, scrollY);
}

route('/home', () => mount(HomeScreen, {}));
route('/field', () => mount(FieldScreen, {}));
route('/dex', () => mount(PokedexScreen, {}));
route('/dex/:id', (params) => mount(DetailScreen, params));
route('/battle', () => mount(BattleScreen, {}));
route('/battle/:seasonId', (params) => mount(BattleScreen, params));
route('/battle/:seasonId/:memberId', (params) => mount(BattleScreen, params));
route('/league', () => mount(LeagueScreen, {}));
route('/admin', () => mount(AdminScreen, {}));

setNotFound(() => mount(() => emptyState('없는 페이지입니다.', h('a', { class: 'btn', href: '#/home' }, '홈으로')), {}));

onNavigate((path) => {
  jumpToTop = path !== lastPath;
  lastPath = path;
});

// 데이터가 바뀌면 현재 화면을 다시 그린다
store.subscribe(() => render());

startRouter();

// 콘솔에서 밸런스 확인할 때 쓰라고 열어둔다
window.PokeReview = { store, evaluateAll };
})();
</script>
