/** 좌표마다 고정된 난수 (같은 자리는 늘 같은 무늬) */
const at = (x, y, salt = '') => createRng(hashSeed(`${x},${y},${salt}`));

/* ── 지형 바탕 ──────────────────────────────────────── */

/**
 * 잔디 색조용 부드러운 노이즈.
 * 타일마다 색을 뽑으면 체커보드가, 블록으로 뽑으면 네모 얼룩이 보인다.
 * 격자점 난수를 이중선형 보간해 경계 없는 색조 변화를 만든다.
 */
function grassTone(gx, gy) {
  const S = 5;
  const fx = gx / S;
  const fy = gy / S;
  const x0 = Math.floor(fx);
  const y0 = Math.floor(fy);
  const smooth = (t) => t * t * (3 - 2 * t);
  const n = (X, Y) => at(X, Y, 'tone').next();
  const u = smooth(fx - x0);
  const v = smooth(fy - y0);
  const top = n(x0, y0) * (1 - u) + n(x0 + 1, y0) * u;
  const bottom = n(x0, y0 + 1) * (1 - u) + n(x0 + 1, y0 + 1) * u;
  return top * (1 - v) + bottom * v;
}

function drawGrass(ctx, x, y, gx, gy) {
  const rng = at(gx, gy, 'g');
  rect(ctx, x, y, TILE, TILE, mix(PAL.grass, PAL.grassAlt, grassTone(gx, gy)));
  // 잔디 결: 짧은 밝은 선 + 어두운 선 (4세대 잔디의 자잘한 텍스처)
  for (let i = 0; i < 2; i++) {
    px(ctx, x + rng.int(1, TILE - 2), y + rng.int(1, TILE - 2), PAL.grassLight);
  }
  for (let i = 0; i < 3; i++) {
    const sx = x + rng.int(1, TILE - 4);
    const sy = y + rng.int(1, TILE - 2);
    rect(ctx, sx, sy, 2, 1, PAL.grassLine);
    px(ctx, sx + 2, sy + 1, PAL.grassDark);
  }
}

/* ── 오토타일 ───────────────────────────────────────── */

/** 8방향 이웃이 같은 종류인지 */
function mask(map, gx, gy, kind) {
  const s = (dx, dy) => sameKind(map, gx + dx, gy + dy, kind);
  return {
    n: s(0, -1), s: s(0, 1), w: s(-1, 0), e: s(1, 0),
    nw: s(-1, -1), ne: s(1, -1), sw: s(-1, 1), se: s(1, 1),
  };
}

/**
 * 영역 타일(흙길·모래·물)의 가장자리.
 * 바깥 모서리는 깎아내고, 안쪽 모서리는 채워서 둥근 덩어리처럼 보이게 한다.
 * @param cut  가장자리 바깥을 무엇으로 덮을지 (보통 잔디)
 */
function autoEdge(ctx, x, y, m, { rim, cut, t = 2, corner = 3 }) {
  // 바깥 모서리 깎기 — 두 변이 모두 열려 있으면 그 귀퉁이를 잘라낸다
  const carve = (cx, cy) => rect(ctx, cx, cy, corner, corner, cut);
  if (!m.n && !m.w) carve(x, y);
  if (!m.n && !m.e) carve(x + TILE - corner, y);
  if (!m.s && !m.w) carve(x, y + TILE - corner);
  if (!m.s && !m.e) carve(x + TILE - corner, y + TILE - corner);

  // 변 테두리
  if (!m.n) rect(ctx, x + (m.w ? 0 : corner), y, TILE - (m.w ? 0 : corner) - (m.e ? 0 : corner), t, rim);
  if (!m.s) rect(ctx, x + (m.w ? 0 : corner), y + TILE - t, TILE - (m.w ? 0 : corner) - (m.e ? 0 : corner), t, rim);
  if (!m.w) rect(ctx, x, y + (m.n ? 0 : corner), t, TILE - (m.n ? 0 : corner) - (m.s ? 0 : corner), rim);
  if (!m.e) rect(ctx, x + TILE - t, y + (m.n ? 0 : corner), t, TILE - (m.n ? 0 : corner) - (m.s ? 0 : corner), rim);

  // 바깥 모서리의 대각선 테두리
  const diag = (cx, cy, sx, sy) => {
    for (let i = 0; i < corner; i++) {
      rect(ctx, cx + sx * i, cy + sy * (corner - 1 - i), 1, t, rim);
    }
  };
  if (!m.n && !m.w) diag(x, y, 1, 1);
  if (!m.n && !m.e) diag(x + TILE - 1, y, -1, 1);
  if (!m.s && !m.w) diag(x, y + TILE - t, 1, -1);
  if (!m.s && !m.e) diag(x + TILE - 1, y + TILE - t, -1, -1);

  // 안쪽 모서리 — 두 변은 같은데 대각선만 다르면 그 귀퉁이에 테두리 점
  if (m.n && m.w && !m.nw) rect(ctx, x, y, t, t, rim);
  if (m.n && m.e && !m.ne) rect(ctx, x + TILE - t, y, t, t, rim);
  if (m.s && m.w && !m.sw) rect(ctx, x, y + TILE - t, t, t, rim);
  if (m.s && m.e && !m.se) rect(ctx, x + TILE - t, y + TILE - t, t, t, rim);
}

function drawSoil(ctx, x, y, gx, gy, map) {
  drawGrass(ctx, x, y, gx, gy);
  const m = mask(map, gx, gy, 'path');
  rect(ctx, x, y, TILE, TILE, PAL.soil);
  const rng = at(gx, gy, 'soil');
  // 흙 알갱이
  for (let i = 0; i < 5; i++) px(ctx, x + rng.int(2, TILE - 3), y + rng.int(2, TILE - 3), rng.chance(0.5) ? PAL.soilLight : PAL.soilDark);
  autoEdge(ctx, x, y, m, { rim: PAL.soilEdge, cut: mix(PAL.grass, PAL.grassAlt, grassTone(gx, gy)) });
}

function drawSand(ctx, x, y, gx, gy, map) {
  drawGrass(ctx, x, y, gx, gy);
  const m = mask(map, gx, gy, 'sand');
  rect(ctx, x, y, TILE, TILE, PAL.sand);
  const rng = at(gx, gy, 'sand');
  for (let i = 0; i < 4; i++) px(ctx, x + rng.int(2, TILE - 3), y + rng.int(2, TILE - 3), rng.chance(0.5) ? PAL.sandLight : PAL.sandDark);
  autoEdge(ctx, x, y, m, { rim: PAL.sandDark, cut: mix(PAL.grass, PAL.grassAlt, grassTone(gx, gy)) });
}

/** 물 — 프레임마다 물결 위치가 달라진다 */
function drawWater(ctx, x, y, gx, gy, map, frame = 0) {
  const m = mask(map, gx, gy, 'water');
  rect(ctx, x, y, TILE, TILE, PAL.water);
  const rng = at(gx, gy, 'w');
  // 깊은 물 얼룩
  for (let i = 0; i < 2; i++) {
    rect(ctx, x + rng.int(1, TILE - 6), y + rng.int(1, TILE - 2), rng.int(3, 5), 1, PAL.waterDeep);
  }
  // 물결 — 프레임마다 한 칸씩 흐른다
  const wx = (rng.int(0, TILE - 1) + frame * 3) % TILE;
  const wy = (rng.int(0, TILE - 1) + frame * 2) % TILE;
  rect(ctx, x + wx, y + wy, 3, 1, PAL.waterLight);
  px(ctx, x + ((wx + 3) % TILE), y + wy - 1, PAL.waterLight);
  if (rng.chance(0.5)) rect(ctx, x + ((wx + 6) % TILE), y + ((wy + 5) % TILE), 2, 1, PAL.waterFoam);

  // 물가: 얕은 물 띠 + 거품선
  const shallow = mix(PAL.water, PAL.waterFoam, 0.45);
  autoEdge(ctx, x, y, m, { rim: shallow, cut: shallow, t: 3, corner: 3 });
  const foamShift = frame % 2;
  if (!m.n) rect(ctx, x + 2 + foamShift, y, TILE - 4, 1, PAL.waterFoam);
  if (!m.s) rect(ctx, x + 2 - foamShift, y + TILE - 1, TILE - 4, 1, PAL.waterFoam);
  if (!m.w) rect(ctx, x, y + 2 + foamShift, 1, TILE - 4, PAL.waterFoam);
  if (!m.e) rect(ctx, x + TILE - 1, y + 2 - foamShift, 1, TILE - 4, PAL.waterFoam);
}

/** 풀숲 — 뒤쪽 절반(캐릭터 뒤에 그려지는 부분) */
function drawTallGrassBack(ctx, x, y, gx, gy) {
  drawGrass(ctx, x, y, gx, gy);
  const rng = at(gx, gy, 't');
  rect(ctx, x, y + 5, TILE, TILE - 5, PAL.tall);
  rect(ctx, x, y + TILE - 2, TILE, 2, PAL.tallDark);
  for (let i = 0; i < 5; i++) {
    const sx = x + rng.int(0, TILE - 3);
    const h = rng.int(3, 6);
    rect(ctx, sx, y + 5 - h, 2, h, PAL.tall);
    px(ctx, sx, y + 5 - h, PAL.tallLight);
  }
}

/** 풀숲 — 앞쪽 잎(캐릭터 위에 덮여 '풀에 들어간' 느낌을 만든다) */
function drawTallGrassFront(ctx, x, y, gx, gy, sway = 0) {
  const rng = at(gx, gy, 'tf');
  for (let i = 0; i < 6; i++) {
    const sx = x + rng.int(0, TILE - 3) + (i % 2 ? sway : -sway);
    const h = rng.int(4, 7);
    rect(ctx, sx, y + TILE - h, 2, h, i % 2 ? PAL.tall : PAL.tallDark);
    px(ctx, sx, y + TILE - h, PAL.tallLight);
  }
}

function drawFlower(ctx, x, y, gx, gy) {
  drawGrass(ctx, x, y, gx, gy);
  const rng = at(gx, gy, 'f');
  const colors = [PAL.petal, PAL.petalWarm, PAL.petalPink];
  for (let i = 0; i < 3; i++) {
    const cx = x + rng.int(2, TILE - 3);
    const cy = y + rng.int(2, TILE - 3);
    const c = rng.pick(colors);
    px(ctx, cx, cy - 1, c);
    px(ctx, cx - 1, cy, c);
    px(ctx, cx + 1, cy, c);
    px(ctx, cx, cy + 1, c);
    px(ctx, cx, cy, '#f5b942');
    px(ctx, cx, cy + 2, PAL.grassDark);
  }
}

/* ── 실내 ───────────────────────────────────────────── */

function drawFloor(ctx, x, y, gx, gy) {
  rect(ctx, x, y, TILE, TILE, PAL.floor);
  rect(ctx, x, y + TILE - 1, TILE, 1, PAL.floorLine);
  rect(ctx, x + TILE - 1, y, 1, TILE, PAL.floorLine);
  const rng = at(gx, gy, 'fl');
  for (let i = 0; i < 2; i++) px(ctx, x + rng.int(2, TILE - 3), y + rng.int(2, TILE - 3), PAL.floorEdge);
}

function drawIndoorWall(ctx, x, y, gx, gy, map) {
  rect(ctx, x, y, TILE, TILE, PAL.indoorWall);
  // 벽면 타일 무늬
  rect(ctx, x, y, TILE, 1, PAL.indoorWallLight);
  rect(ctx, x, y + 7, TILE, 1, PAL.indoorWallDark);
  rect(ctx, x + 7, y, 1, 7, PAL.indoorWallDark);
  rect(ctx, x, y + 8, 1, 8, PAL.indoorWallDark);
  // 바닥과 만나는 면에 굽도리
  if (!sameKind(map, gx, gy + 1, 'indoorwall')) {
    rect(ctx, x, y + TILE - 4, TILE, 3, PAL.indoorWallDark);
    rect(ctx, x, y + TILE - 4, TILE, 1, PAL.outline);
  }
}

function drawMat(ctx, x, y, gx, gy, map) {
  drawFloor(ctx, x, y, gx, gy);
  const m = mask(map, gx, gy, 'mat');
  rect(ctx, x, y, TILE, TILE, PAL.mat);
  const rng = at(gx, gy, 'mt');
  for (let i = 0; i < 3; i++) px(ctx, x + rng.int(2, TILE - 3), y + rng.int(2, TILE - 3), PAL.matLight);
  autoEdge(ctx, x, y, m, { rim: PAL.matDark, cut: PAL.floor, t: 2, corner: 2 });
}

/* ── 오브젝트 (타일 경계를 넘어 그려도 되는 것들) ───── */

function drawTreeCanopy(ctx, x, y, gx, gy, pass) {
  const rng = at(gx, gy, 'tr');
  const cx = x + 8;
  const cy = y + 6 + rng.int(-1, 1);
  if (pass === 'outline') {
    ellipse(ctx, cx, cy, 9.5, 8.5, PAL.treeLine);
  } else if (pass === 'body') {
    ellipse(ctx, cx, cy, 8.5, 7.5, PAL.treeDark);
    ellipse(ctx, cx, cy - 1, 7.5, 6.5, PAL.tree);
  } else {
    // 잎 덩어리 하이라이트 — 뭉친 느낌을 주는 핵심
    for (let i = 0; i < 4; i++) {
      ellipse(ctx, cx + rng.int(-5, 4), cy - rng.int(0, 5), rng.int(2, 4), rng.int(2, 3), PAL.treeLight);
    }
    for (let i = 0; i < 2; i++) {
      ellipse(ctx, cx + rng.int(-4, 2), cy - rng.int(2, 6), 2, 1.5, PAL.treeHi);
    }
  }
}

function drawTrunk(ctx, x, y) {
  rect(ctx, x + 6, y + 11, 4, 5, PAL.trunk);
  rect(ctx, x + 6, y + 11, 1, 5, PAL.trunkDark);
  rect(ctx, x + 6, y + 15, 4, 1, PAL.outline);
}

function drawBush(ctx, x, y, gx, gy) {
  const rng = at(gx, gy, 'bs');
  ellipse(ctx, x + 8, y + 10, 7, 5.5, PAL.treeLine);
  ellipse(ctx, x + 8, y + 9.5, 6, 4.5, PAL.treeDark);
  ellipse(ctx, x + 8, y + 9, 5, 3.5, PAL.tree);
  for (let i = 0; i < 3; i++) ellipse(ctx, x + rng.int(4, 11), y + rng.int(6, 10), 2, 1.5, PAL.treeLight);
}

function drawRock(ctx, x, y) {
  ellipse(ctx, x + 8, y + 11, 6.5, 4.5, PAL.outline);
  ellipse(ctx, x + 8, y + 10, 5.5, 4, PAL.rock);
  ellipse(ctx, x + 6, y + 9, 3, 2, PAL.rockLight);
  ellipse(ctx, x + 10, y + 12, 3, 1.5, PAL.rockDark);
}

function drawFence(ctx, x, y, gx, gy, map) {
  const railY = y + 6;
  rect(ctx, x, railY, TILE, 2, PAL.fence);
  rect(ctx, x, railY + 2, TILE, 1, PAL.fenceDark);
  rect(ctx, x, railY + 3, TILE, 1, PAL.fenceLine);
  // 기둥은 두 칸마다 (연속 울타리가 촘촘해 보이지 않게)
  if ((gx + gy) % 2 === 0 || !sameKind(map, gx + 1, gy, 'fence')) {
    rect(ctx, x + 6, y + 2, 4, 13, PAL.fence);
    rect(ctx, x + 9, y + 2, 1, 13, PAL.fenceDark);
    rect(ctx, x + 6, y + 14, 4, 1, PAL.fenceLine);
  }
}

function drawSign(ctx, x, y) {
  rect(ctx, x + 7, y + 10, 2, 5, PAL.trunkDark);
  rect(ctx, x + 2, y + 2, 12, 9, PAL.outline);
  rect(ctx, x + 3, y + 3, 10, 7, PAL.trunk);
  rect(ctx, x + 3, y + 3, 10, 1, mix(PAL.trunk, '#ffffff', 0.35));
  for (let i = 0; i < 3; i++) rect(ctx, x + 4, y + 5 + i * 2, 8, 1, PAL.trunkDark);
}

/* ── 건물 ───────────────────────────────────────────── */

const ROOF_STYLE = {
  roof: { base: PAL.roof, light: PAL.roofLight, dark: PAL.roofDark, trim: null, symbol: null },
  roofCenter: { base: PAL.centerRoof, light: PAL.centerRoofLight, dark: PAL.centerRoofDark, trim: '#f8f8f8', symbol: 'ball' },
  roofMart: { base: PAL.martRoof, light: PAL.martRoofLight, dark: PAL.martRoofDark, trim: '#f8f8f8', symbol: null },
  roofGym: { base: PAL.gymRoof, light: PAL.gymRoofLight, dark: PAL.gymRoofDark, trim: null, symbol: 'badge' },
};

/**
 * 지붕. 종류마다 색과 장식이 다르다.
 * 용마루(위)·처마(아래)·박공(좌우)을 이웃 여부로 그려야 건물처럼 보인다.
 */
function drawRoofKind(ctx, x, y, gx, gy, map, kind) {
  const st = ROOF_STYLE[kind] || ROOF_STYLE.roof;
  const m = mask(map, gx, gy, kind);
  rect(ctx, x, y, TILE, TILE, st.base);
  for (let i = 0; i < TILE; i += 4) {
    rect(ctx, x, y + i, TILE, 1, st.dark);
    rect(ctx, x, y + i + 1, TILE, 1, mix(st.base, st.light, 0.5));
  }
  if (!m.n) {
    rect(ctx, x, y, TILE, 2, st.light);
    rect(ctx, x, y + 2, TILE, 1, st.dark);
    rect(ctx, x, y, TILE, 1, PAL.outline);
  }
  if (!m.s) {
    rect(ctx, x, y + TILE - 4, TILE, 3, st.dark);
    rect(ctx, x, y + TILE - 1, TILE, 1, PAL.outline);
  }
  if (!m.w) {
    rect(ctx, x, y, 1, TILE, PAL.outline);
    rect(ctx, x + 1, y, 1, TILE, st.trim || st.dark);
    if (st.trim) rect(ctx, x + 2, y, 1, TILE, st.trim);
  }
  if (!m.e) {
    rect(ctx, x + TILE - 1, y, 1, TILE, PAL.outline);
    rect(ctx, x + TILE - 2, y, 1, TILE, st.trim || st.dark);
    if (st.trim) rect(ctx, x + TILE - 3, y, 1, TILE, st.trim);
  }
  // 건물 심볼 — 지붕 가운데 한 칸에만
  if (st.symbol && !m.n && m.s) {
    const cx = x + TILE / 2;
    const cy = y + TILE / 2 + 2;
    if (st.symbol === 'ball' && gx % 6 === 2) {
      ellipse(ctx, cx, cy, 5, 5, PAL.outline);
      ellipse(ctx, cx, cy, 4, 4, '#f8f8f8');
      rect(ctx, x + 3, y + Math.round(TILE / 2), 11, 1, PAL.outline);
      ellipse(ctx, cx, cy - 2.5, 3.6, 2.4, '#e04030');
      ellipse(ctx, cx, cy, 1.6, 1.6, PAL.outline);
      ellipse(ctx, cx, cy, 0.9, 0.9, '#f8f8f8');
    }
    if (st.symbol === 'badge' && gx % 9 === 4) {
      ellipse(ctx, cx, cy, 5, 5, PAL.outline);
      ellipse(ctx, cx, cy, 4, 4, '#ffd166');
      ellipse(ctx, cx, cy, 2, 2, '#f0f4f8');
    }
  }
}

function drawRoof(ctx, x, y, gx, gy, map) {
  drawRoofKind(ctx, x, y, gx, gy, map, 'roof');
}

function drawWallBase(ctx, x, y, gx, gy, map) {
  rect(ctx, x, y, TILE, TILE, PAL.wall);
  // 벽돌 줄눈
  rect(ctx, x, y + 7, TILE, 1, PAL.wallDark);
  rect(ctx, x, y + 15, TILE, 1, PAL.wallDark);
  rect(ctx, x + 7, y, 1, 7, PAL.wallDark);
  rect(ctx, x, y + 8, 1, 7, PAL.wallDark);
  if (!sameKind(map, gx - 1, gy, 'wall') && !sameKind(map, gx - 1, gy, 'window') && !sameKind(map, gx - 1, gy, 'door')) {
    rect(ctx, x, y, 1, TILE, PAL.wallLine);
  }
  if (!sameKind(map, gx + 1, gy, 'wall') && !sameKind(map, gx + 1, gy, 'window') && !sameKind(map, gx + 1, gy, 'door')) {
    rect(ctx, x + TILE - 1, y, 1, TILE, PAL.wallLine);
  }
  if (!sameKind(map, gx, gy + 1, 'wall')) rect(ctx, x, y + TILE - 1, TILE, 1, PAL.outline);
}

function drawWindow(ctx, x, y, gx, gy, map) {
  drawWallBase(ctx, x, y, gx, gy, map);
  rect(ctx, x + 2, y + 3, 12, 9, PAL.outline);
  rect(ctx, x + 3, y + 4, 10, 7, PAL.window);
  rect(ctx, x + 3, y + 4, 10, 2, mix(PAL.window, '#ffffff', 0.55));
  rect(ctx, x + 3, y + 9, 10, 2, PAL.windowDark);
  rect(ctx, x + 7, y + 4, 1, 7, PAL.outline);
}

function drawDoor(ctx, x, y, gx, gy, map) {
  drawWallBase(ctx, x, y, gx, gy, map);
  rect(ctx, x + 2, y + 1, 12, 15, PAL.outline);
  rect(ctx, x + 3, y + 2, 10, 14, PAL.door);
  rect(ctx, x + 4, y + 3, 8, 12, mix(PAL.door, '#ffffff', 0.22));
  rect(ctx, x + 4, y + 3, 8, 1, mix(PAL.door, '#ffffff', 0.5));
  rect(ctx, x + 8, y + 2, 1, 14, PAL.doorDark);
  px(ctx, x + 6, y + 9, '#ffd166');
  px(ctx, x + 10, y + 9, '#ffd166');
}

/** 센터 카운터 */
function drawCounter(ctx, x, y, gx, gy, map) {
  drawFloor(ctx, x, y, gx, gy);
  rect(ctx, x, y + 2, TILE, 12, '#e8c890');
  rect(ctx, x, y + 2, TILE, 2, '#f8e0b0');
  rect(ctx, x, y + 12, TILE, 2, '#b08850');
  rect(ctx, x, y + 14, TILE, 1, PAL.outline);
  rect(ctx, x, y + 1, TILE, 1, PAL.outline);
  if (!sameKind(map, gx - 1, gy, 'counter')) rect(ctx, x, y + 2, 1, 12, PAL.outline);
  if (!sameKind(map, gx + 1, gy, 'counter')) rect(ctx, x + TILE - 1, y + 2, 1, 12, PAL.outline);
}

function drawPlant(ctx, x, y, gx, gy) {
  drawFloor(ctx, x, y, gx, gy);
  rect(ctx, x + 4, y + 10, 8, 6, PAL.outline);
  rect(ctx, x + 5, y + 10, 6, 5, '#b5651d');
  rect(ctx, x + 5, y + 10, 6, 1, '#d98d4a');
  ellipse(ctx, x + 8, y + 7, 5.5, 5, PAL.treeLine);
  ellipse(ctx, x + 8, y + 7, 4.5, 4, PAL.tree);
  ellipse(ctx, x + 6, y + 5, 2, 1.5, PAL.treeLight);
}

/* ── 프리렌더 ───────────────────────────────────────── */

const GROUND = {
  grass: drawGrass,
  tallgrass: drawTallGrassBack,
  flower: drawFlower,
  path: drawSoil,
  sand: drawSand,
  water: drawWater,
  floor: drawFloor,
  mat: drawMat,
  // 오브젝트 아래에도 바탕은 필요하다
  tree: drawGrass,
  bush: drawGrass,
  rock: drawGrass,
  fence: drawGrass,
  sign: drawGrass,
  wall: () => {},
  window: () => {},
  door: () => {},
  roof: () => {},
  roofCenter: () => {},
  roofMart: () => {},
  roofGym: () => {},
  indoorwall: () => {},
  plant: () => {},
  counter: () => {},
};

const OBJECT = {
  fence: drawFence,
  sign: drawSign,
  wall: drawWallBase,
  window: drawWindow,
  door: drawDoor,
  roof: drawRoof,
  roofCenter: (c, x, y, gx, gy, map) => drawRoofKind(c, x, y, gx, gy, map, 'roofCenter'),
  roofMart: (c, x, y, gx, gy, map) => drawRoofKind(c, x, y, gx, gy, map, 'roofMart'),
  roofGym: (c, x, y, gx, gy, map) => drawRoofKind(c, x, y, gx, gy, map, 'roofGym'),
  counter: drawCounter,
  indoorwall: drawIndoorWall,
  plant: drawPlant,
  bush: (ctx, x, y, gx, gy) => drawBush(ctx, x, y, gx, gy),
  rock: (ctx, x, y) => drawRock(ctx, x, y),
};

/**
 * 맵 한 프레임을 그린다.
 * 나무는 3패스(외곽선 → 몸통 → 하이라이트)로 나눠 그려야 캐노피가 서로
 * 이어져 하나의 숲처럼 보인다. 타일마다 완성해 버리면 격자가 드러난다.
 */
function renderFrame(map, frame) {
  const W = map.rows[0].length * TILE;
  const H = map.rows.length * TILE;
  const { canvas, ctx } = makeCanvas(W, H);
  const trees = [];
  const each = (fn) => {
    for (let gy = 0; gy < map.rows.length; gy++) {
      for (let gx = 0; gx < map.rows[gy].length; gx++) {
        const tile = TILES[tileCharAt(map, gx, gy)] || TILES['.'];
        fn(tile, gx, gy, gx * TILE, gy * TILE);
      }
    }
  };

  each((tile, gx, gy, x, y) => {
    // 에셋 매니페스트에 그림이 있으면 그것을 쓰고, 없으면 코드 그림
    const ch = tileCharAt(map, gx, gy);
    if (drawTileAsset(ctx, ch, x, y)) return;
    const draw = GROUND[tile.kind] || drawGrass;
    draw(ctx, x, y, gx, gy, map, frame);
    if (tile.kind === 'tree') trees.push([x, y, gx, gy]);
  });

  // 나무 줄기 먼저 (캐노피가 덮는다)
  for (const [x, y, gx, gy] of trees) {
    if (!sameKind(map, gx, gy + 1, 'tree')) drawTrunk(ctx, x, y);
  }
  for (const pass of ['outline', 'body', 'leaf']) {
    for (const [x, y, gx, gy] of trees) drawTreeCanopy(ctx, x, y, gx, gy, pass);
  }

  each((tile, gx, gy, x, y) => {
    if (drawTileAsset(ctx, tileCharAt(map, gx, gy), x, y)) return;
    const draw = OBJECT[tile.kind];
    if (draw) draw(ctx, x, y, gx, gy, map);
  });

  return canvas;
}

/**
 * @returns {{frames:HTMLCanvasElement[], width:number, height:number, tallGrass:[number,number][]}}
 */
function renderMap(map) {
  const hasWater = map.rows.some((r) => [...r].some((c) => TILES[c]?.kind === 'water'));
  const frameCount = hasWater ? WATER_FRAMES : 1;
  const frames = [];
  for (let f = 0; f < frameCount; f++) frames.push(renderFrame(map, f));

  const tallGrass = [];
  map.rows.forEach((row, gy) => {
    [...row].forEach((ch, gx) => {
      if (TILES[ch]?.kind === 'tallgrass') tallGrass.push([gx, gy]);
    });
  });

  return {
    frames,
    width: map.rows[0].length * TILE,
    height: map.rows.length * TILE,
    tallGrass,
  };
}

/* ── src/game/engine/charsprite.js ───────────────────────────────── */
/**
 * 트레이너/NPC 도트 스프라이트 생성기 (4세대 오버월드 문법, 원본 도트).
 *
 * 그 시절 캐릭터가 그렇게 보이는 이유:
 *  1) 실루엣 전체를 감싸는 어두운 외곽선 — 어떤 배경 위에서도 캐릭터가 뜬다
 *  2) 재질마다 3톤(밝은 면/바탕/그늘) — 머리·옷·바지가 각각 입체로 보인다
 *  3) 걸을 때 몸이 1px 뜨고 팔다리가 번갈아 나간다
 *
 * 시트 한 장 = 4방향 × 3프레임. 색만 바꾸면 새 캐릭터가 된다.
 */




const CW = 16; // 스프라이트 폭
const CH = 24; // 높이 (타일 16보다 커서 머리가 윗 타일을 덮는다)
const DIRS = ['down', 'left', 'right', 'up'];
/** 걷기 순서: 정지 - 왼발 - 정지 - 오른발 */
const WALK_CYCLE = [0, 1, 0, 2];

const OUTLINE = '#2a2028';

const PALETTES = {
  red: { skin: '#f8d0a8', hair: '#3a2a20', cap: '#e04030', shirt: '#e8504a', pants: '#3858a8', shoes: '#2b2b33' },
  blue: { skin: '#f8d0a8', hair: '#2f2a3a', cap: null, shirt: '#4878d8', pants: '#31405e', shoes: '#22222a' },
  green: { skin: '#f0c098', hair: '#5a3a22', cap: null, shirt: '#58b858', pants: '#4a4436', shoes: '#2b2b33' },
  purple: { skin: '#f8d8b8', hair: '#6b3a6b', cap: null, shirt: '#a868d0', pants: '#4a3a5e', shoes: '#2b2b33' },
  yellow: { skin: '#f8d0a8', hair: '#c8a33a', cap: null, shirt: '#f0c040', pants: '#5a4a2a', shoes: '#3a2f22' },
  gray: { skin: '#f0c098', hair: '#4a4a52', cap: null, shirt: '#b0b8c0', pants: '#3d4450', shoes: '#26262e' },
  brown: { skin: '#f0c098', hair: '#6b4a2a', cap: null, shirt: '#b08050', pants: '#4a3a2a', shoes: '#2b2b33' },

/* ── 부위별 그리기 ─────────────────────────────────── */

function drawHair(ctx, ox, oy, dir, pal, bob) {
  const hair = pal.hair;
  const hairLit = shade(hair, 34);
  const hairDark = shade(hair, -22);
  const y = oy + bob;

  if (pal.cap) {
    const cap = pal.cap;
    rect(ctx, ox + 3, y + 1, 10, 4, cap);
    rect(ctx, ox + 4, y + 1, 8, 1, shade(cap, 40));
    rect(ctx, ox + 3, y + 4, 10, 1, shade(cap, -45));
    // 챙 — 보는 방향으로 나온다
    if (dir === 'down') rect(ctx, ox + 3, y + 5, 10, 1, shade(cap, -45));
    if (dir === 'left') rect(ctx, ox + 1, y + 5, 6, 1, shade(cap, -45));
    if (dir === 'right') rect(ctx, ox + 9, y + 5, 6, 1, shade(cap, -45));
    if (dir === 'up') {
      rect(ctx, ox + 3, y + 5, 10, 4, hair);
      rect(ctx, ox + 4, y + 5, 8, 1, hairLit);
    } else {
      rect(ctx, ox + 3, y + 6, 2, 3, hair);
      rect(ctx, ox + 11, y + 6, 2, 3, hair);
    }
    return;
  }

  if (dir === 'up') {
    rect(ctx, ox + 3, y + 1, 10, 9, hair);
    rect(ctx, ox + 4, y + 1, 7, 2, hairLit);
    rect(ctx, ox + 3, y + 8, 10, 2, hairDark);
    return;
  }
  rect(ctx, ox + 3, y + 1, 10, 4, hair);
  rect(ctx, ox + 4, y + 1, 6, 1, hairLit);
  rect(ctx, ox + 3, y + 5, 2, 4, hair);
  rect(ctx, ox + 11, y + 5, 2, 4, hair);
  if (dir === 'left') rect(ctx, ox + 3, y + 4, 5, 2, hair);
  if (dir === 'right') rect(ctx, ox + 8, y + 4, 5, 2, hair);
  if (dir === 'down') {
    rect(ctx, ox + 4, y + 4, 3, 1, hairDark);
    rect(ctx, ox + 9, y + 4, 3, 1, hairDark);
  }
}

function drawFace(ctx, ox, oy, dir, pal, bob) {
  const y = oy + bob;
  const skin = pal.skin;
  rect(ctx, ox + 3, y + 4, 10, 6, skin);
  rect(ctx, ox + 4, y + 10, 8, 1, skin);
  rect(ctx, ox + 11, y + 5, 2, 5, shade(skin, -28)); // 오른쪽 그늘

  const eye = '#241f2b';
  if (dir === 'down') {
    rect(ctx, ox + 5, y + 6, 2, 2, eye);
    rect(ctx, ox + 9, y + 6, 2, 2, eye);
    px(ctx, ox + 5, y + 6, '#ffffff');
    px(ctx, ox + 9, y + 6, '#ffffff');
    rect(ctx, ox + 7, y + 9, 2, 1, shade(skin, -45));
  } else if (dir === 'left') {
    rect(ctx, ox + 4, y + 6, 2, 2, eye);
    px(ctx, ox + 4, y + 6, '#ffffff');
    rect(ctx, ox + 3, y + 9, 2, 1, shade(skin, -45));
  } else if (dir === 'right') {
    rect(ctx, ox + 10, y + 6, 2, 2, eye);
    px(ctx, ox + 10, y + 6, '#ffffff');
    rect(ctx, ox + 11, y + 9, 2, 1, shade(skin, -45));
  }
}

function drawBody(ctx, ox, oy, dir, frame, pal, bob) {
  const shirt = pal.shirt;
  const lit = shade(shirt, 34);
  const dark = shade(shirt, -40);
  const y = oy + bob;

  rect(ctx, ox + 4, y + 11, 8, 6, shirt);
  rect(ctx, ox + 4, y + 11, 8, 1, lit);
  rect(ctx, ox + 10, y + 12, 2, 5, dark);
  rect(ctx, ox + 4, y + 16, 8, 1, dark);

  // 팔 — 걸을 때 앞뒤로
  const swing = frame === 1 ? 1 : frame === 2 ? -1 : 0;
  const armL = y + 12 + swing;
  const armR = y + 12 - swing;
  rect(ctx, ox + 3, armL, 2, 4, dir === 'left' ? shirt : shirt);
  rect(ctx, ox + 12, armR, 2, 4, dir === 'right' ? shirt : dark);
  rect(ctx, ox + 3, armL + 4, 2, 1, pal.skin);
  rect(ctx, ox + 12, armR + 4, 2, 1, shade(pal.skin, -25));
}

function drawLegs(ctx, ox, oy, frame, pal) {
  const pants = pal.pants;
  const lit = shade(pants, 28);
  const dark = shade(pants, -35);
  // 프레임마다 한쪽 다리가 앞으로 나가 길이가 달라진다
  const l = frame === 1 ? 4 : frame === 2 ? 6 : 5;
  const r = frame === 1 ? 6 : frame === 2 ? 4 : 5;
  rect(ctx, ox + 5, oy + 17, 3, l, pants);
  rect(ctx, ox + 5, oy + 17, 1, l, lit);
  rect(ctx, ox + 8, oy + 17, 3, r, pants);
  rect(ctx, ox + 10, oy + 17, 1, r, dark);
  rect(ctx, ox + 5, oy + 17 + l, 3, 1, pal.shoes);
  rect(ctx, ox + 8, oy + 17 + r, 3, 1, pal.shoes);
}

function drawTrainer(ctx, ox, oy, dir, frame, pal) {
  const bob = frame === 0 ? 0 : -1; // 걸을 때 몸이 1px 뜬다
  drawLegs(ctx, ox, oy, frame, pal);
  drawBody(ctx, ox, oy, dir, frame, pal, bob);
  if (dir === 'up') rect(ctx, ox + 3, oy + bob + 4, 10, 6, pal.hair);
  else drawFace(ctx, ox, oy, dir, pal, bob);
  drawHair(ctx, ox, oy, dir, pal, bob);
}

/* ── 외곽선 ─────────────────────────────────────────── */

/**
 * 그려진 실루엣 둘레에 1px 외곽선을 두른다.
 * 부위마다 선을 긋는 것보다 정확하고, 팔레트를 바꿔도 그대로 동작한다.
 */
function addOutline(ctx, w, h, color = OUTLINE) {
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const alphaAt = (x, y) => (x < 0 || y < 0 || x >= w || y >= h ? 0 : d[((y * w + x) << 2) + 3]);
  const solid = (x, y) => alphaAt(x, y) > 200;
  const targets = [];
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (solid(x, y)) continue;
      if (solid(x - 1, y) || solid(x + 1, y) || solid(x, y - 1) || solid(x, y + 1)) targets.push([x, y]);
    }
  }
  ctx.fillStyle = color;
  for (const [x, y] of targets) ctx.fillRect(x, y, 1, 1);
}

/**
 * 팔레트 하나로 시트 생성 (4방향 × 3프레임 + 발밑 그림자).
 * @returns {{canvas:HTMLCanvasElement, w:number, h:number}}
 */
function makeCharSheet(paletteId = 'red') {
  const pal = PALETTES[paletteId] || PALETTES.red;
  const { canvas, ctx } = makeCanvas(CW * 3, CH * DIRS.length);

  DIRS.forEach((dir, row) => {
    for (let frame = 0; frame < 3; frame++) {
      drawTrainer(ctx, frame * CW, row * CH, dir, frame, pal);
    }
  });
  addOutline(ctx, canvas.width, canvas.height);

  // 그림자는 외곽선 뒤에 깐다 (윤곽선이 그림자까지 두르면 안 되므로)
  ctx.globalCompositeOperation = 'destination-over';
  DIRS.forEach((_, row) => {
    for (let frame = 0; frame < 3; frame++) {
      ellipse(ctx, frame * CW + 8, row * CH + 22, 5, 2, 'rgba(0,0,0,0.25)');
    }
  });
  ctx.globalCompositeOperation = 'source-over';

  return { canvas, w: CW, h: CH };
}

const sheetCache = new Map();
function charSheet(paletteId) {
  if (!sheetCache.has(paletteId)) sheetCache.set(paletteId, makeCharSheet(paletteId));
  return sheetCache.get(paletteId);
}

/**
 * 시트에서 한 프레임을 화면에 그린다.
 * 에셋 매니페스트에 같은 이름의 캐릭터 시트가 있으면 그쪽을 우선한다.
 */
function drawChar(ctx, sheet, dir, frame, x, y, paletteId) {
  const row = Math.max(0, DIRS.indexOf(dir));
  const asset = paletteId ? characterAsset(paletteId) : null;
  if (asset) {
    ctx.drawImage(
      asset.img,
      asset.x + frame * asset.w,
      asset.y + row * asset.h,
      asset.w,
      asset.h,
      Math.round(x) + asset.ox,
      Math.round(y) + asset.oy - (asset.h - CH),
      asset.w,
      asset.h,
    );
    return;
  }
  ctx.drawImage(sheet.canvas, frame * CW, row * CH, CW, CH, Math.round(x), Math.round(y), CW, CH);
}

/** 배틀 화면처럼 크게 그릴 때 */
function drawCharScaled(ctx, sheet, dir, frame, x, y, scale) {
  const row = Math.max(0, DIRS.indexOf(dir));
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(sheet.canvas, frame * CW, row * CH, CW, CH, Math.round(x), Math.round(y), CW * scale, CH * scale);
}

/* ── src/game/engine/monsterdraw.js ───────────────────────────────── */
/** 배틀 화면용 몬스터 렌더러 — 형상은 core/monster.js, 여기선 캔버스에 찍기만 한다. */






const monsterCache = new Map();

/** 몬스터 한 마리를 size×size 픽셀 캔버스로 굽는다 */
function monsterCanvas({ speciesId, type, stage, back = false, expression = 'normal' }) {
  const key = `${speciesId}:${type}:${stage}:${back ? 'b' : 'f'}:${expression}`;
  if (monsterCache.has(key)) return monsterCache.get(key);

  const shape = monsterShape({ speciesId, stage, back, expression });
  const G = shape.size;
  const { canvas, ctx } = makeCanvas(G, G);
  const palette = tonePalette(TYPES[type]?.color || '#8ab4f8', shade);

  for (const { x, y, tone } of shape.cells) {
    ctx.fillStyle = palette[tone];
    ctx.fillRect(x, y, 1, 1);
  }
  monsterCache.set(key, canvas);
  return canvas;
}

/**
 * 배틀 화면에 그리기. 발밑 그림자까지.
 * @param {object} opts { x, y, size, flash, alpha }
 */
function drawMonster(ctx, mon, { x, y, size = 48, flash = 0, alpha = 1 }) {
  if (alpha <= 0.02) return;
  const asset = monsterAsset(mon.speciesId, mon.stage, mon.back);
  const img = asset ? asset.img : monsterCanvas(mon);
  ctx.save();
  ctx.globalAlpha = alpha;
  ellipse(ctx, x + size / 2, y + size - 1, size * 0.34, size * 0.1, 'rgba(0,0,0,0.22)');
  if (flash > 0) ctx.globalAlpha = alpha * (flash > 0.5 ? 0.35 : 1);
  ctx.imageSmoothingEnabled = false;
  if (asset) {
    ctx.drawImage(asset.img, asset.x, asset.y, asset.w, asset.h, Math.round(x), Math.round(y), size, size);
  } else {
    ctx.drawImage(img, Math.round(x), Math.round(y), size, size);
  }
  ctx.restore();
}

/* ── src/game/engine/input.js ───────────────────────────────── */
/**
 * 입력 — 키보드 · 화면 D패드 · 포인터(마우스/터치/레이저 포인터).
 * 게임 로직은 "지금 눌려 있는가(held)" 와 "이번 프레임에 눌렸는가(pressed)" 만 본다.
 * 어떤 키가 어떤 액션인지는 controls.js 가 정한다.
 */


class Input {
  constructor(target = window) {
    this.held = new Set();
    this.justPressed = new Set();
    this._onKeyDown = (e) => {
      const action = KEY_BINDINGS[e.code];
      if (!action) return;
      e.preventDefault();
      if (!this.held.has(action)) this.justPressed.add(action);
      this.held.add(action);
    };
    this._onKeyUp = (e) => {
      const action = KEY_BINDINGS[e.code];
      if (!action) return;
      e.preventDefault();
      this.held.delete(action);
    };
    this._blur = () => this.held.clear();
    target.addEventListener('keydown', this._onKeyDown);
    target.addEventListener('keyup', this._onKeyUp);
    window.addEventListener('blur', this._blur);
    this._target = target;
  }

  /**
   * 포인터(마우스·터치·자이로 레이저 포인터) 입력.
   * 화면 좌표를 논리 해상도 좌표로 바꿔 넘긴다 — 씬은 카메라를 더해 칸을 구한다.
   * @param {HTMLCanvasElement} canvas
   * @param {(p:{x:number,y:number})=>void} handler
   */
  bindPointer(canvas, handler) {
    const onDown = (e) => {
      const rect = canvas.getBoundingClientRect();
      if (!rect.width || !rect.height) return;
      handler({
        x: ((e.clientX - rect.left) / rect.width) * canvas.width,
        y: ((e.clientY - rect.top) / rect.height) * canvas.height,
      });
    };
    canvas.addEventListener('pointerdown', onDown);
    this._pointerCleanup = () => canvas.removeEventListener('pointerdown', onDown);
  }

  /** 화면 버튼용 — D패드/버튼 요소에 연결 */
  bindButton(el, action) {
    const down = (e) => {
      e.preventDefault();
      if (!this.held.has(action)) this.justPressed.add(action);
      this.held.add(action);
    };
    const up = (e) => {
      e.preventDefault();
      this.held.delete(action);
    };
    el.addEventListener('pointerdown', down);
    el.addEventListener('pointerup', up);
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerleave', up);
  }

  isDown(action) {
    return this.held.has(action);
  }

  pressed(action) {
    return this.justPressed.has(action);
  }

  /**
   * 방향키 중 지금 눌린 것.
   * 톡 눌렀다 뗀 경우(키다운·키업이 한 프레임 안에 다 일어난 경우)도 살려야
   * "제자리에서 방향만 돌리기"가 된다.
   */
  direction() {
    for (const dir of ['up', 'down', 'left', 'right']) {
      if (this.held.has(dir) || this.justPressed.has(dir)) return dir;
    }
    return null;
  }

  /** 매 프레임 끝에서 호출 */
  endFrame() {
    this.justPressed.clear();
  }

  dispose() {
    this._pointerCleanup?.();
    this._target.removeEventListener('keydown', this._onKeyDown);
    this._target.removeEventListener('keyup', this._onKeyUp);
    window.removeEventListener('blur', this._blur);
  }
}

/* ── src/game/engine/loop.js ───────────────────────────────── */
/** 게임 루프 — requestAnimationFrame, dt 는 초 단위로 넘긴다. */

class Loop {
  /** @param {(dt:number, time:number)=>void} step */
  constructor(step) {
    this.step = step;
    this.running = false;
    this.time = 0;
    this._last = 0;
    this._frame = 0;
    this._tick = this._tick.bind(this);
  }

  start() {
    if (this.running) return;
    this.running = true;
    this._last = performance.now();
    this._frame = requestAnimationFrame(this._tick);
  }

  stop() {
    this.running = false;
    cancelAnimationFrame(this._frame);
  }

  _tick(now) {
    if (!this.running) return;
    // rAF 타임스탬프는 '그 프레임이 시작된 시각'이라 start() 직후 첫 호출에서
    // now 가 _last 보다 앞설 수 있다(= dt 음수). 시간이 거꾸로 흐르면 애니메이션
    // 프레임 인덱스가 음수가 되므로 0 으로 막는다.
    // 상한은 탭이 백그라운드에 다녀왔을 때 dt 가 튀는 걸 막는 용도.
    const dt = Math.max(0, Math.min(0.05, (now - this._last) / 1000));
    this._last = now;
    this.time += dt;
    this.step(dt, this.time);
    this._frame = requestAnimationFrame(this._tick);
  }
}

/** 맵이 직사각형인지 검사 — 줄 길이가 어긋나면 렌더링이 통째로 어긋난다 */
function validateMaps(maps = MAPS) {
  const problems = [];
  for (const map of Object.values(maps)) {
    const w = map.rows[0].length;
    map.rows.forEach((row, i) => {
      if (row.length !== w) problems.push(`${map.id}: ${i}번 줄 길이 ${row.length} (기대 ${w})`);
    });
    const spawnRow = map.rows[map.spawn.y];
    if (!spawnRow || !spawnRow[map.spawn.x]) problems.push(`${map.id}: spawn 좌표가 맵 밖`);
    for (const w2 of map.warps) {
      if (!maps[w2.to]) problems.push(`${map.id}: 워프 대상 '${w2.to}' 없음`);
    }
  }
  return problems;
}

/** 카메라 — 플레이어를 화면 가운데 두되 맵 밖은 비추지 않는다. */


class Camera {
  constructor(viewW, viewH) {
    this.x = 0;
    this.y = 0;
    this.w = viewW;
    this.h = viewH;
  }

  follow(target, mapW, mapH) {
    const cx = target.px + TILE / 2 - this.w / 2;
    const cy = target.py + TILE / 2 - this.h / 2;
    // 맵이 화면보다 작으면 가운데 정렬
    this.x = mapW <= this.w ? (mapW - this.w) / 2 : Math.max(0, Math.min(mapW - this.w, cx));
    this.y = mapH <= this.h ? (mapH - this.h) / 2 : Math.max(0, Math.min(mapH - this.h, cy));
    this.x = Math.round(this.x);
    this.y = Math.round(this.y);
  }
}

/* ── src/game/actors/actor.js ───────────────────────────────── */
/**
 * 격자 단위로 움직이는 캐릭터.
 * 칸에서 칸으로 '미끄러지듯' 이동하되 논리 좌표(gx,gy)는 항상 정수라
 * 충돌·상호작용 판정이 단순해진다. (4세대 필드와 같은 방식)
 */



const WALK_SPEED = 4.2; // 초당 타일
const RUN_SPEED = 7.5;

const DELTA = {
  up: [0, -1],
  down: [0, 1],
  left: [-1, 0],
  right: [1, 0],
};

class Actor {
  constructor({ x, y, dir = 'down', palette = 'blue', id = null }) {
    this.id = id;
    this.gx = x;
    this.gy = y;
    this.dir = dir;
    this.px = x * TILE;
    this.py = y * TILE;
    this.palette = palette;
    this.sheet = charSheet(palette);
    this.moving = false;
    this.animTime = 0;
    this.animIndex = 0;
    this._from = { x: this.px, y: this.py };
    this._to = { x: this.px, y: this.py };
    this._t = 0;
    this._duration = 0;
  }

  /** 지금 서 있는 칸 앞의 좌표 */
  facing() {
    const [dx, dy] = DELTA[this.dir];
    return { x: this.gx + dx, y: this.gy + dy };
  }

  /**
   * 한 칸 이동 시도. 막혀 있으면 방향만 바꾸고 false.
   * @param {(x:number,y:number)=>boolean} isBlocked
   */
  tryMove(dir, isBlocked, { run = false } = {}) {
    this.dir = dir;
    if (this.moving) return false;
    const [dx, dy] = DELTA[dir];
    const nx = this.gx + dx;
    const ny = this.gy + dy;
    if (isBlocked(nx, ny)) return false;

    this.gx = nx;
    this.gy = ny;
    this._from = { x: this.px, y: this.py };
    this._to = { x: nx * TILE, y: ny * TILE };
    this._t = 0;
    this._duration = 1 / (run ? RUN_SPEED : WALK_SPEED);
    this.moving = true;
    return true;
  }

  update(dt) {
    if (this.moving) {
      this._t += dt;
      const k = Math.min(1, this._t / this._duration);
      this.px = this._from.x + (this._to.x - this._from.x) * k;
      this.py = this._from.y + (this._to.y - this._from.y) * k;
      this.animTime += dt;
      if (this.animTime >= this._duration / 2) {
        this.animTime = 0;
        this.animIndex = (this.animIndex + 1) % WALK_CYCLE.length;
      }
      if (k >= 1) {
        this.moving = false;
        this.px = this._to.x;
        this.py = this._to.y;
      }
    } else {
      this.animTime = 0;
      this.animIndex = 0;
    }
  }

  draw(ctx, camera) {
    // 스프라이트가 타일보다 크므로 발밑을 타일에 맞춘다
    const x = this.px - camera.x;
    const y = this.py - camera.y - (CH - TILE);
    drawChar(ctx, this.sheet, this.dir, WALK_CYCLE[this.animIndex], x, y, this.palette);
  }
}

/** NPC — 서 있다가 말을 걸면 플레이어 쪽을 돌아본다 */
class Npc extends Actor {
  constructor(def) {
    super({ x: def.x, y: def.y, dir: def.dir, palette: def.palette, id: def.id });
    this.def = def;
    this.homeDir = def.dir;
  }

  lookAt(actor) {
    const dx = actor.gx - this.gx;
    const dy = actor.gy - this.gy;
    this.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up';
  }
}

/* ── src/game/world/path.js ───────────────────────────────── */
/**
 * 격자 경로 탐색 (BFS).
 * 포인터로 찍은 칸까지 걸어가거나, 프레젠터 모드에서 대상까지 자동으로 갈 때 쓴다.
 * 맵이 작아(수천 칸) BFS 로 충분하고, 결과가 항상 같아 디버깅이 쉽다.
 */


/**
 * @param {{x:number,y:number}} from
 * @param {{x:number,y:number}} to
 * @param {(x:number,y:number)=>boolean} isBlocked
 * @param {{maxNodes?:number, adjacent?:boolean}} opts
 *        adjacent=true 면 목표 칸이 막혀 있어도 '옆칸까지' 간다 (NPC·문 앞)
 * @returns {{x:number,y:number}[]} from 다음 칸부터의 경로. 못 가면 빈 배열
 */
function findPath(from, to, isBlocked, { maxNodes = 4000, adjacent = false } = {}) {
  const key = (x, y) => `${x},${y}`;
  const goals = new Set();
  if (adjacent) {
    for (const [dx, dy] of Object.values(DELTA)) {
      const gx = to.x + dx;
      const gy = to.y + dy;
      if (!isBlocked(gx, gy)) goals.add(key(gx, gy));
    }
  } else {
    if (isBlocked(to.x, to.y)) return [];
    goals.add(key(to.x, to.y));
  }
  if (goals.has(key(from.x, from.y))) return [];
  if (!goals.size) return [];

  const prev = new Map([[key(from.x, from.y), null]]);
  const queue = [{ x: from.x, y: from.y }];
  let head = 0;
  let found = null;

  while (head < queue.length && head < maxNodes) {
    const cur = queue[head++];
    for (const [dx, dy] of Object.values(DELTA)) {
      const nx = cur.x + dx;
      const ny = cur.y + dy;
      const k = key(nx, ny);
      if (prev.has(k) || isBlocked(nx, ny)) continue;
      prev.set(k, cur);
      if (goals.has(k)) {
        found = { x: nx, y: ny };
        head = queue.length;
        break;
      }
      queue.push({ x: nx, y: ny });
    }
  }
  if (!found) return [];

  const path = [];
  let cur = found;
  while (cur) {
    path.push(cur);
    cur = prev.get(key(cur.x, cur.y));
  }
  path.pop(); // 출발 칸 제거
  return path.reverse();
}

/** 경로의 첫 칸으로 가는 방향 */
function stepDirection(from, next) {
  if (next.x > from.x) return 'right';
  if (next.x < from.x) return 'left';
  if (next.y > from.y) return 'down';
  return 'up';
}

/* ── src/game/ui/textbox.js ───────────────────────────────── */
/**
 * 대화창 — 한 글자씩 찍히고, 확인키로 넘긴다.
 * 캔버스가 아니라 DOM 으로 그린다: 한글이 또렷하고 화면 크기에 맞춰 늘어난다.
 */


const CHARS_PER_SEC = 45;

class TextBox {
  constructor(root) {
    this.nameEl = h('div', { class: 'gb-box__name' });
    this.textEl = h('div', { class: 'gb-box__text' });
    this.arrowEl = h('div', { class: 'gb-box__arrow' }, '▼');
    this.el = h('div', { class: 'gb-box', hidden: true }, this.nameEl, this.textEl, this.arrowEl);
    root.appendChild(this.el);

    this.lines = [];
    this.index = 0;
    this.shown = 0;
    this.open = false;
    this.onDone = null;
  }

  /**
   * @param {string[]} lines
   * @param {{speaker?:string, onDone?:()=>void}} opts
   */
  show(lines, { speaker = '', onDone = null } = {}) {
    this.lines = lines.filter(Boolean);
    this.index = 0;
    this.shown = 0;
    this.open = true;
    this.onDone = onDone;
    this.nameEl.textContent = speaker;
    this.nameEl.hidden = !speaker;
    this.el.hidden = false;
    this._render();
  }

  /** 확인키. 타이핑 중이면 즉시 완성, 끝났으면 다음 줄 / 닫기 */
  advance() {
    if (!this.open) return;
    const full = this.lines[this.index] || '';
    if (this.shown < full.length) {
      this.shown = full.length;
      this._render();
      return;
    }
    if (this.index < this.lines.length - 1) {
      this.index++;
      this.shown = 0;
      this._render();
      return;
    }
    this.hide();
    const done = this.onDone;
    this.onDone = null;
    done?.();
  }

  update(dt) {
    if (!this.open) return;
    const full = this.lines[this.index] || '';
    if (this.shown < full.length) {
      this.shown = Math.min(full.length, this.shown + CHARS_PER_SEC * dt);
      this._render();
    }
  }

  get typing() {
    return this.open && this.shown < (this.lines[this.index] || '').length;
  }

  hide() {
    this.open = false;
    this.el.hidden = true;
  }

  _render() {
    const full = this.lines[this.index] || '';
    this.textEl.textContent = full.slice(0, Math.floor(this.shown));
    this.arrowEl.hidden = this.typing;
  }

  dispose() {
    clear(this.el);
    this.el.remove();
  }
}

/** 지역명 배너 — 맵에 들어설 때 "여기는 ○○" 하고 잠깐 떴다 사라진다. */


class Banner {
  constructor(root) {
    this.titleEl = h('div', { class: 'gb-banner__title' });
    this.subEl = h('div', { class: 'gb-banner__sub' });
    this.el = h('div', { class: 'gb-banner', hidden: true }, h('span', { class: 'gb-banner__arrow' }, '↓'), h('div', {}, this.titleEl, this.subEl));
    root.appendChild(this.el);
    this.timer = 0;
  }

  show(title, subtitle = '', seconds = 2.4) {
    this.titleEl.textContent = title;
    this.subEl.textContent = subtitle;
    this.subEl.hidden = !subtitle;
    this.el.hidden = false;
    this.el.classList.remove('is-in');
    void this.el.offsetWidth; // 애니메이션 재시작
    this.el.classList.add('is-in');
    this.timer = seconds;
  }

  hide() {
    this.timer = 0;
    this.el.hidden = true;
    this.el.classList.remove('is-in');
  }

  update(dt) {
    if (this.timer <= 0) return;
    this.timer -= dt;
    if (this.timer <= 0) {
      this.el.hidden = true;
      this.el.classList.remove('is-in');
    }
  }

  dispose() {
    this.el.remove();
  }
}

/* ── src/game/scenes/field.js ───────────────────────────────── */
/**
 * 필드(오버월드) 씬 — 걸어다니고, 말을 걸고, 문으로 들어간다.
 * 평가 데이터는 여기서 "대사"로 바뀐다.
 */








class FieldScene {
  /**
   * @param {import('../game.js').Game} game
   * @param {object} map  world/maps.js 엔트리
   * @param {{x:number,y:number,dir:string}} spawn
   */
  constructor(game, map, spawn) {
    this.game = game;
    this.map = map;
    this.pre = renderMap(map);
    this.camera = new Camera(game.width, game.height);
    this.player = new Actor({ ...spawn, palette: 'red', id: 'player' });
    this.npcs = map.npcs.map((def) => new Npc(def));
    this.npcByCell = new Map(this.npcs.map((n) => [`${n.gx},${n.gy}`, n]));
    this.busy = false; // 대화 중에는 움직이지 않는다
    /** 포인터·프레젠터로 지정한 목적지까지의 경로 */
    this.path = [];
    /** 도착하면 말을 걸 칸 */
    this.pendingInteract = null;
    this.targets = collectTargets(map);
  }

  /** 경로 유틸이 쓰는 {x,y} 형태의 플레이어 위치 (Actor 는 gx/gy 를 쓴다) */
  playerCell() {
    return { x: this.player.gx, y: this.player.gy };
  }

  enter() {
    this.game.banner.show(`여기는 ${this.map.name}`, this.map.subtitle || '');
    this.camera.follow(this.player, this.pre.width, this.pre.height);
  }

  isBlocked(x, y) {
    if (isSolid(this.map, x, y)) return true;
    if (this.npcByCell.has(`${x},${y}`)) return true;
    return false;
  }

  update(dt) {
    const { input, textbox, presenter } = this.game;

    if (textbox.open) {
      if (input.pressed('confirm') || input.pressed('cancel') || input.pressed('presenterNext')) {
        textbox.advance();
      }
      this.player.update(dt);
      return;
    }

    // 프레젠터(레이저 포인터) — 버튼 2개로 조작
    if (input.pressed('presenterPrev')) {
      presenter.enabled = true;
      presenter.setTargets(this.targetsNear());
      presenter.next();
    }
    if (input.pressed('presenterNext')) {
      presenter.enabled = true;
      if (!presenter.current()) presenter.setTargets(this.targetsNear());
      const target = presenter.current();
      if (target) this.goTo(target.x, target.y, { interact: true });
    }

    if (input.pressed('confirm')) {
      this.cancelPath();
      if (this.interact()) return;
    }

    if (!this.player.moving && !this.busy) {
      const dir = input.direction();
      if (dir) {
        this.cancelPath();
        const moved = this.player.tryMove(dir, (x, y) => this.isBlocked(x, y), { run: input.isDown('run') });
        if (moved) this._pendingWarpCheck = true;
      } else if (this.path.length) {
        // 경로가 있으면 한 칸씩 자동으로 걷는다
        const next = this.path[0];
        const moved = this.player.tryMove(stepDirection(this.playerCell(), next), (x, y) => this.isBlocked(x, y));
        if (moved) this.path.shift();
        else this.cancelPath(); // 누가 길을 막았다
      } else if (this.pendingInteract) {
        const t = this.pendingInteract;
        this.pendingInteract = null;
        this.player.dir = stepDirection(this.playerCell(), t);
        this.interact();
      }
    }

    const wasMoving = this.player.moving;
    this.player.update(dt);
    for (const npc of this.npcs) npc.update(dt);

    // 칸에 완전히 도착한 순간에만 워프를 판정한다
    if (wasMoving && !this.player.moving) this.checkWarp();

    this.camera.follow(this.player, this.pre.width, this.pre.height);
  }

  /** 포인터/프레젠터로 목적지 지정 */
  goTo(tx, ty, { interact = false } = {}) {
    const blockedForPath = (x, y) => this.isBlocked(x, y);
    // 워프가 걸린 문은 '옆'이 아니라 '위'로 가야 한다 (밟으면 들어간다)
    const isWarpDoor = this.map.warps.some((w) => w.x === tx && w.y === ty);
    const needsAdjacent = !isWarpDoor && (interact || this.isBlocked(tx, ty));
    const path = findPath(this.playerCell(), { x: tx, y: ty }, blockedForPath, { adjacent: needsAdjacent });
    if (!path.length && !(this.player.gx === tx && this.player.gy === ty)) {
      // 이미 옆에 서 있으면 바로 말을 건다
      if (needsAdjacent && Math.abs(this.player.gx - tx) + Math.abs(this.player.gy - ty) === 1) {
        this.player.dir = stepDirection(this.playerCell(), { x: tx, y: ty });
        this.interact();
      }
      return;
    }
    this.path = path;
    this.pendingInteract = needsAdjacent ? { x: tx, y: ty } : null;
  }

  cancelPath() {
    this.path = [];
    this.pendingInteract = null;
  }

  /** 포인터로 찍은 지점 → 칸 */
  onPointer({ x, y }) {
    const { textbox } = this.game;
    if (textbox.open) {
      textbox.advance();
      return;
    }
    const tx = Math.floor((x + this.camera.x) / TILE);
    const ty = Math.floor((y + this.camera.y) / TILE);
    const target = this.targets.find((t) => t.x === tx && t.y === ty);
    this.goTo(tx, ty, { interact: !!target });
  }

  /** 프레젠터 모드 후보 — 가까운 순 */
  targetsNear() {
    const p = this.player;
    return [...this.targets]
      .map((t) => ({ ...t, d: Math.abs(t.x - p.gx) + Math.abs(t.y - p.gy) }))
      .sort((a, b) => a.d - b.d || TARGET_ORDER.indexOf(a.kind) - TARGET_ORDER.indexOf(b.kind))
      .slice(0, 8);
  }

  checkWarp() {
    const w = this.map.warps.find((v) => v.x === this.player.gx && v.y === this.player.gy);
    if (w) this.game.changeMap(w.to, { x: w.tx, y: w.ty, dir: w.dir });
  }

  /** 바라보는 칸에 무엇이 있는지 확인하고 반응 */
  interact() {
    const { x, y } = this.player.facing();
    let npc = this.npcByCell.get(`${x},${y}`);
    // 카운터 너머의 사람에게도 말을 건다 (센터 접수처처럼)
    if (!npc && tileAt(this.map, x, y)?.tag === 'counter') {
      const [dx, dy] = DELTA[this.player.dir];
      npc = this.npcByCell.get(`${x + dx},${y + dy}`);
    }
    if (npc) {
      npc.lookAt(this.player);
      this.talkTo(npc);
      return true;
    }
    const tile = tileAt(this.map, x, y);
    if (tile?.tag === 'sign') {
      const lines = this.map.signs[`${x},${y}`] || ['글씨가 지워져 읽을 수 없다.'];
      this.game.say(lines);
      return true;
    }
    // 들어갈 수 없는 문 (아직 안 만든 건물)
    if (tile?.tag === 'door' && !this.map.warps.some((w) => w.x === x && w.y === y)) {
      this.game.say(['문이 잠겨 있다.']);
      return true;
    }
    return false;
  }

  talkTo(npc) {
    const def = npc.def;
    if (def.kind === 'guide') {
      this.game.say(def.lines, { speaker: '주민' });
      return;
    }
    if (def.kind === 'member') {
      const entry = this.game.memberEntry(def.memberIndex);
      if (!entry) {
        this.game.say(['...아직 이번 달 기록이 없어.']);
        return;
      }
      this.game.say(memberLines(entry), { speaker: entry.member.name });
      return;
    }
    if (def.kind === 'leader') {
      const boss = this.game.boss();
      const entry = this.game.playerEntry();
      if (!entry) {
        this.game.say(['이번 달 기록이 없으면 승부도 없다. 돌아가라.'], { speaker: '관장' });
        return;
      }
      this.game.say(
        [
          `나는 ${boss.title} ${boss.name}. 이번 달 목표 그 자체다.`,
          boss.quote,
          `${entry.member.name}... 지난 한 달로 나를 넘어보시지.`,
        ],
        {
          speaker: boss.name,
          onDone: () => this.game.startBattle(entry, boss),
        },
      );
      return;
    }
  }

  draw(ctx, time) {
    const cam = this.camera;
    ctx.imageSmoothingEnabled = false;

    // 프리렌더된 맵에서 보이는 부분만 잘라 붙인다 (물결은 프레임 교체로)
    const frames = this.pre.frames;
    const frame = frames[Math.floor(Math.max(0, time) * WATER_FPS) % frames.length];
    ctx.drawImage(frame, cam.x, cam.y, cam.w, cam.h, 0, 0, cam.w, cam.h);

    // 아래쪽(y 가 큰) 캐릭터가 나중에 그려져 앞에 서도록
    const actors = [...this.npcs, this.player].sort((a, b) => a.py - b.py);
    for (const a of actors) {
      if (a.px - cam.x < -TILE * 2 || a.px - cam.x > cam.w + TILE * 2) continue;
      a.draw(ctx, cam);
    }

    // 프레젠터 모드 커서 — 지금 고른 대상 위에 ▼
    const target = this.game.presenter.enabled ? this.game.presenter.current() : null;
    if (target) {
      const cx = target.x * TILE - cam.x + TILE / 2;
      const cy = target.y * TILE - cam.y - 4 + Math.round(Math.sin(time * 5) * 2);
      ctx.fillStyle = '#ffd166';
      ctx.beginPath();
      ctx.moveTo(cx - 4, cy - 5);
      ctx.lineTo(cx + 4, cy - 5);
      ctx.lineTo(cx, cy + 1);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#2a2028';
      ctx.lineWidth = 1;
      ctx.stroke();
    }

    // 풀숲 앞잎을 캐릭터 위에 덮어 '풀에 들어간' 느낌을 만든다
    const sway = Math.sin(time * 6) > 0 ? 1 : 0;
    for (const [gx, gy] of this.pre.tallGrass) {
      const sx = gx * TILE - cam.x;
      const sy = gy * TILE - cam.y;
      if (sx < -TILE || sy < -TILE || sx > cam.w || sy > cam.h) continue;
      const stepping = this.player.gx === gx && this.player.gy === gy;
      drawTallGrassFront(ctx, sx, sy, gx, gy, stepping ? sway : 0);
    }
  }

  dispose() {}
}

/**
 * 맵에서 '말 걸 수 있는 것' 목록.
 * 프레젠터 모드의 선택지이자, 포인터 클릭이 대화로 이어지는 판정 기준이다.
 */
function collectTargets(map) {
  const targets = map.npcs.map((n) => ({ kind: 'npc', x: n.x, y: n.y, label: n.id }));
  map.rows.forEach((row, y) => {
    [...row].forEach((_ch, x) => {
      const tile = tileAt(map, x, y);
      if (tile?.tag === 'door') targets.push({ kind: 'door', x, y, label: '문' });
      if (tile?.tag === 'counter') targets.push({ kind: 'npc', x, y, label: '접수처' });
      if (tile?.tag === 'sign') targets.push({ kind: 'sign', x, y, label: '표지판' });
    });
  });
  return targets;
}

/** 팀원 NPC 대사 — 이번 시즌 평가 결과를 말로 옮긴다 */
function memberLines(e) {
  const lines = [
    `이번 달 종합은 ${fmt.score(e.overall)}, 등급 ${e.grade.label}이야.`,
    `파트너 ${e.form.name}은(는) Lv.${e.progress.level}. ${e.form.isFinal ? '더 진화할 곳은 없어.' : `${e.form.nextName}까지 Lv.${e.form.nextAt}!`}`,
  ];
  const best = [...e.kpiScores].sort((a, b) => b.score - a.score)[0];
  const worst = [...e.kpiScores].sort((a, b) => a.score - b.score)[0];
  if (best) lines.push(`이번엔 특히 잘 풀린 게 있었어. 자신 있는 쪽은 확실히 밀어붙였지.`);
  if (worst && worst.score < 0.9) lines.push('...아쉬운 항목도 하나 있어. 다음 달엔 거기부터.');
  lines.push(e.battle.win ? '체육관? 이번 달은 돌파했어.' : '관장한테는 아직 안 되더라고.');
  if (e.newBadges.length) lines.push(`이번 달에 배지를 ${e.newBadges.length}개 새로 받았어!`);
  return lines;
}

/* ── src/game/scenes/battle.js ───────────────────────────────── */
/**
 * 배틀 씬 — engine/battle.js 가 만든 로그를 4세대 배틀 화면으로 재생한다.
 * 여기서 새로 계산하는 것은 없다: 도감에서 본 결과와 늘 같아야 하므로.
 *
 * 화면 구성도 그 시절 규칙을 따른다.
 *  - 상대는 오른쪽 위, 내 쪽은 왼쪽 아래. 각자 타원 발판 위에 선다
 *  - 체력 상자는 이름/레벨/HP 막대, 내 쪽에는 EXP 막대가 하나 더 붙는다
 *  - 등장할 때 양쪽에서 미끄러져 들어오고, 맞으면 깜빡이며 화면이 흔들린다
 */






const INTRO = 0.55; // 등장 연출 시간(초)

class BattleScene {
  /**
   * @param {import('../game.js').Game} game
   * @param {object} entry  evaluate.js 의 멤버 시즌 결과
   * @param {object} boss
   * @param {()=>void} onEnd
   */
  constructor(game, entry, boss, onEnd) {
    this.game = game;
    this.entry = entry;
    this.boss = boss;
    this.onEnd = onEnd;
    this.log = entry.battle.log;
    this.i = -1;
    this.playerHp = 1;
    this.foeHp = 1;
    this.targetPlayerHp = 1;
    this.targetFoeHp = 1;
    this.flash = { player: 0, foe: 0 };
    this.faint = { player: 0, foe: 0 };
    this.shake = 0;
    this.intro = INTRO;
    this.finished = false;
    /** 이번 달 실적으로 만들어진 기술 4개 (4세대의 2×2 기술 그리드) */
    this.moves = movesFrom(entry.kpiScores);
    this.activeMove = -1;
  }

  enter() {
    this.next();
  }

  /** 로그 한 줄 진행 */
  next() {
    this.i++;
    if (this.i >= this.log.length) {
      this.end();
      return;
    }
    const line = this.log[this.i];
    if (typeof line.playerHp === 'number') this.targetPlayerHp = line.playerHp;
    if (typeof line.foeHp === 'number') this.targetFoeHp = line.foeHp;
    if (line.kind === 'player') {
      this.activeMove = this.moves.findIndex((mv) => line.text.includes(mv.name));
    } else if (line.kind === 'foe') {
      this.activeMove = -1;
    }
    if (line.dmg > 0) {
      const side = line.kind === 'player' ? 'foe' : 'player';
      this.flash[side] = 0.5;
      this.shake = 0.2;
    }
    if (this.targetFoeHp <= 0) this.faint.foe = Math.max(this.faint.foe, 0.001);
    if (this.targetPlayerHp <= 0) this.faint.player = Math.max(this.faint.player, 0.001);

    this.game.textbox.show([line.text], {
      speaker: line.kind === 'foe' ? this.boss.name : '',
      onDone: () => this.next(),
    });
  }

  end() {
    if (this.finished) return;
    this.finished = true;
    const e = this.entry;
    const lines = [];
    lines.push(e.battle.win ? '체육관을 돌파했다!' : '이번 달은 여기까지...');
    lines.push(`${e.member.name}은(는) ${e.expFromBattle.toLocaleString()} EXP 를 얻었다!`);
    if (e.battle.win && e.battle.foe.badgeId) {
      const badge = BADGE_BY_ID[e.battle.foe.badgeId];
      if (badge) lines.push(`${badge.icon} ${badge.name}를 손에 넣었다!`);
    }
    if (e.evolved) lines.push(`...어라? 파트너의 모습이 ${e.form.name}(으)로 변했다!`);
    this.game.textbox.show(lines, { onDone: () => this.onEnd?.() });
  }

  update(dt) {
    const { input, textbox } = this.game;
    if (input.pressed('confirm') || input.pressed('cancel')) textbox.advance();

    this.intro = Math.max(0, this.intro - dt);
    const ease = (cur, target) => cur + (target - cur) * Math.min(1, dt * 6);
    this.playerHp = ease(this.playerHp, this.targetPlayerHp);
    this.foeHp = ease(this.foeHp, this.targetFoeHp);
    this.flash.player = Math.max(0, this.flash.player - dt * 3);
    this.flash.foe = Math.max(0, this.flash.foe - dt * 3);
    this.shake = Math.max(0, this.shake - dt);
    if (this.faint.foe > 0) this.faint.foe = Math.min(1, this.faint.foe + dt * 2);
    if (this.faint.player > 0) this.faint.player = Math.min(1, this.faint.player + dt * 2);
  }

  draw(ctx, time) {
    const W = this.game.width;
    const H = this.game.height;
    const typeColor = TYPES[this.entry.species.type]?.color || '#6ee7ff';

    this.background(ctx, W, H, typeColor);

    // 등장: 양쪽에서 미끄러져 들어온다
    const k = this.intro / INTRO;
    const slideFoe = Math.round(k * k * 90);
    const slidePlayer = Math.round(-k * k * 90);

    const shakeX = this.shake > 0 ? Math.round(Math.sin(time * 90) * 2) : 0;
    ctx.save();
    ctx.translate(shakeX, 0);

    this.platform(ctx, W - 84 + slideFoe, 74, 70, 12);
    this.platform(ctx, 8 + slidePlayer, H - 62, 86, 14);

    drawMonster(
      ctx,
      { speciesId: `boss:${this.boss.id}`, type: this.boss.type, stage: 3, expression: faceFor(this.foeHp) },
      { x: W - 76 + slideFoe, y: 30 + this.faint.foe * 26, size: 52, flash: this.flash.foe, alpha: 1 - this.faint.foe },
    );
    drawMonster(
      ctx,
      { speciesId: this.entry.species.id, type: this.entry.species.type, stage: this.entry.form.stage, back: true },
      { x: 20 + slidePlayer, y: H - 118 + this.faint.player * 26, size: 58, flash: this.flash.player, alpha: 1 - this.faint.player },
    );

    ctx.restore();

    if (this.intro <= 0) this.moveGrid(ctx, 6, 44);

    // 체력 상자는 반대편에서 들어온다
    this.hpBox(ctx, 6 - slideFoe, 8, this.boss.name, this.boss.level, this.foeHp, null);
    this.hpBox(
      ctx,
      W - 122 - slidePlayer,
      H - 98,
      this.entry.form.name,
      this.entry.progress.level,
      this.playerHp,
      this.entry.progress.ratio,
    );
  }

  /**
   * 기술 4개를 2×2 로 (4세대 기술 선택 화면의 배치).
   * 관전 화면이라 '무엇을 썼는지'를 보여주는 용도 — 쓰인 기술에 커서가 붙는다.
   */
  moveGrid(ctx, x, y) {
    const cw = 58;
    const ch = 24;
    ctx.textBaseline = 'top';
    this.moves.forEach((mv, i) => {
      const cx = x + (i % 2) * (cw + 3);
      const cy = y + Math.floor(i / 2) * (ch + 3);
      const active = i === this.activeMove;
      const type = TYPES[mv.type];
      roundRect(ctx, cx, cy, cw, ch, 4, active ? '#fffbe8' : 'rgba(248,244,232,0.82)', active ? '#e8a020' : '#6a6058');
      // 타입 띠 — 4세대 기술 칸의 타입 표시
      ctx.fillStyle = type?.color || '#888';
      ctx.fillRect(cx + 3, cy + ch - 5, cw - 6, 3);
      ctx.fillStyle = '#3a3430';
      ctx.font = 'bold 8px system-ui, sans-serif';
      ctx.fillText(KPI_BY_ID[mv.kpiId]?.name || mv.name, cx + (active ? 10 : 5), cy + 3);
      ctx.fillStyle = '#8a8078';
      ctx.font = '7px system-ui, sans-serif';
      ctx.fillText(`위력 ${mv.power}`, cx + 5, cy + 12);
      ctx.font = 'bold 8px system-ui, sans-serif';
      if (active) {
        ctx.fillStyle = '#e8a020';
        ctx.beginPath();
        ctx.moveTo(cx + 4, cy + 4);
        ctx.lineTo(cx + 8, cy + 7);
        ctx.lineTo(cx + 4, cy + 10);
        ctx.closePath();
        ctx.fill();
      }
    });
  }

  /** 하늘 → 지평선 → 배틀 필드 */
  background(ctx, W, H, typeColor) {
    const sky = ctx.createLinearGradient(0, 0, 0, H);
    sky.addColorStop(0, mix('#8fd8ff', typeColor, 0.25));
    sky.addColorStop(0.44, '#cfeeff');
    sky.addColorStop(0.45, mix('#9ad86a', typeColor, 0.12));
    sky.addColorStop(1, '#6fbb4a');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillRect(0, Math.round(H * 0.44) - 2, W, 2);
    ctx.fillStyle = 'rgba(0,0,0,0.05)';
    for (let y = Math.round(H * 0.5); y < H; y += 6) ctx.fillRect(0, y, W, 1);
  }

  /** 타원 발판 */
  platform(ctx, x, y, w, h) {
    ctx.fillStyle = 'rgba(0,0,0,0.14)';
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h / 2 + 2, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#8ecf62';
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#6aa845';
    ctx.beginPath();
    ctx.ellipse(x + w / 2, y + h / 2 + 2, w / 2 - 3, h / 2 - 2, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  /**
   * 4세대 체력 상자.
   * @param {number|null} expRatio 내 쪽만 EXP 막대를 그린다
   */
  hpBox(ctx, x, y, name, level, ratio, expRatio) {
    const w = 116;
    const h = expRatio === null ? 30 : 36;
    roundRect(ctx, x, y, w, h, 5, '#f8f4e8', '#3a3430');

    ctx.fillStyle = '#3a3430';
    ctx.font = 'bold 9px system-ui, sans-serif';
    ctx.textBaseline = 'top';
    ctx.fillText(name, x + 7, y + 5);
    ctx.textAlign = 'right';
    ctx.fillText(`Lv${level}`, x + w - 7, y + 5);
    ctx.textAlign = 'left';

    const barX = x + 24;
    const barY = y + 18;
    const barW = w - 32;
    ctx.fillStyle = '#c8a03a';
    ctx.font = 'bold 8px system-ui, sans-serif';
    ctx.fillText('HP', x + 8, barY - 1);

    roundRect(ctx, barX, barY, barW, 6, 3, '#4a4038', null);
    const hpColor = ratio > 0.5 ? '#58d858' : ratio > 0.2 ? '#f8c838' : '#f05038';
    const fill = Math.max(0, Math.round((barW - 2) * ratio));
    if (fill > 0) {
      roundRect(ctx, barX + 1, barY + 1, fill, 4, 2, hpColor, null);
      ctx.fillStyle = shade(hpColor, 45);
      ctx.fillRect(barX + 1, barY + 1, fill, 1);
    }

    if (expRatio !== null && expRatio !== undefined) {
      const ex = x + 8;
      const ew = w - 16;
      ctx.fillStyle = '#3a6ea8';
      ctx.font = 'bold 7px system-ui, sans-serif';
      ctx.fillText('EXP', ex, y + h - 11);
      roundRect(ctx, ex + 20, y + h - 9, ew - 20, 4, 2, '#4a4038', null);
      const efill = Math.max(0, Math.round((ew - 22) * expRatio));
      if (efill > 0) roundRect(ctx, ex + 21, y + h - 8, efill, 2, 1, '#58c8f8', null);
    }
  }

  dispose() {}
}

/** 체력이 깎이면 표정이 어두워진다 */
function faceFor(hpRatio) {
  if (hpRatio <= 0.3) return 'hurt';
  if (hpRatio >= 0.95) return 'happy';
  return 'normal';
}

/** 모서리가 둥근 사각형 (테두리 선택) */
function roundRect(ctx, x, y, w, h, r, fill, stroke) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  if (fill) {
    ctx.fillStyle = fill;
    ctx.fill();
  }
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

/* ── src/game/game.js ───────────────────────────────── */
/**
 * 게임 본체 — 화면(캔버스+오버레이) 생성, 입력/루프, 씬 전환.
 *
 * 평가 데이터는 절대 여기서 계산하지 않는다. evaluate.js 의 결과(league)를 받아
 * 대사와 배틀 재생에 쓰기만 한다. 그래야 도감 화면과 게임이 늘 같은 얘기를 한다.
 */











const VIEW_W = 256; // DS 상단 화면과 같은 논리 해상도
const VIEW_H = 192;

const HINTS = {
  keyboard: '이동 방향키 · 대화/확인 Z·Space · 취소 X · 달리기 Shift · 화면을 클릭하면 그 자리로 걸어간다',
  presenter: '레이저 포인터 리모컨: [다음/PageDown] 실행·대화 진행 · [이전/PageUp] 대상 바꾸기',
};

class Game {
  /**
   * @param {HTMLElement} root
   * @param {{league:object, seasonId:string, playerMemberId?:string, onNavigate?:(path:string)=>void}} opts
   */
  constructor(root, { league, seasonId, playerMemberId, onNavigate, assetBase = 'assets/sprites/' }) {
    this.root = root;
    this.league = league;
    this.seasonId = seasonId;
    this.playerMemberId = playerMemberId;
    this.onNavigate = onNavigate;
    this.assetBase = assetBase;
    this.width = VIEW_W;
    this.height = VIEW_H;

    this.canvas = h('canvas', { class: 'gb__canvas', width: VIEW_W, height: VIEW_H });
    this.ctx = this.canvas.getContext('2d');
    this.ctx.imageSmoothingEnabled = false;

    this.overlay = h('div', { class: 'gb__overlay' });
    this.screen = h('div', { class: 'gb__screen' }, this.canvas, this.overlay);
    this.pad = this.buildPad();
    this.el = h('div', { class: 'gb' }, this.screen, this.pad);
    root.appendChild(this.el);

    this.textbox = new TextBox(this.overlay);
    this.banner = new Banner(this.overlay);
    this.input = new Input(window);
    /** 레이저 포인터(프레젠터 리모컨) 조작 상태 */
    this.presenter = new PresenterMode();
    this.bindPad();
    // 포인터(마우스·터치·자이로 레이저 포인터) — 찍은 칸까지 걸어간다
    this.input.bindPointer(this.canvas, (p) => this.scene?.onPointer?.(p));

    this.loop = new Loop((dt, time) => this.step(dt, time));
    this.scene = null;
    this.fieldScene = null;
    /** 화면 전환 연출: 검은 페이드(맵 이동) / 흰 플래시(배틀 진입) */
    this.fx = { fade: 0, flash: 0, phase: null, t: 0, dur: 0.22, onSwap: null };
  }

  start() {
    // 실제 도트 에셋이 있으면 그것으로 그린다 (없으면 코드 그림 그대로)
    loadAssets(this.assetBase).then((ok) => {
      if (ok && this.fieldScene) this.changeMap(this.fieldScene.map.id, {
        x: this.fieldScene.player.gx,
        y: this.fieldScene.player.gy,
        dir: this.fieldScene.player.dir,
      }, { instant: true });
    });
    const report = this.report();
    const startMap = MAPS.town;
    this.changeMap(startMap.id, startMap.spawn, { instant: true });
    this.loop.start();
    if (!report) {
      this.say(['이번 시즌 데이터가 없다. 관리 화면에서 시즌을 만들어 보자.']);
    }
  }

  step(dt, time) {
    this.textbox.update(dt);
    this.banner.update(dt);
    this.updateFx(dt);
    // 전환 중에는 조작을 막는다 (문을 넘는 도중 입력이 먹히면 어긋난다)
    if (!this.fx.phase) this.scene?.update(dt);
    this.scene?.draw(this.ctx, time);
    this.drawFx();
    this.input.endFrame();
  }

  /* ── 전환 연출 ──────────────────────────────────── */

  updateFx(dt) {
    const fx = this.fx;
    fx.flash = Math.max(0, fx.flash - dt * 3.5);
    if (!fx.phase) return;
    fx.t += dt;
    const k = Math.min(1, fx.t / fx.dur);
    if (fx.phase === 'out') {
      fx.fade = k;
      if (k >= 1) {
        fx.onSwap?.();
        fx.onSwap = null;
        fx.phase = 'in';
        fx.t = 0;
      }
    } else {
      fx.fade = 1 - k;
      if (k >= 1) {
        fx.phase = null;
        fx.fade = 0;
      }
    }
  }

  drawFx() {
    const { fade, flash } = this.fx;
    if (fade > 0) {
      this.ctx.fillStyle = `rgba(0,0,0,${fade})`;
      this.ctx.fillRect(0, 0, this.width, this.height);
    }
    if (flash > 0) {
      this.ctx.fillStyle = `rgba(255,255,255,${Math.min(1, flash)})`;
      this.ctx.fillRect(0, 0, this.width, this.height);
    }
  }

  /** 화면을 어둡게 했다가 onSwap 을 실행하고 다시 밝힌다 */
  fadeThrough(onSwap, dur = 0.22) {
    this.fx.phase = 'out';
    this.fx.t = 0;
    this.fx.dur = dur;
    this.fx.onSwap = onSwap;
  }

  /* ── 씬 ─────────────────────────────────────────── */

  changeMap(mapId, spawn, { instant = false } = {}) {
    const map = MAPS[mapId];
    if (!map) return;
    const swap = () => {
      this.scene?.dispose?.();
      this.scene = new FieldScene(this, map, spawn || map.spawn);
      this.fieldScene = this.scene;
      this.scene.enter();
    };
    if (instant) swap();
    else this.fadeThrough(swap);
  }

  startBattle(entry, boss) {
    const field = this.fieldScene;
    this.banner.hide(); // 지역 배너가 체력 상자를 가리지 않게
    this.fx.flash = 1.6; // 배틀 진입 섬광
    this.fadeThrough(() => {
      this.scene = new BattleScene(this, entry, boss, () => {
        this.fadeThrough(() => {
          this.scene = field;
          field.enter();
        });
      });
      this.scene.enter();
    }, 0.3);
  }

  say(lines, opts) {
    this.textbox.show(lines, opts);
  }

  /* ── 평가 데이터 조회 ───────────────────────────── */

  report() {
    return this.league.bySeasonId[this.seasonId] || this.league.seasonReports.at(-1) || null;
  }

  boss() {
    return this.report()?.boss || null;
  }

  /** 맵에 배치된 순서(memberIndex)로 팀원 결과 찾기 */
  memberEntry(index) {
    const report = this.report();
    if (!report) return null;
    return report.entries[index] || null;
  }

  /** 플레이어가 조작 중인 트레이너 */
  playerEntry() {
    const report = this.report();
    if (!report) return null;
    return (
      report.entries.find((e) => e.memberId === this.playerMemberId) || report.entries[0] || null
    );
  }

  /* ── 화면 버튼 ──────────────────────────────────── */

  buildPad() {
    const btn = (label, action, cls = '') =>
      h('button', { class: `gb__btn ${cls}`, dataset: { action }, type: 'button', 'aria-label': label }, label);

    this.dpad = h(
      'div',
      { class: 'gb__dpad' },
      btn('▲', 'up', 'gb__btn--up'),
      btn('◀', 'left', 'gb__btn--left'),
      btn('▶', 'right', 'gb__btn--right'),
      btn('▼', 'down', 'gb__btn--down'),
    );
    this.actions = h(
      'div',
      { class: 'gb__actions' },
      btn('B', 'cancel', 'gb__btn--b'),
      btn('A', 'confirm', 'gb__btn--a'),
    );

    this.schemeLabel = h('span', { class: 'gb__scheme' }, '조작: 키보드 / 터치');
    const links = h(
      'div',
      { class: 'gb__links' },
      h(
        'button',
        {
          class: 'btn btn--sm',
          type: 'button',
          onClick: () => this.toggleScheme(),
        },
        '조작 방식 전환',
      ),
      h('button', { class: 'btn btn--sm', type: 'button', onClick: () => this.onNavigate?.('/dex') }, '도감'),
      h('button', { class: 'btn btn--sm', type: 'button', onClick: () => this.onNavigate?.('/league') }, '리그'),
      h('button', { class: 'btn btn--sm', type: 'button', onClick: () => this.onNavigate?.('/admin') }, '실적 입력'),
    );

    this.hintEl = h('p', { class: 'gb__hint' }, HINTS.keyboard);
    return h(
      'div',
      { class: 'gb__pad' },
      this.dpad,
      h('div', { class: 'gb__hintwrap' }, this.hintEl, this.schemeLabel),
      this.actions,
      links,
    );
  }

  /** 키보드 ↔ 레이저 포인터(프레젠터) 조작 전환 */
  toggleScheme() {
    this.presenter.enabled = !this.presenter.enabled;
    if (this.presenter.enabled && this.scene?.targetsNear) {
      this.presenter.setTargets(this.scene.targetsNear());
    }
    const scheme = CONTROL_SCHEMES[this.presenter.enabled ? 1 : 0];
    this.schemeLabel.textContent = `조작: ${scheme.name}`;
    this.hintEl.textContent = this.presenter.enabled ? HINTS.presenter : HINTS.keyboard;
  }

  bindPad() {
    for (const el of this.el.querySelectorAll('.gb__btn')) {
      this.input.bindButton(el, el.dataset.action);
    }
  }

  dispose() {
    this.loop.stop();
    this.input.dispose();
    this.textbox.dispose();
    this.banner.dispose();
    this.el.remove();
  }
}

/* ── src/ui/screens/field.js ───────────────────────────────── */
/** 필드 화면 — 대시보드 라우터에 게임을 얹는 얇은 래퍼. */





/** 라우트를 떠날 때 정리해야 하므로 인스턴스를 붙들어 둔다 */
let running = null;

function disposeField() {
  running?.dispose();
  running = null;
}

function FieldScreen({ league, state, seasonId }) {
  disposeField();

  if (!league.seasonReports.length) {
    return emptyState(
      '시즌 데이터가 없어 마을을 열 수 없습니다.',
      h('button', { class: 'btn btn--primary', onClick: () => navigate('/admin') }, '관리 화면으로'),
    );
  }

  const mount = h('div', { class: 'gamewrap' });
  // 캔버스는 DOM 에 붙은 뒤에 크기가 잡히므로 다음 프레임에 시작한다
  queueMicrotask(() => {
    if (!mount.isConnected) return;
    running = new Game(mount, {
      league,
      seasonId,
      playerMemberId: state.settings.playerMemberId || state.members[0]?.id,
      onNavigate: (path) => navigate(path),
    });
    running.start();
    // 콘솔에서 좌표·씬을 들여다볼 수 있게 열어둔다 (window.PokeReview.game)
    if (window.PokeReview) window.PokeReview.game = running;
  });

  return h(
    'div',
    { class: 'screen screen--field' },
    mount,
    h(
      'p',
      { class: 'hint' },
      '체육관 문으로 들어가 관장에게 말을 걸면 이번 달 평가 배틀이 시작된다. 결과는 도감·리그와 같은 계산을 쓴다.',
    ),
  );
}

    );
  }

  const { season, boss, entries, ranking } = report;
  const mvp = ranking[0];
  const evolvedList = entries.filter((e) => e.evolved);
  const newBadges = entries.flatMap((e) => e.newBadges.map((b) => ({ e, b })));

  return h(
    'div',
    { class: 'screen screen--home' },
    h(
      'header',
      { class: 'hero' },
      h(
        'div',
        { class: 'hero__text' },
        h('p', { class: 'hero__eyebrow' }, state.settings.orgName || '트레이너 리그'),
        h('h1', { class: 'hero__title' }, season.title || fmt.season(season.id)),
        h('p', { class: 'hero__desc' }, `이번 달 체육관: ${boss.title} ${boss.name} (Lv.${boss.level})`),
        h(
          'div',
          { class: 'hero__actions' },
          h('button', { class: 'btn btn--primary', onClick: () => navigate(`/battle/${season.id}`) }, '체육관 전적 보기'),
          h('button', { class: 'btn', onClick: () => navigate('/dex') }, '트레이너 도감'),
        ),
      ),
      h('div', { class: 'hero__boss' }, bossSprite(boss, 128), h('p', { class: 'hero__quote' }, `"${boss.quote}"`)),
    ),

    h(
      'div',
      { class: 'grid grid--summary' },
      panel(
        '시즌 요약',
        statLine('팀 평균 종합', fmt.score(report.teamAverage)),
        statLine('체육관 돌파율', fmt.pct(report.clearRate)),
        statLine('참가 트레이너', `${entries.length}명`),
        statLine('이번 달 타입', typeChip(boss.type)),
      ),
      panel(
        '이달의 MVP',
        mvp
          ? h(
              'div',
              { class: 'mvp' },
              h('strong', { class: 'mvp__name' }, `${mvp.member.name} · ${mvp.form.name}`),
              h('p', { class: 'mvp__desc' }, `종합 ${fmt.score(mvp.overall)} · Lv.${mvp.progress.level} · +${fmt.num(mvp.expGained)} EXP`),
              h('button', { class: 'btn btn--sm', onClick: () => navigate(`/dex/${mvp.memberId}`) }, '상세 보기'),
            )
          : h('p', {}, '기록 없음'),
      ),
      panel(
        '이번 달 하이라이트',
        h(
          'ul',
          { class: 'highlights' },
          evolvedList.map((e) => h('li', {}, `✨ ${e.member.name}의 파트너가 ${e.form.name}(으)로 진화!`)),
          newBadges
            .slice(0, 6)
            .map(({ e, b }) => h('li', {}, h('span', {}, `${e.member.name} `), badgeChip(b))),
          !evolvedList.length && !newBadges.length ? h('li', {}, '조용한 달이었다.') : null,
        ),
      ),
    ),

    panel(
      '파티 현황',
      h(
        'div',
        { class: 'grid grid--cards' },
        entries.map((e) => memberCard(e, { onClick: (r) => navigate(`/dex/${r.memberId}`) })),
      ),
    ),
  );
}

/* ── src/ui/screens/pokedex.js ───────────────────────────────── */
/** 도감 — 트레이너 목록 (최신 시즌 기준) */





let filterType = 'all';
let sortKey = 'exp';

function PokedexScreen({ league }) {
  const entries = league.members.map((m) => league.latest[m.id]).filter(Boolean);
  if (!entries.length) return emptyState('아직 평가된 트레이너가 없습니다.');

  const filtered = entries
    .filter((e) => filterType === 'all' || e.species.type === filterType)
    .sort((a, b) => {
      if (sortKey === 'exp') return b.totalExp - a.totalExp;
      if (sortKey === 'overall') return b.overall - a.overall;
      if (sortKey === 'name') return a.member.name.localeCompare(b.member.name);
      return 0;
    });

  const rerender = () => navigate('/dex');

  return h(
    'div',
    { class: 'screen' },
    panel(
      null,
      h(
        'div',
        { class: 'toolbar' },
        h(
          'div',
          { class: 'toolbar__group' },
          h(
            'button',
            { class: `pill ${filterType === 'all' ? 'is-on' : ''}`, onClick: () => ((filterType = 'all'), rerender()) },
            '전체',
          ),
          TYPE_LIST.map((t) =>
            h(
              'button',
              {
                class: `pill ${filterType === t.id ? 'is-on' : ''}`,
                style: { '--chip': t.color },
                onClick: () => ((filterType = t.id), rerender()),
              },
              `${t.name}·${t.domain}`,
            ),
          ),
        ),
        h(
          'label',
          { class: 'toolbar__sort' },
          '정렬 ',
          h(
            'select',
            { onChange: (e) => ((sortKey = e.target.value), rerender()) },
            h('option', { value: 'exp', selected: sortKey === 'exp' }, '누적 EXP'),
            h('option', { value: 'overall', selected: sortKey === 'overall' }, '최근 종합'),
            h('option', { value: 'name', selected: sortKey === 'name' }, '이름'),
          ),
        ),
      ),
    ),
    h(
      'div',
      { class: 'grid grid--cards' },
      filtered.map((e) => memberCard(e, { onClick: (r) => navigate(`/dex/${r.memberId}`) })),
    ),
    h(
      'p',
      { class: 'hint' },
      `총 ${filtered.length}명 · 최신 시즌 ${fmt.season(entries[0].seasonId)} 기준 · 타입은 파트너 종족 기준 `,
      typeChip(entries[0].species.type, { small: true }),
    ),
  );
}

  if (!result) return emptyState('해당 트레이너의 기록이 없습니다.');

  const { member, species, form, progress, stats, evs, ivs, grade } = result;
  const season = league.bySeasonId[result.seasonId].season;
  const color = TYPES[species.type].color;

  return h(
    'div',
    { class: 'screen screen--detail', style: { '--type': color } },
    h(
      'button',
      { class: 'btn btn--ghost btn--sm', onClick: () => navigate('/dex') },
      '← 도감으로',
    ),

    h(
      'div',
      { class: 'profile' },
      h(
        'div',
        { class: 'profile__sprite' },
        spriteFor({ speciesId: species.id, type: species.type, stage: form.stage, size: 168 }),
        h('div', { class: 'profile__stage' }, `${form.stage} / ${form.stageCount} 단계`),
      ),
      h(
        'div',
        { class: 'profile__info' },
        h('h1', {}, member.name, h('span', { class: 'profile__form' }, ` · ${form.name}`)),
        h('p', { class: 'profile__tagline' }, `"${form.tagline}"`),
        h(
          'div',
          { class: 'profile__chips' },
          typeChip(species.type),
          gradeChip(grade),
          h('span', { class: 'chip' }, member.role || '직무 미지정'),
          h('span', { class: 'chip' }, member.team || '소속 미지정'),
          h('span', { class: 'chip' }, natureLabel(member.natureId)),
        ),
        expBar(progress),
        h(
          'div',
          { class: 'profile__stats' },
          statLine('누적 EXP', fmt.num(result.totalExp)),
          statLine('이번 달 획득', `+${fmt.num(result.expGained)}`),
          statLine('종합 점수', fmt.score(result.overall)),
          statLine(
            '다음 진화',
            form.isFinal ? '최종 단계' : `${form.nextName} (Lv.${form.nextAt})`,

    h(

          h('summary', {}, '개체값 / 노력치 자세히'),
          h(
            'table',
            { class: 'table table--sm' },
            h(
              'thead',
              {},
              h('tr', {}, h('th', {}, '스탯'), h('th', {}, '종족값'), h('th', {}, '개체값'), h('th', {}, '노력치'), h('th', {}, '실제')),
            ),
            h(
              'tbody',

                  h('td', {}, s.name),

                ),
              ),

          ),

        ),
      ),
      panel(
        `${fmt.season(result.seasonId)} 업적`,

/** 시즌별 종합점수 꺾은선 */
function trendChart(timeline, color) {
  const W = 640;
  const H = 180;
  const pad = 32;
  if (timeline.length < 2) return h('p', { class: 'hint' }, '시즌이 2개 이상 쌓이면 추이가 표시됩니다.');

  const xs = (i) => pad + (i * (W - pad * 2)) / (timeline.length - 1);
  // 데이터 폭에 맞춰 y축을 잡는다 (0부터 그리면 선이 납작해져 추이가 안 보인다)
  const values = timeline.map((r) => r.overall);
  const lo = Math.min(0.85, ...values) - 0.08;
  const hi = Math.max(1.15, ...values) + 0.08;
  const ys = (v) => H - pad - ((v - lo) / (hi - lo)) * (H - pad * 2);

  const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, class: 'trend', preserveAspectRatio: 'none' });
  // 기준선 1.0
  root.appendChild(svg('line', { x1: pad, x2: W - pad, y1: ys(1), y2: ys(1), class: 'trend__base' }));
  root.appendChild(
    svg('polyline', {
      points: timeline.map((r, i) => `${xs(i)},${ys(r.overall)}`).join(' '),
      class: 'trend__line',
      style: `--c:${color}`,
    }),
  );
  timeline.forEach((r, i) => {
    root.appendChild(svg('circle', { cx: xs(i), cy: ys(r.overall), r: 4, class: 'trend__dot', style: `--c:${color}` }));
    const t = svg('text', { x: xs(i), y: H - 8, class: 'trend__label', 'text-anchor': 'middle' });
    t.textContent = r.seasonId.slice(5) + '월';
    root.appendChild(t);
    const v = svg('text', { x: xs(i), y: ys(r.overall) - 10, class: 'trend__value', 'text-anchor': 'middle' });
    v.textContent = fmt.score(r.overall);
    root.appendChild(v);
  });
  return h('div', { class: 'trendwrap' }, root);
}

/** 진화 라인 표시 */
function evolutionLine(species, level) {
  return h(
    'div',
    { class: 'evoline' },
    species.line.map((entry, i) => {
      const unlocked = level >= entry.minLevel;
      return h(
        'div',
        { class: `evoline__item ${unlocked ? 'is-on' : ''}` },
        spriteFor({ speciesId: species.id, type: species.type, stage: i + 1, size: 64, animate: false }),
        h('strong', {}, entry.name),
        h('span', { class: 'hint' }, `Lv.${entry.minLevel}`),
      );
    }),
  );
}
