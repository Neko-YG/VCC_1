<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>월간 업적 리그 — 포켓몬식 업적평가</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23f87171'/><path d='M2 16h28' stroke='%230e1117' stroke-width='3'/><circle cx='16' cy='16' r='5' fill='%23fff' stroke='%230e1117' stroke-width='3'/></svg>" />
  </head>
  <body>
<style>
/* ─────────────────────────────────────────────────────────
   월간 업적 리그 — 스타일
   1) 토큰  2) 레이아웃  3) 공통 조각  4) 화면별
   ───────────────────────────────────────────────────────── */

/* 1) 토큰 ------------------------------------------------ */
:root {
  --bg: #0e1117;
  --bg-soft: #151a23;
  --panel: #1a2029;
  --panel-2: #212936;
  --line: #2b3444;
  --text: #e8edf5;
  --text-dim: #94a1b5;
  --accent: #6ee7ff;
  --accent-2: #ffd166;
  --win: #4ade80;
  --lose: #f87171;
  --radius: 14px;
  --radius-sm: 8px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  --font: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', system-ui, sans-serif;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  -webkit-font-smoothing: antialiased;
}

body {
  background-image:
    radial-gradient(1000px 500px at 15% -10%, rgba(110, 231, 255, 0.09), transparent 60%),
    radial-gradient(800px 400px at 90% 0%, rgba(255, 209, 102, 0.07), transparent 60%);
  background-attachment: fixed;
}

a { color: var(--accent); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }

/* 2) 레이아웃 -------------------------------------------- */
.app { min-height: 100vh; display: flex; flex-direction: column; }

.main {
  width: min(1180px, 100% - 32px);
  margin: 0 auto;
  padding: 24px 0 64px;
  flex: 1;
}

.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 20px;
  padding: 12px min(24px, 4vw);
  background: rgba(14, 17, 23, 0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.topbar__brand { display: flex; align-items: center; gap: 8px; color: var(--text); font-weight: 800; letter-spacing: -0.02em; }
.topbar__logo { font-size: 20px; color: var(--lose); }
.topbar__nav { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
.topbar__link {
  padding: 7px 13px;
  border-radius: 999px;
  color: var(--text-dim);
  font-size: 14px;
  font-weight: 600;
}
.topbar__link:hover { background: var(--panel); color: var(--text); }
.topbar__link.is-on { background: var(--accent); color: #05202a; }
.topbar__season select {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 12px;
}

.footer {
  border-top: 1px solid var(--line);
  padding: 20px min(24px, 4vw);
  color: var(--text-dim);
  font-size: 13px;
}

.screen { display: flex; flex-direction: column; gap: 20px; }

.grid { display: grid; gap: 16px; }
.grid--summary { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid--cards { grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
.grid--two { grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); align-items: start; }
.stack { display: flex; flex-direction: column; gap: 14px; }

/* 3) 공통 조각 ------------------------------------------- */
.panel {
  background: linear-gradient(180deg, var(--panel), var(--bg-soft));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
}
.panel__title {
  margin: 0 0 14px;
  font-size: 15px;
  letter-spacing: 0.02em;
  color: var(--text-dim);
  text-transform: uppercase;
}

.btn {
  border: 1px solid var(--line);
  background: var(--panel-2);
  color: var(--text);
  padding: 9px 16px;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 600;
  transition: transform 0.08s ease, background 0.15s ease, border-color 0.15s ease;
}
.btn:hover { background: #2a3444; border-color: #3b4761; }
.btn:active { transform: translateY(1px); }
.btn--primary { background: var(--accent); border-color: var(--accent); color: #05202a; }
.btn--primary:hover { background: #8beeff; }
.btn--danger { background: transparent; border-color: #5b2a33; color: #ffb3bd; }
.btn--danger:hover { background: #3a1b21; }
.btn--ghost { background: transparent; }
.btn--sm { padding: 6px 12px; font-size: 13px; }

.chip {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  border-radius: 999px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  font-size: 12px;
  font-weight: 700;
  white-space: nowrap;
}
.chip--sm { padding: 3px 8px; font-size: 11px; }
.chip--type { background: color-mix(in srgb, var(--chip) 22%, transparent); border-color: var(--chip); color: var(--chip); }
.chip--grade { background: color-mix(in srgb, var(--chip) 20%, transparent); border-color: var(--chip); color: var(--chip); min-width: 30px; justify-content: center; }
.chip--badge { background: rgba(255, 209, 102, 0.12); border-color: rgba(255, 209, 102, 0.4); }
.chip--gym { background: rgba(110, 231, 255, 0.12); border-color: rgba(110, 231, 255, 0.4); }
.chip__icon { font-size: 13px; }

.pill {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--text-dim);
  padding: 5px 12px;
  border-radius: 999px;
  cursor: pointer;
  font-size: 13px;
}
.pill:hover { color: var(--text); }
.pill.is-on { background: var(--chip, var(--accent)); border-color: var(--chip, var(--accent)); color: #0b1017; font-weight: 700; }

.hint { color: var(--text-dim); font-size: 12.5px; margin: 6px 0 0; }
.win { color: var(--win); font-weight: 700; }
.lose { color: var(--lose); font-weight: 700; }
.tag { padding: 2px 8px; border-radius: 6px; font-size: 12px; font-weight: 700; }
.tag--gold { background: rgba(255, 209, 102, 0.16); color: var(--accent-2); }

.empty { text-align: center; padding: 64px 16px; color: var(--text-dim); display: grid; gap: 14px; justify-items: center; }

.statline { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 14px; }
.statline:last-child { border-bottom: none; }
.statline span { color: var(--text-dim); }

.field { display: grid; gap: 6px; font-size: 13px; color: var(--text-dim); }
.field--inline { display: flex; align-items: center; gap: 8px; }
input, select, textarea {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: 8px 10px;
  color: var(--text);
}
.field input, .field select, .field textarea,
.table--input input, .table--input select,
.cellinput, .json, textarea { width: 100%; }
.field input:focus, .cellinput:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.formgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
.json { font-family: var(--mono); font-size: 12px; }

.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.toolbar__group { display: flex; flex-wrap: wrap; gap: 6px; }
.toolbar__sort { font-size: 13px; color: var(--text-dim); }
.toolbar__sort select { background: var(--panel-2); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 5px 8px; }

.details { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; }
.details summary { cursor: pointer; color: var(--text-dim); font-size: 13px; }

.tablewrap { overflow-x: auto; }
.table { width: 100%; border-collapse: collapse; font-size: 14px; }
.table th { text-align: left; color: var(--text-dim); font-size: 12px; font-weight: 700; padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.table td { padding: 8px; border-bottom: 1px solid rgba(43, 52, 68, 0.5); }
.table--sm { font-size: 13px; }
.table tr.is-clickable { cursor: pointer; }
.table tr.is-clickable:hover td { background: var(--panel-2); }
.table--input input, .table--input select { min-width: 88px; }
.th__kpi { display: flex; align-items: center; gap: 6px; }
.rank { font-size: 16px; }

/* 스프라이트 */
.sprite { image-rendering: pixelated; filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.45)); }
.sprite--bob { animation: bob 2.4s ease-in-out infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
.sprite__aura { animation: pulse 2s ease-in-out infinite; }
@keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.7; } }

/* EXP / HP 바 */
.expbar { display: grid; gap: 4px; }
.expbar__track, .hpbar__track { height: 8px; background: #0c1017; border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.expbar__fill { height: 100%; background: linear-gradient(90deg, #3ba7ff, var(--accent)); transition: width 0.4s ease; }
.expbar__meta { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text-dim); }
.hpbar { display: grid; gap: 4px; min-width: 200px; }
.hpbar__label { font-size: 12px; font-weight: 700; }
.hpbar__fill { height: 100%; transition: width 0.35s ease; background: var(--win); }
.hpbar--ok .hpbar__fill { background: var(--win); }
.hpbar--warn .hpbar__fill { background: var(--accent-2); }
.hpbar--danger .hpbar__fill { background: var(--lose); }

/* 스탯 */
.statbars { display: grid; gap: 6px; margin-top: 12px; }
.statbars__row { display: grid; grid-template-columns: 52px 44px 1fr; align-items: center; gap: 8px; font-size: 12.5px; }
.statbars__name { color: var(--text-dim); }
.statbars__value { font-family: var(--mono); text-align: right; }
.statbars__track { height: 7px; background: #0c1017; border-radius: 999px; overflow: hidden; }
.statbars__fill { height: 100%; background: linear-gradient(90deg, var(--type, var(--accent)), #ffffff55); }

.radarwrap { display: flex; justify-content: center; }
.radar__ring { fill: none; stroke: var(--line); stroke-width: 1; }
.radar__area { fill: color-mix(in srgb, var(--radar) 25%, transparent); stroke: var(--radar); stroke-width: 2; }
.radar__label { fill: var(--text-dim); font-size: 9px; font-family: var(--font); }

/* KPI 행 */
.kpilist { display: grid; gap: 14px; }
.kpirow { display: grid; gap: 6px; }
.kpirow__head { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }
.kpirow__name { font-weight: 700; }
.kpirow__val { color: var(--text-dim); margin-left: auto; font-family: var(--mono); font-size: 12px; }
.kpirow__pct { font-weight: 800; font-family: var(--mono); }
.kpirow.is-clear .kpirow__pct { color: var(--win); }
.kpirow__track { position: relative; height: 9px; background: #0c1017; border-radius: 999px; overflow: hidden; border: 1px solid var(--line); }
.kpirow__fill { height: 100%; background: linear-gradient(90deg, var(--c), #ffffff66); transition: width 0.4s ease; }
.kpirow__goal { position: absolute; left: 66.6%; top: 0; bottom: 0; width: 2px; background: rgba(255, 255, 255, 0.35); z-index: 2; }
.kpirow__foot { display: flex; gap: 12px; font-size: 11.5px; color: var(--text-dim); flex-wrap: wrap; }
.kpirow__streak { color: var(--accent-2); }
.summaryrow { display: flex; gap: 14px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--text-dim); flex-wrap: wrap; align-items: center; }

/* 4) 화면별 --------------------------------------------- */

/* 홈 */
.hero {
  display: flex;
  gap: 24px;
  align-items: center;
  justify-content: space-between;
  padding: 26px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: linear-gradient(120deg, #1b2432, #131922 60%);
  box-shadow: var(--shadow);
  flex-wrap: wrap;
}
.hero__eyebrow { margin: 0; color: var(--accent); font-size: 12px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
.hero__title { margin: 6px 0 8px; font-size: clamp(24px, 4vw, 36px); letter-spacing: -0.03em; }
.hero__desc { margin: 0 0 16px; color: var(--text-dim); }
.hero__actions { display: flex; gap: 8px; flex-wrap: wrap; }
.hero__boss { display: grid; justify-items: center; gap: 8px; max-width: 260px; }
.hero__quote { margin: 0; color: var(--text-dim); font-size: 13px; font-style: italic; text-align: center; }

.highlights { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 13.5px; }
.highlights li { line-height: 1.5; }
.mvp { display: grid; gap: 8px; justify-items: start; }
.mvp__name { font-size: 17px; }
.mvp__desc { margin: 0; color: var(--text-dim); font-size: 13px; }

/* 카드 */
.card {
  display: flex;
  gap: 12px;
  padding: 14px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: linear-gradient(160deg, color-mix(in srgb, var(--type) 12%, var(--panel)), var(--bg-soft));
  transition: transform 0.12s ease, border-color 0.15s ease;
}
.card.is-clickable { cursor: pointer; }
.card.is-clickable:hover { transform: translateY(-3px); border-color: var(--type); }
.card__sprite { display: grid; place-items: center; }
.card__body { flex: 1; display: grid; gap: 6px; min-width: 0; }
.card__top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.card__name { font-size: 16px; }
.card__sub { color: var(--text-dim); font-size: 12px; }
.card__chips { display: flex; gap: 6px; flex-wrap: wrap; }
.card__foot { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); }

/* 상세 */
.profile { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; padding: 20px; border-radius: var(--radius); border: 1px solid var(--line); background: linear-gradient(120deg, color-mix(in srgb, var(--type) 16%, var(--panel)), var(--bg-soft)); }
.profile__sprite { display: grid; justify-items: center; gap: 8px; }
.profile__stage { font-size: 11px; color: var(--text-dim); }
.profile__info { flex: 1; min-width: 280px; display: grid; gap: 10px; }
.profile__info h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
.profile__form { color: var(--type); font-size: 18px; }
.profile__tagline { margin: 0; color: var(--text-dim); font-style: italic; }
.profile__chips { display: flex; gap: 6px; flex-wrap: wrap; }
.profile__stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 0 20px; }

.badgelist { display: flex; gap: 8px; flex-wrap: wrap; }
.badgegrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.badgecard { display: grid; gap: 4px; padding: 12px; border-radius: var(--radius-sm); border: 1px dashed var(--line); opacity: 0.5; }
.badgecard.is-owned { opacity: 1; border-style: solid; background: var(--panel-2); }
.badgecard__icon { font-size: 24px; }
.badgecard__owners { font-size: 11px; color: var(--accent); }

.battlecard { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px; border-radius: var(--radius-sm); background: var(--panel-2); border: 1px solid var(--line); flex-wrap: wrap; }
.battlecard strong { flex: 1; }

.trendwrap { overflow-x: auto; }
.trend { width: 100%; height: 190px; }
.trend__base { stroke: var(--line); stroke-dasharray: 4 4; }
.trend__line { fill: none; stroke: var(--c); stroke-width: 2.5; stroke-linejoin: round; }
.trend__dot { fill: var(--c); }
.trend__label { fill: var(--text-dim); font-size: 11px; }
.trend__value { fill: var(--text); font-size: 11px; font-weight: 700; }

.evoline { display: flex; align-items: center; gap: 22px; margin-top: 18px; flex-wrap: wrap; }
.evoline__item { display: grid; justify-items: center; gap: 4px; opacity: 0.35; filter: grayscale(1); font-size: 12px; }
.evoline__item.is-on { opacity: 1; filter: none; }

/* 배틀 */
.stage {
  position: relative;
  display: grid;
  gap: 20px;
  padding: 26px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background:
    radial-gradient(600px 200px at 70% 20%, rgba(110, 231, 255, 0.08), transparent 60%),
    linear-gradient(180deg, #16202c, #0f151d);
  overflow: hidden;
}
.stage__row { display: flex; align-items: center; gap: 20px; }
.stage__row--foe { justify-content: flex-end; }
.stage__row--player { justify-content: flex-start; }
.stage__hp { flex: 0 0 auto; }
.stage__player, .stage__foe { transition: transform 0.1s ease; }
.is-hit { animation: hit 0.35s ease; }
@keyframes hit {
  0% { transform: translateX(0); filter: none; }
  25% { transform: translateX(-7px); filter: brightness(2.2); }
  50% { transform: translateX(6px); filter: none; }
  75% { transform: translateX(-3px); filter: brightness(1.6); }
  100% { transform: translateX(0); }
}

.dialog {
  border: 3px solid var(--line);
  border-radius: var(--radius);
  background: #0d1219;
  padding: 18px;
  display: grid;
  gap: 14px;
}
.dialog__text { font-size: 16px; line-height: 1.6; min-height: 3em; }
.dialog__actions { display: flex; gap: 8px; flex-wrap: wrap; }

.movelist { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.move { padding: 10px 12px; border-radius: var(--radius-sm); background: var(--panel-2); border: 1px solid var(--line); display: grid; gap: 6px; }
.move__head { display: flex; align-items: center; gap: 6px; }
.move__meta { display: flex; gap: 10px; font-size: 11.5px; color: var(--text-dim); }

.bossheader { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.bossheader__quote { margin: 0 0 10px; font-style: italic; color: var(--text-dim); }
.bossheader__meta { display: flex; gap: 6px; flex-wrap: wrap; }

/* 리그 */
.hof { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 12px; }
.hof__item { display: grid; justify-items: center; gap: 4px; padding: 14px 8px; border-radius: var(--radius-sm); background: var(--panel-2); border: 1px solid var(--line); cursor: pointer; font-size: 13px; }
.hof__item:hover { border-color: var(--accent); }
.hof__item.is-top { background: linear-gradient(180deg, rgba(255, 209, 102, 0.16), var(--panel-2)); border-color: var(--accent-2); }
.hof__rank { font-weight: 800; color: var(--text-dim); }

@media (max-width: 720px) {
  .topbar { flex-wrap: wrap; gap: 10px; }
  .main { width: calc(100% - 20px); }
  .stage__row { flex-direction: column; align-items: stretch; }
  .profile { gap: 14px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}

</style>

<div id="app"><noscript>이 페이지는 자바스크립트가 필요합니다.</noscript></div>

<script>
(function () {
'use strict';
/* ── src/core/config.js ───────────────────────────────── */
/**
 * 게임 밸런스 상수 — 수치 튜닝은 전부 이 파일에서 한다.
 * 규칙(로직)은 engine/, 데이터(사람·항목)는 data/ 에 있다.
 */
const CONFIG = {
  /** 레벨 곡선: 누적EXP(L) = round(L^3 * k)  (포켓몬 medium-fast 계열) */
  level: {
    max: 100,
    k: 1.0,
    /** 진화 레벨 (species.line 에서 개별 지정 가능, 없으면 이 값 사용) */
    evolveAt: [16, 36],
  },

  /** 업적 → EXP 환산 */
  exp: {
    /** KPI 1개를 목표 100% 달성했을 때 주는 기본 EXP */
    basePerKpi: 400,
    /** 점수 상한(초과달성 인정 배율). 1.5 = 목표의 150%까지 인정 */
    scoreCap: 1.5,
    /** 목표 초과분에 곱하는 가중치 (1.0 초과 구간) */
    overAchieveWeight: 0.6,
    /** 전 항목 목표 달성 시 보너스 */
    perfectSeasonBonus: 800,
    /** 동일 KPI 연속 달성 1개월당 보너스 (최대 streakBonusCap) */
    streakBonusPerMonth: 60,
    streakBonusCap: 600,
    /** 배틀 결과 보상 */
    battleWin: 1200,
    battleLose: 400,
  },

  /** 업적 → 노력치(EV) 환산 */
  ev: {
    /** 점수 1.0 당 얻는 EV */
    scoreToEv: 40,

/* ── src/core/rng.js ───────────────────────────────── */
/**
 * 결정론적 난수 — 같은 시드면 항상 같은 결과.
 * 배틀 결과가 새로고침마다 바뀌면 평가 도구로 못 쓰기 때문에 필수다.
 */

/** 문자열 → 32bit 정수 시드 */
function hashSeed(str) {
  let h = 2166136261 >>> 0;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619) >>> 0;
  }
  return h >>> 0;
}

/** mulberry32 */
function createRng(seed) {
  let a = typeof seed === 'string' ? hashSeed(seed) : seed >>> 0;
  const next = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
  return {
    next,
    /** [min, max] 실수 */
    range: (min, max) => min + next() * (max - min),
    /** [min, max] 정수 */
    int: (min, max) => Math.floor(min + next() * (max - min + 1)),
    chance: (p) => next() < p,
    pick: (arr) => arr[Math.floor(next() * arr.length)],
  };
}

/** 시드에서 0~31 개체값(IV) 6개 뽑기 — 사람마다 고정된 타고난 특성 */
function rollIvs(seedStr, statIds) {
  const rng = createRng(`${seedStr}:iv`);
  const out = {};
  for (const id of statIds) out[id] = rng.int(0, 31);
  return out;
}

/**
 * EXP → 레벨 → 진화 단계.
 * 누적EXP(L) = round(L^3 * k)  (CONFIG.level.k)
 */



/** 레벨 L 에 도달하는 데 필요한 누적 EXP */
function totalExpForLevel(level) {
  const l = Math.max(1, Math.min(CONFIG.level.max, level));
  return Math.round(Math.pow(l, 3) * CONFIG.level.k);
}

function levelFromExp(exp) {
  let level = 1;
  while (level < CONFIG.level.max && exp >= totalExpForLevel(level + 1)) level++;
  return level;
}

/** 레벨 + 다음 레벨까지의 진행도 */
function levelProgress(exp) {
  const level = levelFromExp(exp);
  const cur = totalExpForLevel(level);
  const next = level >= CONFIG.level.max ? cur : totalExpForLevel(level + 1);
  const gained = exp - cur;
  const need = Math.max(1, next - cur);
  return {
    exp,
    level,
    into: gained,
    need,
    ratio: level >= CONFIG.level.max ? 1 : Math.max(0, Math.min(1, gained / need)),
    toNext: Math.max(0, next - exp),
    isMax: level >= CONFIG.level.max,
  };
}

/** 멤버의 파트너 종족 결정 (지정 없으면 주력 타입으로 자동 배정) */
function resolveSpecies(member, dominantType) {
  return (
    SPECIES_BY_ID[member.speciesId] ||
    SPECIES_BY_TYPE[dominantType] ||
    SPECIES_BY_ID[Object.keys(SPECIES_BY_ID)[0]]
  );
}

/** 레벨에 맞는 진화 형태 */
function formAt(species, level) {
  const line = species.line;
  let idx = 0;
  for (let i = 0; i < line.length; i++) {
    const min = line[i].minLevel ?? CONFIG.level.evolveAt[i - 1] ?? 1;
    if (level >= min) idx = i;
  }
  const entry = line[idx];
  const nextEntry = line[idx + 1] || null;
  return {
    speciesId: species.id,
    type: species.type,
    stage: idx + 1,
    stageCount: line.length,
    name: entry.name,
    tagline: entry.tagline,
    nextName: nextEntry ? nextEntry.name : null,
    nextAt: nextEntry ? nextEntry.minLevel : null,
    isFinal: !nextEntry,
  };
}

/** 두 레벨 사이에 진화가 일어났는지 */
function didEvolve(species, fromLevel, toLevel) {
  return formAt(species, toLevel).stage > formAt(species, fromLevel).stage;
}

/* ── src/engine/stats.js ───────────────────────────────── */
/**
 * 실제 스탯 계산 — 포켓몬 3세대 이후 공식을 그대로 쓴다.
 *   HP   = floor((2*종족값 + 개체값 + floor(노력치/4)) * L/100) + L + 10
 *   그 외 = (floor((2*종족값 + 개체값 + floor(노력치/4)) * L/100) + 5) * 성격보정
 *
 * 종족값 = 파트너 고유 재능, 개체값 = 사람마다 타고난 편차(고정),
 * 노력치 = 실제 업적으로 쌓은 부분(= 이 도구에서 유일하게 스스로 바꿀 수 있는 값).
 */


function calcStat(statId, base, iv, ev, level, nature) {
  const core = Math.floor(((2 * base + iv + Math.floor(ev / 4)) * level) / 100);
  if (statId === 'hp') return core + level + 10;
  let value = core + 5;
  if (nature) {
    if (nature.up === statId) value = Math.floor(value * 1.1);
    if (nature.down === statId) value = Math.floor(value * 0.9);
  }
  return value;
}

/** 6스탯 전부 */
function calcStats({ base, ivs, evs, level, natureId }) {
  const nature = NATURE_BY_ID[natureId] || null;
  const out = {};
  for (const id of STAT_IDS) {
    out[id] = calcStat(id, base[id] ?? 50, ivs?.[id] ?? 0, evs?.[id] ?? 0, level, nature);
  }
  out.total = STAT_IDS.reduce((s, id) => s + out[id], 0);
  return out;
}

/** 빈 노력치 */
function emptyEvs() {
  return Object.fromEntries(STAT_IDS.map((id) => [id, 0]));
}

/**
 * 노력치 누적. 스탯별 상한(252)·총합 상한(510)을 지킨다.
 * @returns {{evs: object, applied: object}} applied = 실제로 들어간 양
 */
function addEvs(evs, gains, caps) {
  const next = { ...evs };
  const applied = {};
  let total = STAT_IDS.reduce((s, id) => s + (next[id] || 0), 0);
  for (const id of STAT_IDS) {
    const want = Math.max(0, Math.round(gains[id] || 0));
    if (!want) {
      applied[id] = 0;
      continue;
    }
    const roomStat = Math.max(0, caps.statCap - (next[id] || 0));
    const roomTotal = Math.max(0, caps.totalCap - total);
    const give = Math.min(want, roomStat, roomTotal);
    next[id] = (next[id] || 0) + give;
    total += give;
    applied[id] = give;
  }
  return { evs: next, applied };
}

/** 레이더 차트용 정규화 (0~1) */
function normalizeStats(stats, max = 400) {
  return STAT_IDS.map((id) => Math.max(0.04, Math.min(1, (stats[id] || 0) / max)));
}

/* ── src/engine/scoring.js ───────────────────────────────── */
/**
 * 업적 기록 → 점수 / EXP / 노력치.
 * "이번 달 실적을 어떻게 게임 수치로 바꿀 것인가"의 전부가 여기 있다.
 */




/** 이번 시즌에 적용될 KPI 목표치 (시즌별 override 지원) */
function targetFor(kpi, season) {
  const t = season?.targets?.[kpi.id];
  return typeof t === 'number' && t > 0 ? t : kpi.target;
}

/**
 * 실적 1건 → 점수. 목표 대비 비율에 상한을 씌우고,
 * 초과분은 overAchieveWeight 만큼만 인정한다(무한 인플레 방지).
 */
function scoreOf(value, target) {
  const raw = target > 0 ? value / target : 0;
  if (raw <= 1) return { raw, score: Math.max(0, raw) };
  const over = Math.min(raw, CONFIG.exp.scoreCap) - 1;
  return { raw, score: 1 + over * CONFIG.exp.overAchieveWeight };
}

/**
 * 한 멤버의 한 시즌 채점.
 * @param {object} season
 * @param {Record<string, number>} record  { kpiId: 실적 }
 * @param {Record<string, number>} streaks { kpiId: 직전까지 연속 달성 개월 }
 */
function scoreSeason(season, record, streaks = {}) {
  /** @type {import('../core/types.js').KpiScore[]} */
  const kpiScores = KPIS.map((kpi) => {
    const value = Number(record?.[kpi.id] ?? 0);
    const target = targetFor(kpi, season);
    const { raw, score } = scoreOf(value, target);
    const cleared = raw >= CONFIG.badge.threshold;

    const streak = cleared ? streaks[kpi.id] || 0 : 0;
    const streakBonus = Math.min(
      CONFIG.exp.streakBonusCap,
      streak * CONFIG.exp.streakBonusPerMonth,
    );

    const exp = Math.round(score * kpi.weight * CONFIG.exp.basePerKpi + streakBonus);
    const ev = Math.min(
      CONFIG.ev.perSeasonStatCap,
      Math.round(score * CONFIG.ev.scoreToEv * kpi.weight),
    );

    return { kpiId: kpi.id, value, target, raw, score, exp, ev, cleared, streak, streakBonus };
  });

  const overall =
    kpiScores.reduce((s, k) => s + k.score * KPI_BY_ID[k.kpiId].weight, 0) / TOTAL_WEIGHT;

  const perfect = kpiScores.every((k) => k.cleared);
  const baseExp = kpiScores.reduce((s, k) => s + k.exp, 0);
  const bonusExp = perfect ? CONFIG.exp.perfectSeasonBonus : 0;

  return {
    kpiScores,
    overall,
    grade: gradeOf(overall),
    perfect,
    expFromKpi: baseExp,
    expBonus: bonusExp,
    evGains: evGainsFrom(kpiScores),
  };
}

/** KPI 점수 → 스탯별 노력치 */
function evGainsFrom(kpiScores) {
  const gains = {};
  for (const ks of kpiScores) {
    const kpi = KPI_BY_ID[ks.kpiId];
    gains[kpi.stat] = (gains[kpi.stat] || 0) + ks.ev;
  }
  return gains;
}

/** 가장 잘한 영역 = 파트너 타입 자동 배정 근거 */
function dominantType(kpiScores) {
  let best = null;
  for (const ks of kpiScores) {
    const kpi = KPI_BY_ID[ks.kpiId];
    const w = ks.score * kpi.weight;
    if (!best || w > best.w) best = { w, type: kpi.type };
  }
  return best ? best.type : Object.keys(TYPES)[0];
}

/** 배틀에 들고 갈 기술 = 점수 높은 KPI 상위 N개 */
function movesFrom(kpiScores) {
  return [...kpiScores]
    .sort((a, b) => b.score - a.score)
    .slice(0, CONFIG.battle.moveSlots)
    .map((ks) => {
      const kpi = KPI_BY_ID[ks.kpiId];
      return {
        kpiId: kpi.id,
        name: kpi.name,
        type: kpi.type,
        category: kpi.category,
        stat: kpi.stat,
        power: Math.round(CONFIG.battle.powerBase + ks.score * CONFIG.battle.powerScale),
        accuracy: Math.min(1, CONFIG.battle.accBase + ks.score * CONFIG.battle.accScale),
        score: ks.score,
      };
    });
}

/* ── src/engine/battle.js ───────────────────────────────── */
/**
 * 월간 보스전 시뮬레이션.
 * 같은 데이터 → 항상 같은 로그. (rng 시드 = seasonId + memberId)
 */





const IV31 = { hp: 31, atk: 31, def: 31, spa: 31, spd: 31, spe: 31 };

/** 보스도 같은 공식으로 스탯을 만든다 (노력치 없음, 개체값 만렙) */
function bossStats(boss) {
  return calcStats({ base: boss.base, ivs: IV31, evs: {}, level: boss.level, natureId: null });
}

function damage({ level, power, atk, def, stab, eff, crit, rand }) {
  const core = Math.floor((Math.floor((2 * level) / 5 + 2) * power * atk) / def / 50) + 2;
  return Math.max(1, Math.floor(core * stab * eff * crit * rand));
}

/**
 * @param {object} attacker { name, level, type, stats }
 * @param {object} defender
 * @param {object} move { name, type, power, category, stat? }
 */
function attack(attacker, defender, move, rng) {
  const acc = move.accuracy ?? 1;
  if (!rng.chance(acc)) {
    return { miss: true, dmg: 0, text: `${attacker.name}의 ${move.name}! 하지만 빗나갔다...` };
  }
  const atkStat = move.stat || (move.category === 'physical' ? 'atk' : 'spa');
  const defStat = move.category === 'physical' ? 'def' : 'spd';
  const eff = typeEffectiveness(move.type, defender.type);
  const stab = move.type === attacker.type ? CONFIG.battle.stab : 1;
  const isCrit = rng.chance(CONFIG.battle.critChance);
  const dmg = damage({
    level: attacker.level,
    power: move.power,
    atk: attacker.stats[atkStat],
    def: defender.stats[defStat],
    stab,
    eff,
    crit: isCrit ? CONFIG.battle.critMultiplier : 1,
    rand: rng.range(CONFIG.battle.randMin, CONFIG.battle.randMax),
  });
  const extras = [isCrit ? '급소에 맞았다!' : '', effectivenessLabel(eff)].filter(Boolean);
  return {
    miss: false,
    dmg,
    crit: isCrit,
    eff,
    text: `${attacker.name}의 ${move.name}!${extras.length ? ' ' + extras.join(' ') : ''}`,
  };
}

/**
 * 배틀 실행.
 * @param {object} player { name, level, type, stats, moves }
 * @param {object} boss   data/bosses.js 엔트리
 * @param {string} seed
 */
function runBattle(player, boss, seed) {
  const rng = createRng(seed);
  const bStats = bossStats(boss);
  const foe = { name: `${boss.title} ${boss.name}`, level: boss.level, type: boss.type, stats: bStats };

  let pHp = player.stats.hp;
  let fHp = bStats.hp;
  const pMaxHp = pHp;
  const fMaxHp = fHp;

  const log = [
    { kind: 'intro', text: `${foe.name}이(가) 승부를 걸어왔다!` },
    { kind: 'quote', text: `"${boss.quote}"` },
    { kind: 'intro', text: `가랏, ${player.name}!` },
  ];

  const playerFirst = player.stats.spe >= bStats.spe;
  let turn = 0;

  while (pHp > 0 && fHp > 0 && turn < CONFIG.battle.turnLimit) {
    turn++;
    const order = playerFirst ? ['player', 'foe'] : ['foe', 'player'];
    for (const side of order) {
      if (pHp <= 0 || fHp <= 0) break;
      if (side === 'player') {
        const move = pickPlayerMove(player, foe, rng, turn);
        const r = attack(player, foe, move, rng);
        fHp = Math.max(0, fHp - r.dmg);
        log.push({ kind: 'player', turn, text: r.text, dmg: r.dmg, foeHp: fHp / fMaxHp, playerHp: pHp / pMaxHp });
      } else {
        const move = boss.moves[(turn - 1) % boss.moves.length];
        const r = attack(foe, player, { ...move, accuracy: 0.95 }, rng);
        pHp = Math.max(0, pHp - r.dmg);
        log.push({ kind: 'foe', turn, text: r.text, dmg: r.dmg, foeHp: fHp / fMaxHp, playerHp: pHp / pMaxHp });
      }
    }
  }

  const win = fHp <= 0 && pHp > 0;
  const draw = fHp > 0 && pHp > 0;
  log.push({
    kind: 'result',
    text: win
      ? `${foe.name}을(를) 쓰러뜨렸다! ${boss.badgeId ? '배지를 획득했다!' : ''}`
      : draw
        ? '시간 초과. 승부가 나지 않았다...'
        : `${player.name}은(는) 쓰러졌다...`,
  });

  return {
    win,
    draw,
    turns: turn,
    playerHpLeft: pHp / pMaxHp,
    foeHpLeft: fHp / fMaxHp,
    log,
    foe: { name: foe.name, level: foe.level, type: foe.type, stats: bStats, badgeId: boss.badgeId },
    expReward: win ? CONFIG.exp.battleWin : CONFIG.exp.battleLose,
  };
}

/**
 * 기대 데미지(위력 × 자속 × 상성 × 명중 × 공격스탯)가 가장 높은 기술을 고른다.
 * 실제 트레이너처럼 상성을 보고 고르되, 25% 확률로 다른 기술도 섞어 변수를 준다.
 */
function pickPlayerMove(player, foe, rng, turn) {
  const moves = player.moves;
  if (!moves.length) {
    return { name: '몸통박치기', type: 'grass', power: 40, category: 'physical', accuracy: 1 };
  }
  const ranked = [...moves].sort((a, b) => expected(b) - expected(a));
  return rng.chance(0.25) ? ranked[(turn - 1) % ranked.length] : ranked[0];

  function expected(mv) {
    const atkStat = player.stats[mv.stat || (mv.category === 'physical' ? 'atk' : 'spa')] || 1;
    const defStat = foe.stats[mv.category === 'physical' ? 'def' : 'spd'] || 1;
    const stab = mv.type === player.type ? CONFIG.battle.stab : 1;
    return mv.power * stab * typeEffectiveness(mv.type, foe.type) * (mv.accuracy ?? 1) * (atkStat / defStat);
  }
}

/* ── src/engine/badges.js ───────────────────────────────── */
/**
 * 업적 배지 판정 규칙.
 * 규칙 추가 = RULES 에 한 줄 추가 (id 는 data/badges.js 와 맞출 것).
 *
 * ctx = {
 *   result,        // 이번 시즌 결과 (kpiScores, overall, perfect, ...)
 *   prev,          // 직전 시즌 결과 or null
 *   history,       // 이전 시즌 결과 배열 (오래된 → 최근)
 *   evolved,       // 이번 시즌에 진화했는지
 *   rankInSeason,  // 1부터
 * }
 */


const RULES = [
  {
    id: 'perfect',
    test: (ctx) => ctx.result.perfect,
  },
  {
    id: 'overdrive',
    test: (ctx) => ctx.result.kpiScores.some((k) => k.raw >= CONFIG.badge.goldThreshold + 0.3),
  },
  {
    id: 'evolved',
    test: (ctx) => ctx.evolved,
  },
  {
    id: 'mvp',
    test: (ctx) => ctx.rankInSeason === 1,
  },
  {
    id: 'streak3',
    test: (ctx) => {
      const last = [...ctx.history.slice(-2), ctx.result];
      return last.length === 3 && last.every((r) => r.overall >= 1.0);
    },
  },
  {
    id: 'allrounder',
    test: (ctx) => {
      const scores = ctx.result.kpiScores.map((k) => k.score);
      if (!scores.length || Math.min(...scores) < 0.9) return false;
      const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
      const sd = Math.sqrt(scores.reduce((s, v) => s + (v - avg) ** 2, 0) / scores.length);
      return sd <= 0.15;
    },
  },
  {
    id: 'comeback',
    test: (ctx) => !!ctx.prev && ctx.result.overall - ctx.prev.overall >= 0.25,
  },
];

/** 이번 시즌에 새로 얻은 배지 id 목록 (체육관 배지는 배틀 승리로 별도 부여) */
function evaluateBadges(ctx) {
  return RULES.filter((r) => {
    try {
      return r.test(ctx);
    } catch {
      return false;
    }
  }).map((r) => r.id);
}

/* ── src/engine/evaluate.js ───────────────────────────────── */
/**
 * 파이프라인 오케스트레이션.
 * 시즌을 오래된 순서대로 재생(replay)하면서 누적 EXP·노력치·배지·연속기록을 쌓는다.
 * 화면(ui/)은 이 함수의 결과만 읽는다 — 계산 로직이 UI로 새어나가지 않게.
 */










const sortSeasons = (seasons) => [...seasons].sort((a, b) => String(a.id).localeCompare(String(b.id)));

/**
 * 전체 리그 계산.
 * @param {{members:any[], seasons:any[]}} state
 */
function evaluateAll(state) {
  const members = state.members || [];
  const seasons = sortSeasons(state.seasons || []);

  /** 멤버별 누적 상태 */
  const carry = new Map(
    members.map((m) => [
      m.id,
      {
        totalExp: 0,
        evs: emptyEvs(),
        streaks: {},
        badges: new Set(),
        history: [],
        results: [],
      },
    ]),
  );

  const seasonReports = [];

  for (const season of seasons) {
    const bossDef = BOSS_BY_ID[season.bossId] || BOSSES[0];
    const entries = [];

    // 1차: 점수 → EXP/노력치 → 레벨/스탯
    for (const member of members) {
      const c = carry.get(member.id);
      const record = season.records?.[member.id] || {};
      const scored = scoreSeason(season, record, c.streaks);

      const ivs = rollIvs(member.id, STAT_IDS);
      const species = resolveSpecies(member, dominantType(scored.kpiScores));

      const levelBefore = levelFromExp(c.totalExp);

      // 업적 EXP·노력치 반영
      const expFromWork = scored.expFromKpi + scored.expBonus;
      const evResult = addEvs(c.evs, scored.evGains, CONFIG.ev);
      const expAfterWork = c.totalExp + expFromWork;
      const levelAfterWork = levelFromExp(expAfterWork);

      entries.push({
        memberId: member.id,
        member,
        seasonId: season.id,
        species,
        ivs,
        ...scored,
        expFromWork,
        levelBefore,
        levelAfterWork,
        evs: evResult.evs,
        evApplied: evResult.applied,
        statsForBattle: calcStats({
          base: species.base,
          ivs,
          evs: evResult.evs,
          level: levelAfterWork,
          natureId: member.natureId,
        }),
      });
    }

    // 2차: 체육관 배틀 (관장 레벨은 팀 평균에 맞춰 스케일링)
    const boss = { ...bossDef, level: resolveBossLevel(bossDef, season, entries) };

    for (const e of entries) {
      const battle = runBattle(
        {
          name: formAt(e.species, e.levelAfterWork).name,
          level: e.levelAfterWork,
          type: e.species.type,
          stats: e.statsForBattle,
          moves: movesFrom(e.kpiScores),
        },
        boss,
        `${season.id}:${e.memberId}`,
      );

      const totalExp = c0(carry, e.memberId).totalExp + e.expFromWork + battle.expReward;
      const progress = levelProgress(totalExp);
      const form = formAt(e.species, progress.level);

      Object.assign(e, {
        battle,
        expFromBattle: battle.expReward,
        expGained: e.expFromWork + battle.expReward,
        totalExp,
        progress,
        form,
        stats: calcStats({
          base: e.species.base,
          ivs: e.ivs,
          evs: e.evs,
          level: progress.level,
          natureId: e.member.natureId,
        }),
        evolved: form.stage > formAt(e.species, e.levelBefore).stage,
      });
      delete e.statsForBattle;
    }

    // 3차: 랭킹이 필요한 판정(배지) — 종합점수 내림차순
    const ranking = [...entries].sort((a, b) => b.overall - a.overall || b.totalExp - a.totalExp);
    ranking.forEach((e, i) => {
      e.rank = i + 1;
    });

    for (const e of entries) {
      const c = carry.get(e.memberId);
      const gained = evaluateBadges({
        result: e,
        prev: c.history[c.history.length - 1] || null,
        history: c.history,
        evolved: e.evolved,
        rankInSeason: e.rank,
      });
      if (e.battle.win && e.battle.foe.badgeId) gained.push(e.battle.foe.badgeId);

      e.newBadges = gained.filter((id) => !c.badges.has(id));
      e.newBadges.forEach((id) => c.badges.add(id));
      e.badges = [...c.badges];

      // 누적 상태 갱신
      c.totalExp = e.totalExp;
      c.evs = e.evs;
      c.streaks = nextStreaks(c.streaks, e.kpiScores);
      c.history.push(e);
      c.results.push(e);
    }

    seasonReports.push({
      season,
      boss,
      entries,
      ranking,
      teamAverage: entries.length
        ? entries.reduce((s, e) => s + e.overall, 0) / entries.length
        : 0,
      clearRate: entries.length ? entries.filter((e) => e.battle.win).length / entries.length : 0,
    });
  }

  const bySeasonId = Object.fromEntries(seasonReports.map((r) => [r.season.id, r]));
  const timelines = Object.fromEntries([...carry].map(([id, c]) => [id, c.results]));
  const latest = Object.fromEntries(
    [...carry].map(([id, c]) => [id, c.results[c.results.length - 1] || null]),
  );

  return {
    members,
    seasons,
    seasonReports,
    bySeasonId,
    timelines,
    latest,
    /** 명예의 전당: 누적 EXP 순 */
    hallOfFame: members
      .map((m) => ({ member: m, result: latest[m.id] }))
      .filter((x) => x.result)
      .sort((a, b) => b.result.totalExp - a.result.totalExp),
  };
}

const c0 = (carry, memberId) => carry.get(memberId);

/**
 * 이번 달 관장 레벨.
 * 우선순위: season.bossLevel(수동) > 팀 평균 + offset(자동) > bosses.js 의 기본값
 */
function resolveBossLevel(bossDef, season, entries) {
  if (typeof season.bossLevel === 'number' && season.bossLevel > 0) return season.bossLevel;
  const cfg = CONFIG.battle.bossScaling;
  if (!cfg.enabled || !entries.length) return bossDef.level;
  const avg = entries.reduce((s, e) => s + e.levelAfterWork, 0) / entries.length;
  return Math.max(cfg.min, Math.min(cfg.max, Math.round(avg + (season.bossLevelOffset ?? cfg.offset))));
}

/** KPI별 연속 달성 개월 수 갱신 */
function nextStreaks(prev, kpiScores) {
  const out = {};
  for (const ks of kpiScores) {
    out[ks.kpiId] = ks.cleared ? (prev[ks.kpiId] || 0) + 1 : 0;
  }
  return out;
}

/** 한 멤버의 KPI별 시즌 추이 (그래프용) */
function trendOf(timeline, kpiId) {
  return timeline.map((r) => {
    const ks = r.kpiScores.find((k) => k.kpiId === kpiId);
    return { seasonId: r.seasonId, score: ks ? ks.score : 0, value: ks ? ks.value : 0 };
  });
}

function kpiLabel(kpiId) {
  return KPI_BY_ID[kpiId]?.name || kpiId;
}

/**
 * 상태 보관소 — localStorage 영속 + 구독.
 * 서버가 없으므로 데이터의 원본은 브라우저다. 백업은 관리자 화면의 JSON 내보내기.
 */


const KEY = 'pokereview.state.v1';

function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return makeSeedState();
    const parsed = JSON.parse(raw);
    return migrate(parsed);
  } catch (e) {
    console.warn('[store] 불러오기 실패, 시드 데이터로 시작합니다.', e);
    return makeSeedState();
  }
}

/** 스키마 버전이 올라갈 때 여기서 변환 */
function migrate(state) {
  if (!state.version) state.version = 1;
  state.members ||= [];
  state.seasons ||= [];
  state.settings ||= { orgName: '트레이너 리그', currentSeasonId: state.seasons.at(-1)?.id };
  return state;
}

let state = load();
const listeners = new Set();

function persist() {
  try {
    localStorage.setItem(KEY, JSON.stringify(state));
  } catch (e) {
    console.error('[store] 저장 실패', e);
  }
}

function emit() {
  for (const fn of listeners) fn(state);
}

const store = {
  get: () => state,

  subscribe(fn) {
    listeners.add(fn);
    return () => listeners.delete(fn);
  },

  /** mutator(draft) 안에서 state 를 직접 수정 */
  update(mutator) {
    mutator(state);
    persist();
    emit();
  },

  replace(next) {
    state = migrate(next);
    persist();
    emit();
  },

  reset() {
    store.replace(makeSeedState());
  },

  clearAll() {
    store.replace({ version: 1, members: [], seasons: [], settings: { orgName: '트레이너 리그' } });
  },

  // ── 편의 액션 ───────────────────────────────────────────
  upsertMember(member) {
    store.update((s) => {
      const i = s.members.findIndex((m) => m.id === member.id);
      if (i >= 0) s.members[i] = { ...s.members[i], ...member };
      else s.members.push(member);
    });
  },

  removeMember(id) {
    store.update((s) => {
      s.members = s.members.filter((m) => m.id !== id);
      s.seasons.forEach((se) => {
        delete se.records?.[id];
        delete se.notes?.[id];
      });
    });
  },

  upsertSeason(season) {
    store.update((s) => {
      const i = s.seasons.findIndex((x) => x.id === season.id);
      if (i >= 0) s.seasons[i] = { ...s.seasons[i], ...season };
      else s.seasons.push({ records: {}, notes: {}, ...season });
      s.seasons.sort((a, b) => String(a.id).localeCompare(String(b.id)));
    });
  },

  removeSeason(id) {
    store.update((s) => {
      s.seasons = s.seasons.filter((x) => x.id !== id);
      if (s.settings.currentSeasonId === id) s.settings.currentSeasonId = s.seasons.at(-1)?.id;
    });
  },

  setRecord(seasonId, memberId, kpiId, value) {
    store.update((s) => {
      const season = s.seasons.find((x) => x.id === seasonId);
      if (!season) return;
      season.records ||= {};
      season.records[memberId] ||= {};
      season.records[memberId][kpiId] = Number(value) || 0;
    });
  },

  setNote(seasonId, memberId, text) {
    store.update((s) => {
      const season = s.seasons.find((x) => x.id === seasonId);
      if (!season) return;
      season.notes ||= {};
      season.notes[memberId] = text;
    });
  },

  setSetting(key, value) {
    store.update((s) => {
      s.settings[key] = value;
    });
  },

  exportJson() {
    return JSON.stringify(state, null, 2);
  },

  importJson(text) {
    const parsed = JSON.parse(text);
    if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.members)) {
      throw new Error('형식이 올바르지 않습니다 (members 배열이 필요).');
    }
    store.replace(parsed);
  },
};

/** 새 id 생성 */
function uid(prefix = 'm') {
  return `${prefix}${Date.now().toString(36)}${Math.floor(Math.random() * 1e3).toString(36)}`;
}

/** 아주 작은 DOM 헬퍼 — 프레임워크 없이 화면을 만든다. */

function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style' && typeof v === 'object') applyStyle(el, v);
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
    else if (k === 'html') el.innerHTML = v;
    else el.setAttribute(k, v === true ? '' : String(v));
  }
  append(el, children);
  return el;
}

/** CSS 변수(--x)는 setProperty 로만 설정된다 — 대입은 무시된다 */
function applyStyle(el, styles) {
  for (const [prop, value] of Object.entries(styles)) {
    if (prop.startsWith('--')) el.style.setProperty(prop, value);
    else el.style[prop] = value;
  }
}

function append(el, children) {
  for (const c of children.flat(Infinity)) {
    if (c === null || c === undefined || c === false) continue;
    el.appendChild(c instanceof Node ? c : document.createTextNode(String(c)));
  }
}

function clear(el) {
  while (el.firstChild) el.removeChild(el.firstChild);
}

function svg(tag, props = {}, ...children) {
  const el = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    el.setAttribute(k, String(v));
  }
  for (const c of children.flat(Infinity)) if (c) el.appendChild(c);
  return el;
}

const fmt = {
  pct: (v, digits = 0) => `${(v * 100).toFixed(digits)}%`,
  num: (v) => new Intl.NumberFormat('ko-KR').format(Math.round(v)),
  score: (v) => v.toFixed(2),
  season: (id) => {
    const [y, m] = String(id).split('-');
    return m ? `${y}년 ${Number(m)}월` : id;
  },
};

/* ── src/ui/sprite.js ───────────────────────────────── */
/**
 * 절차적 픽셀 스프라이트 — 외부 이미지 파일 없이 SVG 로 생성한다.
 * 같은 (종족, 진화단계) 면 항상 같은 모양.  실제 일러스트로 교체하고 싶으면
 * spriteFor() 만 <img> 반환으로 바꾸면 나머지 화면은 그대로 동작한다.
 */




const GRID = 16;

function shade(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const r = Math.max(0, Math.min(255, ((n >> 16) & 255) + amount));
  const g = Math.max(0, Math.min(255, ((n >> 8) & 255) + amount));
  const b = Math.max(0, Math.min(255, (n & 255) + amount));
  return `#${((1 << 24) | (r << 16) | (g << 8) | b).toString(16).slice(1)}`;
}

/**
 * @param {object} opts { speciesId, type, stage=1, size=96, animate=true }
 * @returns {SVGElement}
 */
function spriteFor({ speciesId = 'ember', type = 'fire', stage = 1, size = 96, animate = true } = {}) {
  const rng = createRng(`${speciesId}:${stage}`);
  const color = TYPES[type]?.color || '#8ab4f8';
  const light = shade(color, 45);
  const dark = shade(color, -60);

  const half = GRID / 2;
  const cells = [];
  // 몸통: 진화할수록 커지고 실루엣이 복잡해진다
  const bodyW = 3.4 + stage * 0.5;
  const bodyH = 3.6 + stage * 0.6;
  const noise = 0.22 + stage * 0.08;

  for (let y = 0; y < GRID; y++) {
    for (let x = 0; x < half; x++) {
      const dx = (x - (half - 0.5)) / bodyW;
      const dy = (y - (GRID / 2 + 0.5)) / bodyH;
      const d = Math.sqrt(dx * dx + dy * dy);
      const filled = d < 1 ? true : d < 1 + noise ? rng.chance(1 - (d - 1) / noise) : false;
      if (filled) {
        cells.push([x, y]);
        cells.push([GRID - 1 - x, y]); // 좌우 대칭
      }
    }
  }

  // 머리 위 장식(뿔/불꽃) — 2단계부터
  if (stage >= 2) {
    const hornH = stage;
    for (let i = 0; i < hornH; i++) {
      const y = 2 - i;
      if (y < 0) continue;
      const x = half - 2 - rng.int(0, 1);
      cells.push([x, y], [GRID - 1 - x, y]);
    }
  }

  const unit = size / GRID;
  const root = svg('svg', {
    viewBox: `0 0 ${GRID} ${GRID}`,
    width: size,
    height: size,
    class: `sprite ${animate ? 'sprite--bob' : ''}`,
    'shape-rendering': 'crispEdges',
    role: 'img',
    'aria-label': `${TYPES[type]?.name || type} 타입 파트너`,
  });

  const g = svg('g');
  const seen = new Set();
  for (const [x, y] of cells) {
    const key = `${x},${y}`;
    if (seen.has(key)) continue;
    seen.add(key);
    // 위쪽은 밝게, 아래쪽은 어둡게 (간단한 셰이딩)
    const t = y / GRID;
    const fill = t < 0.35 ? light : t > 0.75 ? dark : color;
    g.appendChild(svg('rect', { x, y, width: 1.02, height: 1.02, fill }));
  }
  root.appendChild(g);

  // 눈
  const eyeY = 5 + (stage >= 3 ? 0 : 1);
  const eyeX = half - 2;
  for (const ex of [eyeX, GRID - 1 - eyeX]) {
    root.appendChild(svg('rect', { x: ex, y: eyeY, width: 1, height: 1.4, fill: '#12151c' }));
    root.appendChild(svg('rect', { x: ex, y: eyeY, width: 0.5, height: 0.5, fill: '#ffffff' }));
  }
  // 입
  root.appendChild(
    svg('rect', { x: half - 1, y: eyeY + 2.2, width: 2, height: 0.6, fill: shade(dark, -20) }),
  );

  // 최종 진화 오라
  if (stage >= 3) {
    root.appendChild(
      svg('circle', {
        cx: half,
        cy: GRID / 2,
        r: GRID / 2 - 0.5,
        fill: 'none',
        stroke: light,
        'stroke-width': 0.25,
        opacity: 0.55,
        class: 'sprite__aura',
      }),
    );
  }

  root.dataset.unit = unit;
  return root;
}

/** 보스는 실루엣을 조금 다르게 (더 크고 각지게) */
function bossSprite(boss, size = 112) {
  return spriteFor({ speciesId: `boss:${boss.id}`, type: boss.type, stage: 3, size });
}

/**
 * 스탯 눈금 자동 결정 — 레벨이 낮을 땐 그래프가 점처럼 보이지 않도록,
 * 높을 땐 잘리지 않도록 실제 값에 맞춰 올림한다.
 */
function statScale(stats) {
  const peak = Math.max(...STAT_IDS.map((id) => stats[id] || 0), 1);
  return Math.max(50, Math.ceil((peak * 1.25) / 25) * 25);
}

/** 6스탯 막대 */
function statBars(stats, { max = statScale(stats) } = {}) {

/** 육각형 레이더 차트 */
function radar(stats, { size = 220, max = statScale(stats), color = '#6ee7ff' } = {}) {
  const cx = size / 2;
  const cy = size / 2;
  const r = size / 2 - 28;
  const n = STAT_IDS.length;
  const pt = (i, ratio) => {
    const a = (Math.PI * 2 * i) / n - Math.PI / 2;
    return [cx + Math.cos(a) * r * ratio, cy + Math.sin(a) * r * ratio];
  };

  const root = svg('svg', { viewBox: `0 0 ${size} ${size}`, width: size, height: size, class: 'radar' });

  for (const ring of [0.25, 0.5, 0.75, 1]) {
    root.appendChild(
      svg('polygon', {
        points: STAT_IDS.map((_, i) => pt(i, ring).join(',')).join(' '),
        class: 'radar__ring',
      }),
    );
  }
  root.appendChild(
    svg('polygon', {
      points: STAT_IDS.map((id, i) => pt(i, Math.max(0.05, Math.min(1, (stats[id] || 0) / max))).join(',')).join(' '),
      class: 'radar__area',
      style: `--radar:${color}`,
    }),
  );
  STATS.forEach((s, i) => {
    const [x, y] = pt(i, 1.22);
    const label = svg('text', { x, y, class: 'radar__label', 'text-anchor': 'middle' });
    label.textContent = `${s.name} ${stats[s.id] || 0}`;
    root.appendChild(label);
  });
  return root;
}

/** 해시 기반 라우터. #/dex/m1 처럼 파라미터를 쓴다. */

const routes = [];
let notFound = null;
let onRender = null;

function route(pattern, handler) {
  const keys = [];
  const regex = new RegExp(
    '^' +
      pattern
        .split('/')
        .map((seg) => {
          if (seg.startsWith(':')) {
            keys.push(seg.slice(1));
            return '([^/]+)';
          }
          return seg.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        })
        .join('/') +
      '$',
  );
  routes.push({ regex, keys, handler, pattern });
}

function setNotFound(handler) {
  notFound = handler;
}

function onNavigate(fn) {
  onRender = fn;
}

function currentPath() {
  const hash = location.hash.replace(/^#/, '');
  return hash || '/home';
}

function navigate(path) {
  if (currentPath() === path) render();
  else location.hash = path;
}

function render() {
  const path = currentPath();
  for (const r of routes) {
    const m = path.match(r.regex);
    if (m) {
      const params = Object.fromEntries(r.keys.map((k, i) => [k, decodeURIComponent(m[i + 1])]));
      onRender?.(path, r.pattern);
      r.handler(params);
      return;
    }
  }
  onRender?.(path, null);
  notFound?.();
}

function startRouter() {
  window.addEventListener('hashchange', render);
  render();
}

/** 시즌별 종합점수 꺾은선 */
function trendChart(timeline, color) {
  const W = 640;
  const H = 180;
  const pad = 32;
  if (timeline.length < 2) return h('p', { class: 'hint' }, '시즌이 2개 이상 쌓이면 추이가 표시됩니다.');

  const xs = (i) => pad + (i * (W - pad * 2)) / (timeline.length - 1);
  // 데이터 폭에 맞춰 y축을 잡는다 (0부터 그리면 선이 납작해져 추이가 안 보인다)
  const values = timeline.map((r) => r.overall);
  const lo = Math.min(0.85, ...values) - 0.08;
  const hi = Math.max(1.15, ...values) + 0.08;
  const ys = (v) => H - pad - ((v - lo) / (hi - lo)) * (H - pad * 2);

  const root = svg('svg', { viewBox: `0 0 ${W} ${H}`, class: 'trend', preserveAspectRatio: 'none' });
  // 기준선 1.0
  root.appendChild(svg('line', { x1: pad, x2: W - pad, y1: ys(1), y2: ys(1), class: 'trend__base' }));
  root.appendChild(
    svg('polyline', {
      points: timeline.map((r, i) => `${xs(i)},${ys(r.overall)}`).join(' '),
      class: 'trend__line',
      style: `--c:${color}`,
    }),
  );
  timeline.forEach((r, i) => {
    root.appendChild(svg('circle', { cx: xs(i), cy: ys(r.overall), r: 4, class: 'trend__dot', style: `--c:${color}` }));
    const t = svg('text', { x: xs(i), y: H - 8, class: 'trend__label', 'text-anchor': 'middle' });
    t.textContent = r.seasonId.slice(5) + '월';
    root.appendChild(t);
    const v = svg('text', { x: xs(i), y: ys(r.overall) - 10, class: 'trend__value', 'text-anchor': 'middle' });
    v.textContent = fmt.score(r.overall);
    root.appendChild(v);
  });
  return h('div', { class: 'trendwrap' }, root);
}

/** 진화 라인 표시 */
function evolutionLine(species, level) {
  return h(
    'div',
    { class: 'evoline' },
    species.line.map((entry, i) => {
      const unlocked = level >= entry.minLevel;
      return h(

        spriteFor({ speciesId: species.id, type: species.type, stage: i + 1, size: 64, animate: false }),

}

/** 로그를 한 줄씩 재생하는 배틀 화면 */
function BattleTheater(report, entry) {
  const { battle, member, species, form, progress } = entry;
  const log = battle.log;
  let idx = 0;

  const playerHp = hpBar(1, `${form.name}  Lv.${progress.level}`);
  const foeHp = hpBar(1, `${battle.foe.name}  Lv.${battle.foe.level}`);
  const textBox = h('div', { class: 'dialog__text' }, log[0].text);
  const playerSprite = h(
    'div',
    { class: 'stage__player' },
    spriteFor({ speciesId: species.id, type: species.type, stage: form.stage, size: 128 }),
  );
  const foeSprite = h('div', { class: 'stage__foe' }, bossSprite(report.boss, 120));

  const setHp = (bar, ratio) => {
    const fill = bar.querySelector('.hpbar__fill');
    const track = bar.querySelector('.hpbar__track');
    fill.style.width = `${Math.max(0, ratio) * 100}%`;
    track.classList.remove('hpbar--ok', 'hpbar--warn', 'hpbar--danger');
    track.classList.add(ratio > 0.5 ? 'hpbar--ok' : ratio > 0.2 ? 'hpbar--warn' : 'hpbar--danger');
  };

  const step = () => {
    if (idx >= log.length - 1) return false;
    idx++;
    const line = log[idx];
    textBox.textContent = line.text;
    if (typeof line.playerHp === 'number') setHp(playerHp, line.playerHp);
    if (typeof line.foeHp === 'number') setHp(foeHp, line.foeHp);
    const hitSide = line.kind === 'player' ? foeSprite : line.kind === 'foe' ? playerSprite : null;
    if (hitSide && line.dmg > 0) {
      hitSide.classList.remove('is-hit');
      void hitSide.offsetWidth;
      hitSide.classList.add('is-hit');
    }
    return true;
  };

  let timer = null;
  const autoplay = () => {
    stop();
    timer = setInterval(() => {
      if (!root.isConnected || !step()) stop();
    }, 900);
  };
  const stop = () => {
    if (timer) clearInterval(timer);
    timer = null;
  };
  const skipAll = () => {
    stop();
    while (step());
  };

  const root = h(
    'div',
    { class: 'screen screen--battle' },
    h(
      'button',
      { class: 'btn btn--ghost btn--sm', onClick: () => (stop(), navigate(`/battle/${report.season.id}`)) },
      '← 전적으로',
    ),
    h(
      'div',
      { class: 'stage' },
      h('div', { class: 'stage__row stage__row--foe' }, h('div', { class: 'stage__hp' }, foeHp), foeSprite),
      h('div', { class: 'stage__row stage__row--player' }, playerSprite, h('div', { class: 'stage__hp' }, playerHp)),
    ),
    h(
      'div',
      { class: 'dialog' },
      textBox,
      h(
        'div',
        { class: 'dialog__actions' },
        h('button', { class: 'btn btn--sm', onClick: step }, '▶ 다음'),
        h('button', { class: 'btn btn--sm', onClick: autoplay }, '자동 재생'),
        h('button', { class: 'btn btn--sm btn--ghost', onClick: skipAll }, '끝까지'),
      ),
    ),
    panel(
      '사용 기술 (점수 상위 KPI)',
      h(
        'div',
        { class: 'movelist' },
        movesFrom(entry.kpiScores).map((mv) =>
          h(
            'div',
            { class: 'move' },
            h('div', { class: 'move__head' }, typeChip(mv.type, { small: true }), h('strong', {}, mv.name)),
            h(
              'div',
              { class: 'move__meta' },
              h('span', {}, `위력 ${mv.power}`),
              h('span', {}, `명중 ${fmt.pct(mv.accuracy)}`),
              h('span', {}, mv.category === 'physical' ? '물리' : '특수'),
            ),
          ),
        ),
      ),
      h('p', { class: 'hint' }, `${member.name}의 이번 달 실적이 곧 기술의 위력과 명중률이 된다.`),
    ),
  );

  // 화면을 떠나면 타이머 정리
  const observer = new MutationObserver(() => {
    if (!root.isConnected) {
      stop();
      observer.disconnect();
    }
  });
  queueMicrotask(() => {
    if (root.parentNode) observer.observe(root.parentNode, { childList: true });
  });

  return root;
}

function medal(rank) {
  return rank === 1 ? '🥇' : rank === 2 ? '🥈' : rank === 3 ? '🥉' : String(rank);
}

function teamKpiTable(report) {
  const rows = KPIS.map((kpi) => {
    const scores = report.entries.map((e) => e.kpiScores.find((k) => k.kpiId === kpi.id));
    const avg = scores.reduce((s, k) => s + (k?.score || 0), 0) / Math.max(1, scores.length);
    const clear = scores.filter((k) => k?.cleared).length;
    return { kpi, avg, clear, total: scores.length };
  });
  return h(
    'table',
    { class: 'table' },
    h('thead', {}, h('tr', {}, h('th', {}, '항목'), h('th', {}, '영역'), h('th', {}, '팀 평균 점수'), h('th', {}, '달성 인원'))),
    h(
      'tbody',
      {},
      rows.map((r) =>
        h(
          'tr',
          {},
          h('td', {}, r.kpi.name),
          h('td', {}, typeChip(r.kpi.type, { small: true })),
          h('td', {}, fmt.score(r.avg)),
          h('td', {}, `${r.clear} / ${r.total}`),
        ),
      ),
    ),
  );
}

function suggestNextSeasonId(state) {
  const last = state.seasons.at(-1)?.id;
  const base = last ? new Date(`${last}-01T00:00:00`) : new Date();
  if (last) base.setMonth(base.getMonth() + 1);
  return `${base.getFullYear()}-${String(base.getMonth() + 1).padStart(2, '0')}`;
}

const NAV = [
  { path: '/home', label: '홈' },
  { path: '/dex', label: '도감' },
  { path: '/battle', label: '체육관' },
  { path: '/league', label: '리그' },
  { path: '/admin', label: '관리' },
];

function ctx(params = {}) {
  const state = store.get();
  const league = evaluateAll(state);
  const seasonId =
    params.seasonId ||
    state.settings.currentSeasonId ||
    league.seasonReports.at(-1)?.season.id;
  return { state, league, params, seasonId };
}

function shell(view, { state, league, seasonId }) {
  const path = currentPath();
  const header = h(
    'header',
    { class: 'topbar' },
    h(
      'a',
      { class: 'topbar__brand', href: '#/home' },
      h('span', { class: 'topbar__logo' }, '◓'),
      h('span', {}, '월간 업적 리그'),
    ),
    h(
      'nav',
      { class: 'topbar__nav' },
      NAV.map((n) =>
        h('a', { class: `topbar__link ${path.startsWith(n.path) ? 'is-on' : ''}`, href: `#${n.path}` }, n.label),
      ),
    ),
    h(
      'label',
      { class: 'topbar__season' },
      h(
        'select',
        {
          onChange: (e) => {
            store.setSetting('currentSeasonId', e.target.value);
            navigate(basePath(path));
          },
        },
        league.seasons.map((s) => h('option', { value: s.id, selected: s.id === seasonId }, fmt.season(s.id))),
      ),
    ),
  );

  return h(
    'div',
    { class: 'app' },
    header,
    h('main', { class: 'main' }, view),
    h(
      'footer',
      { class: 'footer' },
      `${state.settings.orgName || '트레이너 리그'} · 데이터는 브라우저에만 저장됩니다 · `,
      h('a', { href: '#/admin' }, 'JSON 백업'),
    ),
  );
}

/** /battle/2026-07/m1 → /battle 처럼 시즌 전환 시 돌아갈 기본 경로 */
function basePath(path) {
  const seg = path.split('/')[1] || 'home';
  return `/${seg}`;
}

/** 경로가 바뀐 렌더에서만 맨 위로 올린다 (입력 중 재렌더 시 스크롤 유지) */
let lastPath = null;
let jumpToTop = true;

function mount(screenFn, params) {
  const c = ctx(params);
  const scrollY = jumpToTop ? 0 : window.scrollY;
  let view;
  try {
    view = screenFn(c);
  } catch (err) {
    console.error(err);
    view = emptyState(`화면을 그리는 중 오류가 발생했습니다: ${err.message}`);
  }
  clear(root);
  root.appendChild(shell(view, c));
  window.scrollTo(0, scrollY);
}

route('/home', () => mount(HomeScreen, {}));
route('/dex', () => mount(PokedexScreen, {}));
route('/dex/:id', (params) => mount(DetailScreen, params));
route('/battle', () => mount(BattleScreen, {}));
route('/battle/:seasonId', (params) => mount(BattleScreen, params));
route('/battle/:seasonId/:memberId', (params) => mount(BattleScreen, params));
route('/league', () => mount(LeagueScreen, {}));
route('/admin', () => mount(AdminScreen, {}));

setNotFound(() => mount(() => emptyState('없는 페이지입니다.', h('a', { class: 'btn', href: '#/home' }, '홈으로')), {}));

onNavigate((path) => {
  jumpToTop = path !== lastPath;
  lastPath = path;
});

// 데이터가 바뀌면 현재 화면을 다시 그린다
store.subscribe(() => render());

startRouter();

// 콘솔에서 밸런스 확인할 때 쓰라고 열어둔다
window.PokeReview = { store, evaluateAll };
})();
</script>
  </body>
</html>
